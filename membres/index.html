<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membres · FuryoGang</title>
<meta name="description" content="La famille FuryoGang : tous les membres, leurs badges et leur numéro d'inscription.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--blue:#4C9BFF}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:18px 16px 64px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:36px;margin:0}
.count{color:var(--paper-3);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 16px}
.chips button{flex:none;height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--ink-3);color:var(--paper-2);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:#305887;color:#fff}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:720px){.list{grid-template-columns:1fr 1fr}}
a.m{color:inherit;text-decoration:none}a.m:hover{background:#111}
.m{display:grid;grid-template-columns:auto 52px 1fr;align-items:center;gap:12px;background:var(--ink-2);border-radius:16px;padding:12px 14px}
.n{font-family:Antonio,sans-serif;font-size:20px;color:var(--paper-3);min-width:34px;text-align:right}
.m img,.m .ph{width:52px;height:52px;border-radius:50%;background:var(--ink-3);display:block}
.m b{display:block;font-size:15.5px}
.m small{color:var(--paper-3);font-size:12.5px}
.bs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.b{height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center}
.rs{display:flex;gap:8px;margin-top:5px;font-size:12.5px}
.rs a,.rs span{color:var(--paper-2);text-decoration:none}
.empty{color:var(--paper-3);text-align:center;margin:12vh 0}
</style>
</head>
<body>
<script src="/site/header.js?v=11"></script>
<script src="/site/badges.js?v=1"></script>
<main>
  <div class="top"><h1>Membres</h1><span class="count" id="count"></span></div>
  <div class="chips" id="chips"></div>
  <ul class="list" id="list"><li class="empty">Chargement…</li></ul>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Filtres : ordre d'inscription (par défaut), plus récents, avec badges, puis un filtre par badge de la base Notion.
let VUES = [
  ["tous", "Ordre d'inscription", () => true],
  ["recents", "Plus récents", () => true],
  ["badges", "Avec badges", m => m.badges.length > 0],
];
let ITEMS = [], V = "tous";
const dl = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
function draw(){
  document.getElementById("chips").innerHTML = VUES.map(([k, l]) => `<button data-v="${k}" aria-pressed="${V === k}">${l}</button>`).join("");
  const f = VUES.find(x => x[0] === V)[2];
  let l = ITEMS.filter(f); if (V === "recents") l = l.slice().reverse();
  document.getElementById("list").innerHTML = l.map(m => { const tag = m.slug ? "a" : "div";
    return `<li><${tag} class="m"${m.slug ? ` href="/membres/${encodeURIComponent(m.slug)}"` : ""}><span class="n">${m.num ?? ""}</span>${m.photo ? `<img src="${esc(m.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="ph"></span>`}
    <div><b>${esc(m.pseudo || "Membre")}</b><small>Membre n°${m.num ?? "?"} · depuis le ${dl(m.inscrit)}${m.points ? ` · ${m.points} pts` : ""}</small>
    ${m.badges.length ? `<div class="bs">${m.badges.map(FG_BADGES.pastille).join("")}</div>` : ""}
    ${m.reseaux && (m.reseaux.instagram || m.reseaux.x || m.reseaux.discord) ? `<div class="rs">${m.reseaux.instagram ? `<span>Instagram</span>` : ""}${m.reseaux.x ? `<span>X</span>` : ""}${m.reseaux.discord ? `<span>Discord</span>` : ""}</div>` : ""}</div></${tag}></li>`; }).join("") || `<li class="empty">Personne ici pour l'instant.</li>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { V = b.dataset.v; draw(); } });
fetch("/api/membres").then(r => r.json()).then(j => { ITEMS = j.items || [];
  // Un filtre par badge, seulement pour les badges que quelqu'un a déjà.
  for (const b of j.catalogue || []) if (ITEMS.some(m => m.badges.some(x => x.id === b.id))) VUES.push(["b" + b.id, b.n, m => m.badges.some(x => x.id === b.id)]); document.getElementById("count").textContent = `${j.total || 0} membre${(j.total || 0) > 1 ? "s" : ""}`; draw(); })
  .catch(() => { document.getElementById("list").innerHTML = `<li class="empty">Impossible de charger les membres.</li>`; });
</script>
</body>
</html>
