<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Back-office · FuryoGang</title>
<meta name="theme-color" content="#141416">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"></noscript>
<style>
/* Back-office : valider et publier les fiches séries, vite, depuis le téléphone. Écrit directement dans Notion. */
:root{
  --ink:#232325; --ink-2:#000; --ink-3:#38383B; --line:#2C2C2F;
  --paper:#F5F5F7; --paper-2:#CFCFD4; --paper-3:#98989D;
  --blue:#2D74D2; --blue-2:#6FA8F5; --red:#E54839; --ok:#7BC67E; --amber:#F2B33D;
  --f-display:"Antonio","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;background:#141416;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand .home{color:inherit;text-decoration:none}
.brand b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.brand b span{color:var(--paper-3);font-size:16px;margin-left:6px}
.out{border:0;background:transparent;color:var(--paper-3);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--paper-2)}
.prog .bar{flex:1;height:8px;border-radius:4px;background:var(--ink-3);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-2));min-width:4px}
.prog b{color:var(--paper)}
.q{width:100%;height:44px;margin-top:10px;border:0;border-radius:12px;background:var(--ink-3);padding:0 14px;outline:none}
.q::placeholder{color:var(--paper-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
/* Validation sur téléphone : menu déroulant à la place des pastilles */
.vselw{display:none;position:relative;margin-top:10px}
.vselw::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--paper-2);border-bottom:2px solid var(--paper-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.vsel{width:100%;height:44px;border:1px solid var(--line);border-left:6px solid var(--c,transparent);border-radius:12px;background:var(--ink-2,#1C1C1E);color:var(--paper);font:600 16px Inter,sans-serif;padding:0 40px 0 14px;-webkit-appearance:none;appearance:none;cursor:pointer}
@media (max-width:700px){#vchips{display:none}.vselw{display:block}html,body{overflow-x:hidden}}
.chip{flex:none;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--paper-2);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:#305887;border-color:#305887;color:#fff}
.chip small{font-size:11px;opacity:.75}
main{max-width:900px;margin:0 auto;padding:12px 16px 80px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.it{cursor:pointer;background:var(--ink-2);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.th{grid-column:1;grid-row:1/3;width:50px;aspect-ratio:5/7;border-radius:6px;background:var(--ink-3);overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--paper-3);grid-row:span 2}
.th img{width:100%;height:100%;object-fit:cover}
.nm{min-width:0}
.nm b{display:block;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;font-size:12px;color:var(--paper-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.etat{height:26px;border:0;border-radius:7px;padding:0 6px;font-size:12px!important;font-weight:700;cursor:pointer;-webkit-appearance:none;appearance:none}
.etat[data-e="À faire"]{background:var(--ink-3);color:var(--paper-2)}
.etat[data-e="En cours"]{background:color-mix(in srgb,var(--amber) 22%,var(--ink-3));color:var(--amber)}
.etat[data-e="À valider"]{background:color-mix(in srgb,#E0955F 24%,var(--ink-3));color:#F0A870}
.etat[data-e="Validée"]{background:color-mix(in srgb,var(--ok) 20%,var(--ink-3));color:var(--ok)}
.miss{color:#F08A7E}
.sns{height:26px;padding:0 9px;border-radius:7px;font-weight:700;display:inline-flex;align-items:center;color:var(--paper-3);background:var(--ink-3)}
.sns.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--ink-3))}
.done{color:var(--ok)}
/* Pastille d'avancement : rouge (0 %) → orange → vert (100 %) */
.ob{height:26px;padding:0 9px;border-radius:7px;font-weight:700;display:inline-flex;align-items:center;color:hsl(var(--h) 75% 62%);background:hsl(var(--h) 55% 22%)}
.leg{background:var(--ink-3);border-radius:12px;padding:10px 12px;margin-top:8px}
.leg-h{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.leg pre{margin:8px 0 0;white-space:pre-wrap;font:inherit;font-size:13.5px;line-height:1.45;color:var(--paper)}
.leg-no{margin:6px 0 0;font-size:12.5px;color:var(--paper-3)}
.cp{width:36px;height:36px;padding:0;border:0;border-radius:50%;background:#305887;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s}
.cp svg{width:17px;height:17px;display:block}
.cp:active{transform:scale(.88)}
.cp.done{background:var(--ok)}
.chk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.chk li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk .ok{color:var(--ok)}.chk .ko{color:#F08A7E}
.leg textarea{width:100%;min-height:120px;margin-top:8px;border:0;border-radius:10px;background:var(--ink-2);padding:10px 12px;font-size:14px!important;line-height:1.45;resize:vertical;outline:none}
.leg .n{font-size:12px;font-weight:600;color:var(--paper-3);margin-left:auto;margin-right:10px}
.leg .n.over{color:#F08A7E}
.lg{font-weight:700;margin-left:6px}.lg.ok{color:var(--ok)}.lg.mid{color:var(--amber)}.lg.ko{color:#F08A7E}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.dl button{height:40px;padding:0 14px 0 12px;border:0;border-radius:20px;background:var(--ink-3);color:var(--paper);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.dl button svg{width:17px;height:17px}
.dl button.busy{opacity:.55;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.sheet img{max-width:100%;max-height:70vh;border-radius:10px;-webkit-touch-callout:default}
.sheet p{margin:0;color:var(--paper-2);font-size:13px;text-align:center}
.sheet .row{display:flex;gap:10px}
.sheet button{height:46px;padding:0 20px;border:0;border-radius:23px;font-weight:700;cursor:pointer}
.sheet .go{background:#305887;color:#fff}.sheet .no{background:var(--ink-3);color:var(--paper)}
.heart{border:0;background:transparent;padding:4px;cursor:pointer;display:grid;place-items:center;color:var(--paper-3)}
.heart svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;transition:transform .15s}
.heart[aria-pressed="true"]{color:var(--red)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.heart:active svg{transform:scale(.85)}
.chip .hi{width:13px;height:13px;fill:var(--red);vertical-align:-2px;margin-right:4px}
.next{height:26px;border:1px dashed var(--line);border-radius:7px;background:transparent;color:var(--paper-3);font-size:12px;font-weight:700;padding:0 8px;cursor:pointer}
.next[aria-pressed=true]{border:0;background:color-mix(in srgb,var(--blue) 26%,var(--ink-3));color:var(--blue-2)}
/* Statut sur le site : À valider / Admins / En ligne */
.stw{display:flex;align-items:center}.stw.busy{opacity:.5;pointer-events:none}
.st{height:30px;border:0;border-radius:15px;padding:0 12px;font:700 12px Inter,sans-serif;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;background:var(--ink-3);color:var(--paper-2)}
.st[data-v="À valider"]{background:color-mix(in srgb,var(--amber) 20%,var(--ink-3));color:var(--amber)}
.st[data-v="Validé · admins"]{background:#6A4BC4;color:#fff}
.st[data-v="En ligne · public"]{background:color-mix(in srgb,var(--ok) 22%,var(--ink-3));color:var(--ok)}
.st option{background:#1C1C1E;color:#fff}
/* Interrupteur (autres écrans) */
.sw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--paper-3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{position:relative;width:48px;height:28px;border-radius:14px;background:var(--ink-3);transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i::after{transform:translateX(20px)}
.sw input:checked ~ span{color:var(--ok)}
.sw.busy{opacity:.5;pointer-events:none}
.more{grid-column:1/4;display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:10px}
.it.open .more{display:block}
.more label{display:block;font-size:12px;color:var(--paper-3);margin:8px 0 4px}
.more input,.more textarea{width:100%;border:0;border-radius:10px;background:var(--ink-3);padding:10px 12px;outline:none}
.more textarea{min-height:70px;resize:vertical}
.links{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:600}
.links a{color:var(--blue-2);text-decoration:none}
.save{margin-top:10px;height:40px;padding:0 18px;border:0;border-radius:20px;background:#305887;color:#fff;font-weight:700;cursor:pointer}
.tog{border:0;background:transparent;color:var(--paper-3);font-size:12px;font-weight:600;cursor:pointer;padding:0}
.count{margin:4px 0 10px;font-size:12.5px;color:var(--paper-3)}
.empty{color:var(--paper-3);text-align:center;padding:40px 0}
.tris{display:flex;align-items:center;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tris span{font-size:12px;color:var(--paper-3);margin-right:2px;white-space:nowrap}
.tris button{border:0;background:transparent;color:var(--paper-3);font:inherit;font-size:13px;font-weight:600;padding:5px 10px;border-radius:14px;cursor:pointer;white-space:nowrap}
.tris button[aria-pressed="true"]{background:var(--ink-3);color:var(--paper)}
.prog .pr{color:var(--ok);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
/* Connexion */
.login{max-width:360px;margin:16vh auto 0;padding:0 16px;text-align:center}
.login h1{font-family:var(--f-display);text-transform:uppercase;font-size:34px;margin:0 0 4px}
.login p{color:var(--paper-3);margin:0 0 18px;font-size:14px}
.login input{width:100%;height:48px;border:0;border-radius:14px;background:var(--ink-3);padding:0 16px;outline:none;text-align:center}
.login button{width:100%;height:48px;margin-top:10px;border:0;border-radius:24px;background:#305887;color:#fff;font-weight:700;cursor:pointer}
.login .err{color:#F08A7E;margin-top:12px;font-size:14px;min-height:20px}
/* ---------- Accueil du back-office : deux gros blocs ---------- */
.hub{max-width:900px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:14px}
@media (min-width:700px){.hub{grid-template-columns:1fr 1fr}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:168px;padding:20px;border-radius:22px;background:var(--ink-2);border:1px solid var(--line);color:inherit;text-decoration:none;overflow:hidden;transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.98)}
@media (hover:hover){.tile:hover{border-color:var(--paper-3)}}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#305887;color:#fff}
.tile .ic svg{width:26px;height:26px}
.tile h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.tile p{margin:6px 0 0;color:var(--paper-3);font-size:14px}
.tile .n{position:absolute;top:20px;right:20px;min-width:44px;height:44px;padding:0 12px;border-radius:22px;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:700;background:var(--ink-3);color:var(--paper)}
.tile.val{background:linear-gradient(160deg,#1E3A2A,#000 70%);border-color:#2E7D4F}
.tile.val .ic{background:#2E7D4F}
.tile.val .n{background:#2E7D4F;color:#fff}
.back{border:0;background:transparent;color:var(--paper-2);font-size:14px;font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
/* ---------- Validation (veille) ---------- */
.vl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.vi{display:grid;grid-template-columns:44px auto minmax(0,1fr);align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:14px;background:var(--ink-2);cursor:pointer}
.vi:active{background:#0d0d0e}
.vi time{font-size:12.5px;font-weight:600;color:var(--paper-3);font-variant-numeric:tabular-nums}
.vi .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:#111;background:var(--c)}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true] .d{background:#fff}
.vhint{margin:4px 0 12px;font-size:12.5px;color:var(--paper-3)}
/* Fenêtre de détail : feuille du bas sur téléphone, fenêtre centrée sur ordinateur */
.vm{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.vm-b{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--ink);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--line)}
@media (max-width:699px){.vm-b{max-width:none;height:100%;max-height:100%;border-radius:0;border-top:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}}
@media (min-width:700px){.vm{align-items:center}.vm-b{border-radius:22px;border:1px solid var(--line)}}
.vm .tabs{display:flex;gap:6px;margin:14px 0 8px;clear:both}
.vm .tabs button{flex:1 1 auto;white-space:nowrap;padding:0 10px;height:36px;border:0;border-radius:18px;background:var(--ink-3);color:var(--paper-3);font-weight:700;font-size:13px;cursor:pointer}
.vm .tabs button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.vm textarea.cap{min-height:280px}
.vm .cnt{font-size:12px;color:var(--paper-3);margin-left:auto;align-self:center}
.vm .cnt.ko{color:#F08A7E;font-weight:700}
.vm .vimg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.vm .vimg>button{height:38px;padding:0 14px;border:0;border-radius:19px;background:#2E7D4F;color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.vm .vimg>button svg{width:16px;height:16px}
.vm .vimg>button.busy{opacity:.55;pointer-events:none}
.vm .seg{display:inline-flex;background:var(--ink-3);border-radius:19px;padding:3px}
.vm .seg button{height:32px;padding:0 12px;border:0;border-radius:16px;background:none;color:var(--paper-3);font-weight:700;font-size:12.5px;cursor:pointer}
.vm .seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.vm .rs{display:flex;gap:8px;align-items:flex-start}
.vm .rs textarea{min-height:88px;flex:1}
.vm .rs button{height:38px;padding:0 12px;border:0;border-radius:19px;background:var(--ink-3);color:var(--paper);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.nimg{margin:4px 0 12px}.nimg-v{border:1px solid #48484C;border-radius:12px;min-height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
.nimg-v img{display:block;width:100%;max-height:340px;object-fit:contain}.nimg-v span{color:var(--paper-2);font-size:13px;padding:14px;text-align:center}
.ncrop{margin-top:12px}.ncrop label{display:block;margin-bottom:6px}.ncrop-v{aspect-ratio:16/9;border-radius:12px;background:#000 no-repeat;background-size:cover;border:1px solid #48484C}
.ncrop-r{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.ncrop-r input{flex:1;min-width:120px;accent-color:#4C9BFF}.ncrop-r b{min-width:44px;text-align:right;font-size:13px;color:var(--paper-2)}
.nimg-r{display:flex;gap:6px;align-items:flex-start}.nimg-r .vvid{flex:1;min-width:0}
.vm .nimg-b{flex:none;margin:0;font-size:13px;height:42px;padding:0 12px;border:1px solid #48484C;border-radius:12px;background:transparent;color:var(--paper);font:600 13px Inter,sans-serif;display:inline-flex;align-items:center;cursor:pointer}
.vvid{width:100%;height:42px;padding:0 14px;border:1px solid #48484C;border-radius:12px;background:transparent;color:var(--paper);font:400 15px Inter,sans-serif;margin-bottom:6px}
.vm-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--paper-3);white-space:nowrap;min-width:0;flex-wrap:wrap;row-gap:6px}
.vm-h>span:not(.pc){overflow:hidden;text-overflow:ellipsis;min-width:0}
.vm-h .x{flex:none}
.pcs{position:relative;flex:none;max-width:70%;display:inline-flex;align-items:center;height:30px;border-radius:8px;color:#111;background:var(--c)}
.pcs select{appearance:none;-webkit-appearance:none;height:30px;padding:0 26px 0 10px;border:0;background:transparent;color:#111;font-family:inherit;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.pcs::after{content:"▾";position:absolute;right:9px;font-size:11px;pointer-events:none}
.pcs option{color:#000}
.pcs.vide,.pcs.vide select{color:#F5F5F7}.pcs.vide select{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vm-h .x{margin-left:auto;width:36px;height:36px;border:0;border-radius:50%;background:var(--ink-3);color:var(--paper);font-size:18px;cursor:pointer}
.vm h2{margin:10px 0 4px;font-size:19px;line-height:1.3}
.vm .sr{font-size:13px;color:var(--paper-3);margin:0 0 10px}
.vm .sr a{color:var(--blue-2);text-decoration:none}
.vm .cv{float:right;width:96px;margin:0 0 8px 12px;border-radius:8px;background:var(--ink-3)}
.vm .cv.big{float:none;display:block;width:min(240px,62%);margin:12px auto 4px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.vm dl{margin:10px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.vm dt{color:var(--paper-3)}.vm dd{margin:0;overflow-wrap:anywhere}
.vm label{display:block;clear:both;font-size:12px;color:var(--paper-3);margin:12px 0 4px}
.vm textarea{width:100%;min-height:120px;color:var(--paper);font-family:inherit;border:0;border-radius:12px;background:var(--ink-3);padding:10px 12px;font-size:15px!important;line-height:1.45;resize:vertical;outline:none}
.vm .srcs{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 0;font-size:13px;font-weight:600}
.vm .srcs a{color:var(--blue-2);text-decoration:none}
.vm .tools{display:flex;gap:8px;margin-top:12px}
.vm .tools button{height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--ink-3);color:var(--paper);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.vm .tools button svg{width:16px;height:16px}
.vm .tools button:disabled{opacity:.45;cursor:default}
.vm .act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.vm .act button{height:48px;border:0;border-radius:24px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--ink-3);color:var(--paper)}
.vm .act .go{grid-column:1/3;background:#2E7D4F;color:#fff}
.vm .act .rej{color:#F08A7E}
.vm .act button.busy{opacity:.5;pointer-events:none}
.vm .note{grid-column:1/3;margin:0;font-size:12px;color:var(--paper-3);text-align:center}
/* Éditeur plein écran des textes de la fiche (Will, 05/10/2026) */
.ed{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.ed-b{width:100%;max-width:760px;height:min(92vh,900px);background:#1C1C1E;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box}
@media (min-width:720px){.ed{align-items:center}.ed-b{border-radius:22px;height:min(86vh,860px)}}
.ed-h{display:flex;align-items:center;gap:10px}.ed-h b{font:700 18px/1.1 Antonio,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-x{width:36px;height:36px;border:0;border-radius:50%;background:#38383B;color:#F5F5F7;font-size:18px;cursor:pointer;flex:none}
.ed-t{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.ed-t::-webkit-scrollbar{display:none}
.ed-t button{flex:none;height:34px;padding:0 13px;border:0;border-radius:17px;background:#38383B;color:#CFCFD4;font:600 13px Inter,sans-serif;cursor:pointer}
.ed-t button[aria-pressed=true]{background:#305887;color:#fff}
.ed textarea{flex:1;width:100%;box-sizing:border-box;resize:none;padding:14px;border:1px solid #48484C;border-radius:14px;background:#000;color:#F5F5F7;font:400 16px/1.55 Inter,sans-serif}
.ed-f{display:flex;align-items:center;gap:8px}.ed-f .n{flex:1;font-size:12.5px;color:#98989D}.ed-f .n.ko{color:#E5483A}
.ed-f button{height:44px;padding:0 18px;border:0;border-radius:22px;font:700 14px Inter,sans-serif;cursor:pointer}
.ed-f .ok{background:#38383B;color:#F5F5F7}.ed-f .sv{background:#305887;color:#fff}
.more textarea[data-f],.leg-h b{cursor:pointer}
</style>

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="/site/fiche-card.js?v=3"></script>
<script src="/site/tome-card.js?v=3"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root = document.getElementById("root");
const ETATS = ["À faire", "En cours", "À valider", "Validée"];
const ICO_COPY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>`;
const ICO_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
// Copie fiable aussi sur iPhone : presse-papiers moderne, sinon l'ancienne méthode (zone de texte cachée).
async function copier(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
  const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok;
}
const ICO_DL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>`;
const NOMS = { ig: "Instagram", tt: "TikTok", x: "X" };
const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S3 15 3 8.8C3 6 5.1 4 7.7 4c1.8 0 3.3 1 4.3 2.4C13 5 14.5 4 16.3 4 18.9 4 21 6 21 8.8 21 15 12 20.5 12 20.5z"/></svg>`;
// Prête = tous les éléments ★ obligatoires sont faits, pas encore publiée : c'est là qu'on pioche chaque semaine.
const pret = s => !s.publier && s.oblig.length > 0 && s.manque.length === 0;
// Statut de la série (colonne « Statut » dans Notion, Will 06/10/2026) : À valider / Validé · admins / En ligne · public.
const ST = [["À valider", "À valider"], ["Validé · admins", "Admins"], ["En ligne · public", "En ligne"]];
const FILTRES = [
  ["valider", "À valider", s => s.statut === "À valider" && !pret(s)],
  ["pretes", "Prêtes à publier", pret],
  ["admins", "Admins", s => s.statut === "Validé · admins"],
  ["coeur", HEART.replace("<svg ", '<svg class="hi" ') + "Coups de cœur", s => s.coeur && !s.publier],
  ["ligne", "En ligne", s => s.publier],
  ["tout", "Tout", () => true],
];
// Tri : A→Z, presque finies d'abord (le moins à faire), ou à travailler d'abord (le plus à faire).
const TRIS = [["az", "A → Z"], ["peu", "Presque finies"], ["beaucoup", "À travailler"]];
let ITEMS = [], F = "valider", Q = "", T = "az";
const slugify = s => String(s || "").replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/æ/g, "ae").replace(/Æ/g, "AE").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1800); }

function login(msg){
  root.innerHTML = `<form class="login" id="lf"><h1>Back-office</h1><p>FuryoGang · accès administrateur</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button>Se connecter</button><p style="margin:14px 0 8px;color:var(--paper-3);font-size:13px">ou</p><div id="gbtn" style="display:flex;justify-content:center;color-scheme:light"></div><div class="err" id="err">${esc(msg || "")}</div></form>`;
  // Connexion avec le compte Google de l'administrateur.
  const g = () => { google.accounts.id.initialize({ client_id: "923817714860-h88lmvr2bnvninn41ioa19iv2lrd2ed5.apps.googleusercontent.com", callback: async r => {
      const x = await fetch("/api/auth/google", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: r.credential }) });
      const j = await x.json().catch(() => ({}));
      if (j.admin) route(); else document.getElementById("err").textContent = j.ok ? "Ce compte Google n'est pas administrateur." : (j.error || "Connexion impossible.");
    } });
    google.accounts.id.renderButton(document.getElementById("gbtn"), { theme: "filled_black", shape: "pill", size: "large", text: "continue_with", locale: "fr", width: 280 }); };
  if (window.google && google.accounts) g(); else { const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true; sc.onload = g; document.head.appendChild(sc); }
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("/api/admin/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) route(); else document.getElementById("err").textContent = j.error || "Connexion impossible.";
  };
}
async function load(){
  root.innerHTML = `<p class="empty">Chargement des séries…</p>`;
  const r = await fetch("/api/admin/series");
  if (r.status === 401) return login();
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { root.innerHTML = `<p class="empty">${esc(j.error || "Impossible de charger.")}</p>`; return; }
  ITEMS = j.items || [];
  F = ITEMS.some(s => s.statut === "Validé · admins") ? "admins" : ITEMS.some(pret) ? "pretes" : "valider";
  shell(); draw();
}
function shell(){
  root.innerHTML = `<header class="top"><div class="top-in">
      <div class="brand"><a class="back" href="#">‹ Back-office</a><b style="font-family:var(--f-display);font-size:22px;text-transform:uppercase">Base mangas</b></div>
      <div class="prog" id="prog"></div>
      <input class="q" id="q" type="search" placeholder="Chercher une série" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="tris" id="tris"></div></div></header>
    <main><p class="count" id="count"></p><ul class="list" id="list"></ul></main>`;
  document.getElementById("q").oninput = e => { Q = e.target.value.trim(); draw(); };
}
function draw(){
  const on = ITEMS.filter(s => s.publier).length, tot = ITEMS.length;
  const pr = ITEMS.filter(pret).length;
  document.getElementById("prog").innerHTML = `<span><b>${on}</b> en ligne / ${tot}</span><span class="pr"><b>${pr}</b> prête${pr > 1 ? "s" : ""}</span><span class="bar"><i style="width:${tot ? on / tot * 100 : 0}%"></i></span><span>${tot ? (on / tot * 100).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) : 0} %</span>`;
  document.getElementById("chips").innerHTML = FILTRES.map(([k, l, f]) => `<button class="chip" data-f="${k}" aria-pressed="${F === k}">${l} <small>${ITEMS.filter(f).length}</small></button>`).join("");
  const n = slugify(Q), keep = FILTRES.find(x => x[0] === F)[2];
  const list = ITEMS.filter(s => (n ? slugify([s.t, s.fr, s.jp].join(" ")).includes(n) || (s.jp || "").includes(Q) : keep(s)));
  const reste = s => s.manque.length;
  if (T === "peu") list.sort((a, b) => reste(a) - reste(b) || a.t.localeCompare(b.t, "fr"));
  if (T === "beaucoup") list.sort((a, b) => reste(b) - reste(a) || a.t.localeCompare(b.t, "fr"));
  document.getElementById("tris").innerHTML = `<span>Trier</span>` + TRIS.map(([k, l]) => `<button data-t="${k}" aria-pressed="${T === k}">${l}</button>`).join("");
  document.getElementById("count").textContent = `${list.length} série${list.length > 1 ? "s" : ""}${n ? " trouvée" + (list.length > 1 ? "s" : "") : ""}`;
  document.getElementById("list").innerHTML = list.slice(0, 300).map(row).join("") || `<li class="empty">Rien ici pour l'instant.</li>`;
}
function row(s){
  return `<li class="it" data-id="${s.id}">
    <span class="th">${s.cover ? `<img src="/api/couv?u=${encodeURIComponent(s.cover)}" alt="" loading="lazy">` : esc((s.jp || "").slice(0, 2))}</span>
    <span class="nm"><b>${esc(s.fr && s.fr !== s.t ? s.fr : s.t)}</b><small>${esc([s.fr && s.fr !== s.t ? s.t : "", s.jp].filter(Boolean).join(" · "))}</small></span>
    <label class="stw"><select class="st" data-st data-v="${esc(s.statut)}" aria-label="Statut sur le site">${ST.map(([v, l]) => `<option value="${v}"${s.statut === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <div class="meta">
      <button class="heart" data-coeur aria-pressed="${s.coeur}" aria-label="Coup de cœur : à traiter en premier">${HEART}</button>
      ${(() => { const ok = s.oblig.length - s.manque.length, r = s.oblig.length ? ok / s.oblig.length : 0;
        return `<span class="ob" style="--h:${Math.round(r * 120)}">★ ${ok}/${s.oblig.length}</span>`; })()}
      ${s.sns && s.sns.tot ? `<span class="sns${s.sns.ok >= s.sns.tot ? " ok" : ""}" title="Réseaux des auteurs (facultatif)">SNS ${s.sns.ok}/${s.sns.tot}</span>` : ""}
      ${s.exFR ? `<span class="sns${s.exFR.ok ? " ok" : ""}" title="${s.exFR.lien ? "Extrait FR trouvé" : s.exFR.aucun ? "Pas d'extrait FR (vérifié)" : "Extrait FR à chercher (facultatif)"}">Extrait FR${s.exFR.lien ? " ✓" : s.exFR.aucun ? " —" : ""}</span>` : ""}
    </div>
    <div class="more">
      <label>★ Éléments obligatoires</label>
      <ul class="chk">${s.oblig.map(o => `<li class="${o.ok ? "ok" : "ko"}">${o.ok ? "✓" : "✗"} ${esc(o.k)}</li>`).join("")}</ul>
      <label>N° de fiche <span class="lg" data-numw></span></label>
      <input data-f="num" type="number" min="1" inputmode="numeric" value="${s.num || ""}" placeholder="automatique" style="max-width:160px">
      <label>Image de la fiche (crème)</label>
      <div class="dl"><button data-dl="post">${ICO_DL} Post 3:4</button><button data-dl="story">${ICO_DL} Story 9:16</button></div>
      <label>Résumé de l'image <span class="lg" data-lg></span></label>
      <textarea data-f="resumeImg" placeholder="${esc(s.resume)}">${esc(s.resumeImg)}</textarea>
      <label>Résumé du site (peut être long)</label>
      <textarea data-f="resume" placeholder="Résumé de la série">${esc(s.resume)}</textarea>
      <label>Légendes réseaux sociaux</label>
      ${["ig", "tt", "x"].map(k => `<div class="leg"><div class="leg-h"><b>${NOMS[k]}</b><span class="n" data-n="${k}"></span><button class="cp" data-cp="${k}" aria-label="Copier la légende ${NOMS[k]}">${ICO_COPY}</button></div><textarea data-f="${k}" placeholder="Pas encore de légende">${esc(s.leg && s.leg[k])}</textarea></div>`).join("")}
      <button class="save" data-save>Enregistrer le résumé et les légendes</button>
      <div class="links"><a href="${esc(s.notion)}" target="_blank" rel="noopener">Ouvrir dans Notion ↗</a>${s.visible ? `<a href="/series/${esc(s.slug)}" target="_blank" rel="noopener">Voir sur le site ↗</a>` : ""}${s.date ? `<span style="color:var(--paper-3)">Publiée le ${new Date(s.date + "T12:00:00").toLocaleDateString("fr-FR")}</span>` : ""}</div>
    </div></li>`;
}
async function send(s, patch, el){
  el && el.classList.add("busy");
  // Enregistrer des textes ne redessine pas la liste (la fiche ouverte reste ouverte).
  const textes = "legX" in patch || "resume" in patch;
  try {
    const r = await fetch("/api/admin/update", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: s.id, slug: s.slug, date: s.date, ...patch }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) return login("Session expirée, reconnecte-toi.");
    if (!r.ok) throw new Error(j.error || "Erreur");
    Object.assign(s, patch, { statut: j.statut, publier: j.publier, date: j.date || s.date });
    if (textes) { toast("Enregistré ✓"); return; }
    toast(patch.statut === "En ligne · public" ? "En ligne pour tout le monde ✓" : patch.statut === "Validé · admins" ? "Visible seulement par les admins ✓" : patch.statut ? "À valider : retirée du site" : "Enregistré ✓");
  } catch (e) { toast(e.message.slice(0, 80)); }
  finally { if (!textes) draw(); else el && el.classList.remove("busy"); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]"); if (t) { T = t.dataset.t; draw(); return; }
  const c = e.target.closest(".chip[data-f]"); if (c) { F = c.dataset.f; Q = ""; const q = document.getElementById("q"); if (q) q.value = ""; draw(); return; }
  const li = e.target.closest(".it"); if (!li) return;
  const s = ITEMS.find(x => x.id === li.dataset.id);
  // Un appui n'importe où sur la carte (hors boutons et champs) la déplie ou la replie.
  if (!e.target.closest("button, select, input, textarea, label, a, .more")) { li.classList.toggle("open"); compter(li); return; }
  const cp = e.target.closest("[data-cp]");
  if (cp) { const nom = { ig: "Instagram", tt: "TikTok", x: "X" }[cp.dataset.cp];
    copier(li.querySelector(`[data-f="${cp.dataset.cp}"]`).value).then(ok => {
      if (!ok) { toast("Copie impossible, sélectionne le texte à la main"); return; }
      cp.innerHTML = ICO_OK; cp.classList.add("done"); toast(`Légende ${nom} copiée ✓`);
      setTimeout(() => { cp.innerHTML = ICO_COPY; cp.classList.remove("done"); }, 1800);
    }); return; }
  if (e.target.closest("[data-coeur]")) { send(s, { coeur: !s.coeur }); return; }
  if (e.target.closest("[data-save]")) { const v = k => li.querySelector(`[data-f="${k}"]`).value;
    send(s, { num: v("num"), resume: v("resume").trim(), resumeImg: v("resumeImg").trim(), legIG: v("ig"), legTT: v("tt"), legX: v("x") }).then(() => { s.num = +v("num") || null; AV = null; s.resume = v("resume").trim(); s.resumeImg = v("resumeImg").trim(); s.leg = { ig: v("ig"), tt: v("tt"), x: v("x") }; }); return; }
  const dlb = e.target.closest("[data-dl]"); if (dlb) { imageFiche(s, dlb.dataset.dl, li, dlb); }
});
// Compteur de la légende X (un lien compte pour 23 caractères sur X).
const xLen = t => t.replace(/furyogang\.com\/\S*/g, "x".repeat(23)).length;
function compter(li){ if (!li) return; const n = li.querySelector('[data-n="x"]'), t = li.querySelector('[data-f="x"]'); if (!n || !t) return;
  const l = xLen(t.value); n.textContent = l + " / 280"; n.classList.toggle("over", l > 280);
  // Résumé de l'image : 5 lignes idéal, 6 si pas le choix (sans remplir la 6e jusqu'au bout), jamais plus.
  const ri = li.querySelector('[data-f="resumeImg"]'), lg = li.querySelector("[data-lg]");
  if (ri && lg && window.FG_FICHE) FG_FICHE.pret().then(() => { const txt = ri.value.trim() || li.querySelector('[data-f="resume"]').value.trim();
    const m = FG_FICHE.lignes(txt), plein = m.n === 6 && m.fill > 0.9;
    lg.textContent = `${m.n} ligne${m.n > 1 ? "s" : ""}${m.n > 6 ? " · trop long, le texte sera coupé" : plein ? " · 6e ligne pleine, à raccourcir" : m.n === 6 ? " · ok si pas le choix" : " ✓"}`;
    lg.className = "lg " + (m.n <= 5 ? "ok" : m.n === 6 && !plein ? "mid" : "ko"); });
  ["ig", "tt"].forEach(k => { const m = li.querySelector(`[data-n="${k}"]`), v = li.querySelector(`[data-f="${k}"]`); if (m && v) m.textContent = v.value.length + " car."; }); }
document.addEventListener("input", e => {
  if (e.target.matches('[data-f="num"]')) { const li = e.target.closest(".it"), s = ITEMS.find(x => x.id === li.dataset.id), n = +e.target.value, w = li.querySelector("[data-numw]");
    const autre = n && ITEMS.find(x => x !== s && x.num === n); w.textContent = autre ? `déjà pris par ${autre.fr || autre.t}` : ""; w.className = "lg ko"; return; }
  if (e.target.matches("[data-f]")) compter(e.target.closest(".it")); });
// Image « Nouvelle fiche » (crème), avec le résumé tel qu'il est dans le champ.
let AV = null;
const shownT = s => (s.t && s.fr && s.t === s.t.toUpperCase() && /[A-Z]/.test(s.t) && s.t.toLowerCase() === s.fr.toLowerCase()) ? s.t : (s.fr || s.t);
async function imageFiche(s, fmt, li, btn){
  btn.classList.add("busy"); const lbl = btn.innerHTML; btn.innerHTML = "Génération…";
  try {
    if (!AV) AV = await fetch("/api/avancement").then(r => r.json()).catch(() => ({}));
    const rang = (AV.series || []).find(x => x.slug === s.slug);
    const d = { t: shownT(s), jp: s.jp, cover: s.cover, type: s.type, genres: s.genres || [], y1: s.y1,
      pubs: FG_FICHE.parts((s.pubFR || "").replace(/\s*\([^)]*\)/g, "")), scen: s.scen, dess: s.dess,
      resume: li.querySelector('[data-f="resumeImg"]').value.trim() || li.querySelector('[data-f="resume"]').value.trim(), n: rang ? rang.rang : (AV.enLigne || 0) + 1, tot: AV.total || ITEMS.length };
    const url = await FG_FICHE.png(d, { theme: "creme", fmt });
    const nom = `nouvelle-fiche-${s.slug}-${fmt}.png`;
    const blob = await (await fetch(url)).blob(), file = new File([blob], nom, { type: "image/png" });
    // Sur téléphone : aperçu + bouton pour l'enregistrer dans Photos (feuille de partage). Sur ordinateur : téléchargement direct.
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia("(pointer:coarse)").matches) {
      const sh = document.createElement("div"); sh.className = "sheet";
      sh.innerHTML = `<img src="${url}" alt=""><p>Touche « Enregistrer » puis « Enregistrer l'image », ou appuie longuement sur l'image.</p><div class="row"><button class="go">Enregistrer</button><button class="no">Fermer</button></div>`;

  for (let k = a.length; k >= 0; k--) { const hs = [...a.slice(0, k), ...f]; if (!hs.length) return []; if (ligne(hs) <= LIGNE_X && tient(hs)) return hs; }
  return f;
}
function postX(i, rs){
  const s = i.serie || {}, c = i.comptes || {};

  const base = `${catLigne(i)}${i.titre}\n${ligneSortie(i)}${rs ? `\n\n${rs}` : ""}\n\n↗ furyogang.com/series/${s.slug}`;
  const hs = choixX(c.x, c.xFR, h => poidsX(base + "\nX " + h.map(x => "@" + x).join(" · ")) <= 280);
  return base + (hs.length ? "\nX " + hs.map(h => "@" + h).join(" · ") : "");
}
// Résumé sortie proposé quand le champ est vide : la plus longue suite de phrases entières qui tient dans le post X
// avec tous les comptes ; sinon avec moins de comptes ; sinon la phrase la plus courte (Will retouche).
function resumeAuto(i){
  const s = i.serie || {}, cands = [];
  for (const t of [s.resumeImg, s.resume]) { const ph = phrases(t); ph.forEach((_, n) => cands.push(ph.slice(0, n + 1).join(" "))); } // toujours depuis la 1re phrase
  const u = [...new Set(cands)].sort((a, b) => b.length - a.length);
  if (!u.length) return "";
  // On cherche d'abord le résumé le plus long qui laisse passer tous les comptes retenus sur la ligne X, puis avec moins d'auteurs.
  const c = i.comptes || {}, plein = choixX(c.x, c.xFR, () => true);
  for (let k = plein.length; k >= 0; k--) {
    const ok = u.find(r => { const p = postX(i, r); return poidsX(p) <= 280 && (p.match(/\nX (.*)$/) || ["", ""])[1].split(" · ").filter(Boolean).length >= k; });
    if (ok) return ok;
  }

}
const tagOf = s => "#" + String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 ]/g, " ").split(" ").filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join("");
// Ligne de sortie ; « Dernier tome. » sur sa propre ligne (rien pour un premier tome : règle de Will, 03/10/2026).
function ligneSortie(i){
  const t = i.tome || {}, d = i.sortie;
  let q = "";
  if (d) { const o = new Date(d + "T12:00:00"); q = o.toLocaleDateString("fr-FR", { day: "numeric", month: "long", ...(o.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) }); q = q.replace(/^1 /, "1er "); }
  return (q ? `Sortie le ${q}` : "Sortie") + (t.pub ? ` chez ${t.pub}` : "") + "." + (t.flag === "dernier" ? "\nDernier tome." : "");
}
// Catégorie en première ligne des posts : la même que sur le site et dans Notion (Will, 04/10/2026).
function catLigne(i){ const k = i.catChoisie || i.cat, k2 = i.cat2Choisie !== undefined ? i.cat2Choisie : i.cat2; return NEWS_CATS.includes(k) ? `${[VCATS[k], ...(k2 && k2 !== k && NEWS_CATS.includes(k2) ? [VCATS[k2]] : [])].join(" · ")}\n` : ""; }
function captions(i, rs){
  const s = i.serie || {}, c = i.comptes || {}, url = s.slug ? `furyogang.com/series/${s.slug}` : "furyogang.com";
  const tags = [...new Set([tagOf(s.t), ...(s.genres || []).slice(0, 2).map(tagOf), "#manga", "#FuryoGang", ...(/-fr$/.test(i.cat) ? ["#mangafr"] : [])])].filter(x => x.length > 1);
  if (/^(couv|sortie)/.test(i.cat) && i.tome) {
    const res = rs ? `\n\n${rs}` : "";
    return {
      x: postX(i, rs),
      ig: `${catLigne(i)}🆕 ${i.titre}${s.jp ? ` (${s.jp})` : ""}\n📅 ${ligneSortie(i)}${res}\n\n📖 Fiche complète, extraits, trailer et couverture : toutes les infos sur furyogang.com (lien en bio).${(c.ig || []).length ? `\n📣 ${c.ig.map(h => "@" + h).join(" ")}` : ""}\n\n${tags.join(" ")}`,
      tt: `${catLigne(i)}🆕 ${i.titre}\n📅 ${ligneSortie(i)}${res}\n\n📖 Fiche complète sur furyogang.com${(c.tt || []).length ? `\n📣 ${c.tt.map(h => "@" + h).join(" ")}` : ""}\n\n${[...tags.slice(0, 4), "#mangatok"].join(" ")}`,
    };
  }
  const txt = (i.texte || "").trim();
  // Prépublication : le brouillon de tweet de la base sert de légende X.
  if (i.cat === "prepub" && i.tweet) return {
    x: `${i.tweet}${s.slug ? `\n↗ ${url}` : ""}${(c.x || []).length || (c.xFR || []).length ? "\nX " + choixX(c.x, c.xFR, () => true).map(h => "@" + h).join(" · ") : ""}`,
    ig: `📖 ${i.titre}${txt ? `\n\n${txt}` : ""}\n\n${i.tweet}\n\n📖 Toutes les infos sur furyogang.com (lien en bio).\n\n${tags.join(" ")}`,
    tt: `📖 ${i.titre}\n\n${i.tweet}\n\n📖 Infos sur furyogang.com\n\n${[...tags.slice(0, 4), "#mangatok"].join(" ")}`,
  };
  // Toutes les news : auteurs (puis éditeur) cités sous le lien, pour être repartagé (Will, 05/10/2026).
  // X ne dépasse JAMAIS 280 (Will, 05/10/2026) : on garde des phrases entières du résumé tant que ça tient,
  // on enlève les parenthèses du titre si besoin, et on cite au moins un compte quand il y en a un.
  const titres = [...new Set([i.titre, i.titre.replace(/\s*\([^)]*\)/g, "").replace(/^(nouvelle série|news)\s*:\s*/i, ""), String(i.serie && i.serie.t || i.titre)])];
  const ph = phrases(txt), resumes = [...ph.map((_, n) => ph.slice(0, n + 1).join(" ")).reverse(), ""];
  const nbC = ((c.x || []).length + (c.xFR || []).length) ? 1 : 0;
  let xBase = "", hs = [];
  trouve: for (const min of [nbC, 0]) for (const r of resumes) for (const t of titres) {
    const b = `${catLigne(i)}${t}${r ? `\n${r}` : ""}\n\n↗ ${url}`;
    if (poidsX(b) > 280) continue;
    let h = choixX(c.x, c.xFR, l => poidsX(b + "\nX " + l.map(x => "@" + x).join(" · ")) <= 280);
    if (h.length && poidsX(b + "\nX " + h.map(x => "@" + x).join(" · ")) > 280) h = [];
    if (h.length >= min) { xBase = b; hs = h; break trouve; }
  }
  if (!xBase) xBase = `${catLigne(i)}${titres[titres.length - 1]}\n\n↗ ${url}`;
  const igL = (c.ig || []).length ? `\n📣 ${c.ig.map(h => "@" + h).join(" ")}` : "", ttL = (c.tt || []).length ? `\n📣 ${c.tt.map(h => "@" + h).join(" ")}` : "";
  return {
    x: xBase + (hs.length ? "\nX " + hs.map(h => "@" + h).join(" · ") : ""),
    ig: `${catLigne(i)}🆕 ${i.titre}${txt ? `\n\n${txt}` : ""}\n\n📖 Toutes les infos sur furyogang.com (lien en bio).${igL}\n\n${tags.join(" ")}`,
    tt: `${catLigne(i)}🆕 ${i.titre}${txt ? `\n\n${resumeCourt(txt)}` : ""}\n\n📖 Infos sur furyogang.com${ttL}\n\n${[...tags.slice(0, 4), "#mangatok"].join(" ")}`,
  };
}
// Régénère les légendes ; celles que Will a retouchées à la main restent telles quelles (sauf « force »).
function vcaps(m, i, force){
  const rsEl = m.querySelector("#vrs"), cap = captions(i, rsEl ? rsEl.value.trim() : "");
  for (const k of ["x", "ig", "tt"]) { const ta = m.querySelector(`[data-cap="${k}"]`); if (force || !ta.dataset.edit) ta.value = cap[k]; }
}
// Compteur X : un lien compte pour 23 caractères.
function vcount(m){
  const ta = [...m.querySelectorAll(".cap")].find(t => !t.hidden), el = m.querySelector("#vcnt");
  if (!ta || ta.dataset.cap === "site") { el.textContent = ""; return; }
  const n = [...ta.value.replace(/(https?:\/\/)?\b[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|fr|jp|net|org|io)(\/\S*)?/gi, "x".repeat(23))].length;
  if (ta.dataset.cap === "x") { el.textContent = `${n} / 280`; el.classList.toggle("ko", n > 280); }
  else { el.textContent = `${n} car.`; el.classList.remove("ko"); }

async function vsend(btn, statut){
  const m = btn.closest(".vm"), id = m.dataset.vid, i = VITEMS.find(x => x.id === id);
  const vtx = m.querySelector("#vtx"), texte = vtx ? vtx.value : i.texte, vc = m.querySelector("#vcat"), vv = m.querySelector("#vvid");
  const video = vv ? vv.value.trim() : "", vu = m.querySelector("#vimgu"), image = vu ? vu.value.trim() : null;
  const vcr = m.querySelector("#vcrop"), cadrage = vcr && Number(vcr.value) !== (i.cadrage ?? 0) ? Number(vcr.value) : undefined;
  if (image && !/^https:\/\//.test(image)) { toast("L'image doit être une adresse https://"); return; }

  const r = await fetch("/api/admin/veille", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, ...(statut ? { statut } : {}), ...(image !== null && image !== (i.imageChoisie || "") ? { image } : {}), ...(texte !== i.texte ? { texte } : {}), ...(cadrage !== undefined ? { cadrage } : {}), ...(categorie ? { categorie } : {}), ...(vv && video !== (i.video || "") ? { video } : {}), slug: i.serie && i.serie.slug, ...(i.base ? { base: i.base } : {}), ...(btn.dataset.news ? { news: true } : {}) }) }).catch(() => null);
  btn.classList.remove("busy");
  if (!r || !r.ok) { const j = r ? await r.json().catch(() => ({})) : {}; toast(j.error || "Échec, réessaie"); return; }
  const rj = await r.clone().json().catch(() => ({}));
  const ficheMsg = rj.fiche && rj.fiche.length ? " · fiche à jour : " + rj.fiche.join(", ") : "";
  if (!statut) { // news en ligne modifiée : elle reste dans « Publiées »
    if (vtx) i.texte = vtx.value; if (vv) i.video = video; if (image !== null) i.imageChoisie = image; if (cadrage !== undefined) i.cadrage = cadrage;
    if (vc) { i.cat = vc.value; i.label = VCATS[vc.value]; i.cat2 = c2; }

  }

  if (statut === "Publié sur le site") { i.enLigne = true; i.vu = false; if (vtx) i.texte = vtx.value; if (image !== null) i.imageChoisie = image; if (vc) { i.cat = vc.value; i.label = VCATS[vc.value]; } m.remove(); vdraw(); toast("Publié sur le site ✓" + ficheMsg); if (ficheMsg) { toast.t && clearTimeout(toast.t); toast.t = setTimeout(() => document.getElementById("toast").classList.remove("on"), 5000); } return; }
  // « Vu » : la news reste dans le back-office, rangée dans « Vu, pas sur le site ».
  // Prépublication publiée aussi en news : la news créée arrive dans la liste, à relire et publier comme les autres.
  if (statut === "Validé" && btn.dataset.news) { m.remove(); toast("Magazines mis à jour ✓ · news créée, à valider"); veille(); return; }
  if (statut === "Vu" && i.news) { i.vu = true; if (vtx) i.texte = vtx.value; } else VITEMS = VITEMS.filter(x => x.id !== id);

}
// Catégorie changée dans la fiche : couleur, puis légendes régénérées avec le nouveau nom.
document.addEventListener("change", e => {

document.addEventListener("input", e => {

// Éditeur plein écran : un clic dans un résumé ou une légende (ou sur le titre X / Instagram / TikTok) ouvre tous les textes
// de la fiche en grand, avec des onglets ; « Enregistrer » enregistre directement (Will, 05/10/2026).
const ED_CH = [["resumeImg", "Résumé de l'image"], ["resume", "Résumé du site"], ["ig", "Instagram"], ["tt", "TikTok"], ["x", "X"]];
function edOuvrir(li, k){
  const nom = (li.querySelector(".nm b") || {}).textContent || "Fiche";
  const ed = document.createElement("div"); ed.className = "ed";
  ed.innerHTML = `<div class="ed-b" role="dialog" aria-modal="true"><div class="ed-h"><b>${esc(nom)}</b><button class="ed-x" aria-label="Fermer">×</button></div>
    <div class="ed-t">${ED_CH.filter(([f]) => li.querySelector(`[data-f="${f}"]`)).map(([f, n]) => `<button data-ed="${f}" aria-pressed="${f === k}">${n}</button>`).join("")}</div>
    <textarea spellcheck="true"></textarea>
    <div class="ed-f"><span class="n"></span><button class="ok">OK</button><button class="sv">Enregistrer</button></div></div>`;
  document.body.appendChild(ed);
  const ta = ed.querySelector("textarea"), n = ed.querySelector(".n");
  let cur = k;
  const src = f => li.querySelector(`[data-f="${f}"]`);
  const compte = () => { const v = ta.value; if (cur === "x") { const c = poidsX(v); n.textContent = `${c} / 280`; n.classList.toggle("ko", c > 280); } else { n.textContent = `${v.length} car.`; n.classList.remove("ko"); } };
  const charger = f => { cur = f; ta.value = src(f).value; ta.placeholder = src(f).placeholder || ""; ed.querySelectorAll("[data-ed]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ed === f)); compte(); };
  const rendre = () => { const t = src(cur); if (t.value !== ta.value) { t.value = ta.value; t.dispatchEvent(new Event("input", { bubbles: true })); } };
  const fermer = () => { rendre(); ed.remove(); };
  charger(k); setTimeout(() => ta.focus(), 50);
  ta.addEventListener("input", compte);
  ed.addEventListener("click", e => {
    const b = e.target.closest("[data-ed]"); if (b) { rendre(); charger(b.dataset.ed); ta.focus(); return; }
    if (e.target === ed || e.target.closest(".ed-x") || e.target.closest(".ok")) { fermer(); return; }
    if (e.target.closest(".sv")) { fermer(); const sv = li.querySelector("[data-save]"); if (sv) sv.click(); }
  });
}
document.addEventListener("click", e => {

});
