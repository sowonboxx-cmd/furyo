<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangakas · FuryoGang</title>
<meta name="description" content="Les mangakas suivis par FuryoGang et toutes leurs séries.">
<meta name="theme-color" content="#232325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"></noscript>
<style>
/* Même système que le fil et la chronologie : sombre, cartes noires sur fond gris, sans bordures. */
:root{
  --ink:#232325; --ink-2:#000; --ink-3:#38383B;
  --paper:#F5F5F7; --paper-2:#CFCFD4; --paper-3:#98989D;
  --red:#E54839; --ok:#7BC67E; --amber:#F2B33D;
  --f-display:"Antonio","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 48px}
/* Ordinateur : même largeur que l'en-tête et l'accueil (logo et avatar alignés sur le contenu), Will 05/10/2026 */
@media (min-width:980px){.page{max-width:1240px;padding-inline:20px}}
.top{display:flex;align-items:center;gap:12px}
.round{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;text-decoration:none;flex:none;color:var(--paper)}
@media (min-width:980px){.top{display:none}}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,4.6vw,22px);white-space:nowrap;letter-spacing:.02em;text-decoration:none;text-transform:uppercase}
.brand span{color:var(--red)}
h1{margin:18px 0 4px;font-family:var(--f-display);font-weight:700;font-size:clamp(44px,12vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{margin:0;color:var(--paper-2)}
.search{margin-top:16px;width:100%;height:46px;border:0;border-radius:14px;background:#000;color:var(--paper);padding:0 16px;font:inherit}
.grid{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.a-card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--ink-2);border-radius:18px;padding:12px 14px;text-decoration:none}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink-3);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--paper-2)}
.a-card b{display:block;font-size:16px;line-height:1.2}
.a-card small{display:block;color:var(--paper-3);font-size:12.5px}
.count{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;text-align:right}
.count small{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-3)}
/* Fiche auteur */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-top:18px}
.hero .av{width:84px;height:84px;font-size:34px}
.av{overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.hero h1{margin:0}
.jp{color:var(--paper-2);font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{height:26px;padding:0 10px;border-radius:7px;background:var(--ink-3);display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-2)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.links a,.lock{height:40px;padding:0 14px;border-radius:999px;background:var(--ink-2);display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px}
.lock{color:var(--paper-3)}
.sec{margin:26px 0 10px;font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.01em}
.works{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.work{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;background:var(--ink-2);border-radius:18px;padding:12px;text-decoration:none}
.cover{width:96px;aspect-ratio:7/10;border-radius:8px;background:var(--ink-3);object-fit:cover;display:grid;place-items:center;color:var(--paper-3);font-size:12px;writing-mode:vertical-rl}
.w-t{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.02;text-transform:uppercase}
.w-jp{display:block;color:var(--paper-2);font-size:13px;margin-top:3px}
.w-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.w-meta .live{color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--ink-3))}
.w-line{margin-top:8px;color:var(--paper-2);font-size:13px}
.empty{color:var(--paper-3);padding:30px 0;text-align:center}
.foot{margin-top:28px;text-align:center;color:var(--paper-2);font-size:13px}
.foot a{color:var(--paper);font-weight:600;text-decoration:none}
/* Champs en 16 px minimum : sinon iPhone zoome quand on touche le champ */
input,select,textarea{font-size:16px!important}
</style>
</head>
<body>
<script src="/site/header.js?v=27"></script>
<div class="page">
  <main id="app"><p class="empty">Chargement…</p></main>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
let DATA = [];
const initial = a => esc((a.jp || a.name || "?").trim().charAt(0));
// Rond de l'auteur : sa photo si la base en a une, sinon l'initiale (aussi si l'image ne charge pas).
const avatar = (a, eager) => `<span class="av" lang="ja" data-i="${initial(a)}">${a.photo ? `<img src="${esc(a.photo)}" alt="${esc(a.name)}" ${eager ? "" : 'loading="lazy" '}onerror="this.parentNode.textContent=this.parentNode.dataset.i">` : initial(a)}</span>`;
const slugNow = () => decodeURIComponent(location.pathname.replace(/^\/auteurs\/?/, "").replace(/\/$/, ""));

function listView(){
  document.title = "Mangakas · FuryoGang";
  app.innerHTML = `<h1>Mangakas</h1><p class="sub">${DATA.length} auteur${DATA.length > 1 ? "s" : ""} suivi${DATA.length > 1 ? "s" : ""}. Touchez un nom pour voir ses séries.</p>
    <input class="search" id="q" type="search" placeholder="Chercher un auteur (romaji ou japonais)" aria-label="Chercher un auteur">
    <ul class="grid" id="grid"></ul>`;
  const q = document.getElementById("q"), grid = document.getElementById("grid");
  const draw = () => {
    const v = q.value.trim().toLowerCase();
    const l = DATA.filter(a => !v || (a.name + " " + a.jp).toLowerCase().includes(v));
    grid.innerHTML = l.map(a => `<li><a class="a-card" href="/auteurs/${a.slug}">${avatar(a)}<span><b>${esc(a.name)}</b><small lang="ja">${esc(a.jp)}</small></span><span class="count">${a.series.length}<small>série${a.series.length > 1 ? "s" : ""}</small></span></a></li>`).join("") || `<li class="empty">Aucun auteur trouvé.</li>`;
  };
  q.addEventListener("input", draw); draw();
}

function years(s){ return s.y1 ? (s.y2 && s.y2 !== s.y1 ? `${s.y1} – ${s.y2}` : (/En cours/i.test(s.stJP) ? `depuis ${s.y1}` : `${s.y1}`)) : ""; }

function authorView(a){
  document.title = `${a.name} · FuryoGang`;
  const links = [["x","X"],["ig","Instagram"],["site","Site officiel"],["mu","MangaUpdates"],["anilist","AniList"]].filter(([k]) => a[k]).map(([k, l]) => `<a href="${esc(a[k])}" target="_blank" rel="noopener">${l}<svg class="arr" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline-block;vertical-align:-1px;margin-left:3px"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg></a>`).join("");
  const series = a.series.slice().sort((x, y) => (y.y1 || 0) - (x.y1 || 0));
  app.innerHTML = `<div class="hero">${avatar(a, true)}<div><h1>${esc(a.name)}</h1>${a.jp ? `<div class="jp" lang="ja">${esc(a.jp)}</div>` : ""}<div class="pills">${a.roles.map(r => `<span class="pill">${esc(r)}</span>`).join("")}</div></div></div>
    <div class="links">${links}${a.members ? `<span class="lock">Réseaux réservés aux membres</span>` : ""}</div>
    <h2 class="sec">Séries (${series.length})</h2>
    <ul class="works">${series.map(s => {
      const href = /CROWS X WORST/i.test(s.univers) ? "/crows-x-worst/" : null;
      const tag = href ? "a" : "div";
      return `<li><${tag} class="work"${href ? ` href="${href}"` : ""}>${s.img ? `<img class="cover" src="${esc(s.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="cover" lang="ja">${esc((s.jp || s.t).slice(0, 8))}</span>`}
        <div><h3 class="w-t">${esc(s.t)}</h3>${s.jp && s.jp !== s.t ? `<span class="w-jp" lang="ja">${esc(s.jp)}</span>` : ""}
        <div class="w-meta">${s.stJP ? `<span class="pill${/En cours/i.test(s.stJP) ? " live" : ""}">${esc(s.stJP)}</span>` : ""}${s.vol != null ? `<span class="pill">${s.vol} tome${s.vol > 1 ? "s" : ""}</span>` : ""}${s.stFR && !/Non licenci/i.test(s.stFR) ? `<span class="pill">VF ${esc(s.stFR.toLowerCase())}</span>` : ""}</div>
        <div class="w-line">${[s.mag, years(s)].filter(Boolean).map(esc).join(" · ")}</div></div></${tag}></li>`;
    }).join("") || `<li class="empty">Aucune série reliée pour l'instant.</li>`}</ul>`;
}

function route(){
  const slug = slugNow();
  if (!slug) return listView();
  const a = DATA.find(x => x.slug === slug);
  if (a) authorView(a); else app.innerHTML = `<h1>Auteur introuvable</h1><p class="sub"><a href="/auteurs/">Voir tous les mangakas</a></p>`;
  scrollTo(0, 0);
}
addEventListener("popstate", route);
document.addEventListener("click", e => {
  const l = e.target.closest("a[href^='/auteurs/']"); if (!l || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); history.pushState(null, "", l.getAttribute("href")); route();
});
fetch("/api/auteurs").then(r => r.json()).then(j => {
  if (j.error) throw new Error(j.error);
  DATA = j.authors || []; route();
}).catch(err => { app.innerHTML = `<p class="empty">Impossible de charger les auteurs pour le moment.</p>`; console.error(err); });
</script>
</body>
</html>
