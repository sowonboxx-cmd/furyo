<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon profil · FuryoGang</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--blue:#4C9BFF;--gold:#F2B33D;--red:#E54839;--ok:#7BC67E}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 64px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--ink-2)}
.hero img,.hero .ph{width:76px;height:76px;border-radius:50%;flex:none;background:var(--ink-3)}
.hero h1{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:34px;line-height:1;margin:0 0 6px}
.role{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--ink-3);color:var(--paper-2)}
.role.admin{background:var(--blue);color:#fff}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:28px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--ink-2);border-radius:16px;padding:14px;text-align:center}
.stats b{display:block;font-family:Antonio,sans-serif;font-size:30px;line-height:1.1}
.stats span{font-size:12px;color:var(--paper-3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{background:var(--ink-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bd i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.bd b{font-size:14px}.bd small{color:var(--paper-3);font-size:12px}
.bd.off{opacity:.42}
.bd svg{width:22px;height:22px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.acts a,.acts button{height:46px;border-radius:23px;border:0;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.acts a{background:#305887;color:#fff}.acts button{background:var(--ink-3);color:var(--paper)}
.since{color:var(--paper-3);font-size:12.5px;margin-top:6px}
.soc{display:flex;flex-direction:column;gap:10px;background:var(--ink-2);border-radius:16px;padding:14px}
.soc label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--paper-3)}
.soc input:not([type=checkbox]){height:44px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);font:inherit;font-size:15px;padding:0 14px;outline:none}
.soc .sw{flex-direction:row;align-items:center;gap:10px;color:var(--paper-2);font-size:14px}
.soc .sw input{width:20px;height:20px;accent-color:var(--blue)}
.soc button{height:44px;border:0;border-radius:22px;background:#305887;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.soc .msg{margin:0;font-size:13px;color:var(--ok);min-height:18px}
.soc .msg.err{color:var(--red)}
.soc .hint{font-size:12px;color:var(--paper-3);font-weight:500}
.soc .hint b{color:var(--paper-2)}
.acts a.sec{background:var(--ink-3);color:var(--paper)}
.empty{color:var(--paper-3);text-align:center;margin-top:18vh}
</style>
</head>
<body>
<script src="/site/header.js?v=19"></script>
<script src="/site/badges.js?v=1"></script>
<main id="app"><p class="empty">Chargement…</p></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dl = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
(async () => {
  const app = document.getElementById("app");
  const me = await fetch("/api/auth/me").then(r => r.json()).catch(() => ({}));
  if (!me.user) { app.innerHTML = `<p class="empty">Connecte-toi avec Google (avatar en haut à gauche) pour voir ton profil.<br><br><a href="/membres/" style="color:var(--blue)">Voir les membres</a></p>`; return; }
  if (!me.user.member) { app.innerHTML = `<p class="empty">Déconnecte-toi puis reconnecte-toi une fois pour créer ta fiche membre.<br><br><button id="out" style="height:44px;padding:0 20px;border:0;border-radius:22px;background:var(--ink-3);color:var(--paper);font:inherit;font-weight:700">Se déconnecter</button></p>`;
    document.getElementById("out").onclick = () => fetch("/api/auth/me", { method: "DELETE" }).then(() => { location.href = "/"; }); return; }
  const j = await fetch("/api/profil").then(r => r.json()).catch(() => ({}));
  const m = j.membre; if (!m) { app.innerHTML = `<p class="empty">Impossible de charger le profil.</p>`; return; }
  const r = m.reseaux || {}, cat = j.catalogue || [], ont = new Set(m.badges.map(b => b.id));
  app.innerHTML = `
    <section class="hero">${m.photo ? `<img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="ph"></span>`}
      <div><h1>${esc(m.pseudo || "Membre")}</h1><span class="role ${me.admin ? "admin" : ""}">${me.admin ? "Administrateur" : "Membre"} · n°${m.num || "?"}</span><div class="since">Inscrit le ${dl(m.inscrit)}</div></div></section>
    <h2>Mon pseudo</h2>
    <form class="soc" id="ps">
      <label>Pseudo<input name="pseudo" value="${esc(m.pseudo)}" minlength="3" maxlength="20" placeholder="3 à 20 caractères" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <span class="hint">Ta page publique : <b id="url">furyogang.com/membres/${esc(m.slug || "…")}</b></span>
      <button>Changer mon pseudo</button><p class="msg" id="pmsg"></p>
    </form>
    <h2>Classement</h2>
    <div class="stats"><div><b>${m.num || "—"}</b><span>N° de membre</span></div><div><b>${m.points}</b><span>Points</span></div><div><b>0</b><span>Séries suivies</span></div></div>
    <h2>Badges</h2>
    <div class="badges">${cat.map(b => FG_BADGES.carte(b, ont.has(b.id))).join("")}</div>
    <h2>Mes réseaux</h2>
    <form class="soc" id="soc">
      <label>Instagram<input name="instagram" value="${esc(r.instagram)}" placeholder="ton compte, sans @" autocomplete="off"></label>
      <label>X (Twitter)<input name="x" value="${esc(r.x)}" placeholder="ton compte, sans @" autocomplete="off"></label>
      <label>Discord<input name="discord" value="${esc(r.discord)}" placeholder="ton pseudo Discord" autocomplete="off"></label>
      <label class="sw"><input type="checkbox" name="public" ${m.public ? "checked" : ""}><span>Afficher mes réseaux sur la page Membres</span></label>
      <button>Enregistrer</button><p class="msg" id="msg"></p>
    </form>
    <div class="acts">${m.slug ? `<a href="/membres/${esc(m.slug)}" class="sec" id="pub">Voir ma page publique</a>` : ""}<a href="/membres/" class="sec">Voir tous les membres</a>${me.admin ? `<a href="/admin/">Ouvrir le back-office</a>` : ""}<button id="out">Se déconnecter</button></div>`;
  document.getElementById("out").onclick = () => fetch("/api/auth/me", { method: "DELETE" }).then(() => { location.href = "/"; });
  document.getElementById("soc").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target), msg = document.getElementById("msg"); msg.textContent = "Enregistrement…";
    const x = await fetch("/api/profil", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ instagram: f.get("instagram"), x: f.get("x"), discord: f.get("discord"), public: f.get("public") === "on" }) });
    msg.textContent = x.ok ? "Enregistré ✓" : "Erreur, réessaie."; };
  // Pseudo : unique ; s'il est déjà pris, le serveur répond 409 et on affiche son message.
  document.getElementById("ps").onsubmit = async e => { e.preventDefault(); const pseudo = new FormData(e.target).get("pseudo").trim(), msg = document.getElementById("pmsg");
    msg.className = "msg"; msg.textContent = "Vérification…";
    const x = await fetch("/api/profil", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pseudo }) });
    const k = await x.json().catch(() => ({}));
    if (!x.ok) { msg.className = "msg err"; msg.textContent = k.error || "Erreur, réessaie."; return; }
    msg.textContent = "Pseudo enregistré ✓";
    document.querySelector(".hero h1").textContent = pseudo;
    document.getElementById("url").textContent = "furyogang.com/membres/" + k.slug;
    const pub = document.getElementById("pub"); if (pub) pub.href = "/membres/" + k.slug; };
})();
</script>
</body>
</html>
