<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Série · FuryoGang</title>
<meta name="description" content="Fiche série FuryoGang : résumé, auteurs et tous les tomes, en France et au Japon.">
<meta name="theme-color" content="#232325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Fiche série : même système que le fil et le calendrier (sombre, cartes noires, Antonio + Inter). */
:root{
  --ink:#232325; --ink-2:#000; --ink-3:#38383B;
  --paper:#F5F5F7; --paper-2:#CFCFD4; --paper-3:#98989D;
  --red:#E54839; --blue:#4C9BFF; --ok:#7BC67E; --amber:#F2B33D; --jp:#E5483A; --fr:#7FA7C9;
  --f-display:"Antonio","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 48px}
.top{display:flex;align-items:center;gap:12px}
.round{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;text-decoration:none;flex:none;color:var(--paper)}
@media (min-width:980px){.top{display:none}}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-decoration:none;text-transform:uppercase}
.brand span{color:var(--red)}

/* Fil d'Ariane */
.crumb{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--paper-3);white-space:nowrap;overflow:hidden}
.crumb a{color:var(--paper-2);text-decoration:none;font-weight:600}
.crumb a:hover{color:var(--paper)}
.crumb [aria-current]{overflow:hidden;text-overflow:ellipsis;color:var(--paper-3)}
/* En-tête : petite couverture à gauche, infos à droite, fond uni du site */
.head{display:grid;grid-template-columns:114px minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
@media (min-width:720px){.head{grid-template-columns:246px minmax(0,1fr);gap:28px;margin-top:28px}}
.main-cv{width:100%;aspect-ratio:5/7;border-radius:8px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center}
@media (min-width:720px){.main-cv{border-radius:14px}}
.main-cv img{width:100%;height:100%;object-fit:cover;display:block}
.main-cv.zoom{cursor:zoom-in}
.ph{writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:13px;color:var(--paper-3);letter-spacing:.08em}
/* Titre de la série : même écriture que le calendrier (Antonio, capitales), 2 lignes maximum puis « … » ; un appui montre le titre entier */
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8.4vw,56px);line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
h1.cut{cursor:pointer}
.tl{position:fixed;inset:0;z-index:70;background:rgba(8,8,10,.9);display:flex;align-items:center;justify-content:center;padding:24px}
.tl[hidden]{display:none}
.tl-b{max-width:640px;width:100%;text-align:center}
.tl-b p{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,60px);line-height:1.02;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.tl-b small{display:block;margin-top:14px;color:var(--paper-2);font-size:16px}
.tl-b button{margin-top:26px;height:44px;padding:0 22px;border:0;border-radius:22px;background:var(--ink-3);color:var(--paper);font:inherit;font-weight:700;cursor:pointer}
.jp{margin:3px 0 0;font-family:"Noto Sans JP",var(--f-body);font-weight:700;font-size:13px;color:var(--paper-2)}
@media (min-width:720px){.jp{font-size:16px}}
.credits{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:13px}
@media (min-width:720px){.credits{font-size:14px}}
.credits dt{color:var(--paper-3)}
.credits dd{margin:0;font-weight:600}
.credits a{text-decoration:none}
/* Statuts : texte simple, intégré (pas de pastille) */
.tags{margin-top:14px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tags::-webkit-scrollbar{display:none}
.tags b,.tags span{flex:none;height:24px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;font-size:12px;font-weight:600}
.tags b{background:var(--blue);color:#fff;font-weight:700}
.tags span{background:var(--ink-3);color:var(--paper-2)}
.st{margin:8px 0 0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--paper-2)}
.st span{display:block;line-height:1.35}
.st .flag{display:inline-block;vertical-align:-1px;width:15px;height:10px;border-radius:2px;margin-right:6px}
.st .on{color:var(--ok)}.st .end{color:var(--paper)}.st .pause{color:var(--amber)}.st .stop{color:var(--red)}.st .soon{color:var(--fr)}
.flag{width:20px;height:14px;border-radius:3px;flex:none;display:block;overflow:hidden}

/* Séparation des trois parties (fiche, onglets, tomes) : bande pleine largeur, un ton plus sombre que le fond */
.band{height:10px;margin:22px -16px 0;background:#1A1A1C;border-top:1px solid #2C2C2F;border-bottom:1px solid #2C2C2F}
@media (min-width:1112px){.band{margin-inline:calc(50% - 50vw)}}
.band+.sec{margin-top:18px}
/* Onglets façon Twitter : un simple trait, contenu directement dessous */
.tabs{display:flex;margin-top:6px;border-bottom:1px solid var(--ink-3);overflow-x:auto}
.tabs button{position:relative;flex:1;height:44px;padding:0 10px;border:0;background:transparent;color:var(--paper-3);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
@media (max-width:440px){.tabs button{padding:0 6px;font-size:13.5px}}
@media (min-width:720px){.tabs button{flex:none;padding:0 22px;font-size:15px}}
.tabs button[aria-selected="true"]{color:var(--paper)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:min(64px,80%);height:3px;border-radius:3px;background:var(--blue)}
.panel{padding:14px 0 4px}
.sec h2{margin:0 0 8px;font-family:var(--f-body);font-weight:700;font-size:18px;letter-spacing:-.01em}
.resume{margin:0;color:var(--paper-2);font-size:14.5px;line-height:1.6}
.credit{margin:10px 0 0;font-size:12px;color:var(--paper-3)}
/* Infos : tableau Japon / France côte à côte */
.kv{margin:0 0 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--paper-3)}
.kv dd{margin:0;font-weight:600}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.cmp th,.cmp td{text-align:left;padding:9px 8px 9px 0;border-top:1px solid var(--ink-3);vertical-align:top;overflow-wrap:anywhere}
.cmp thead th{border-top:0;padding-top:0;font-size:13.5px;font-weight:700}
.cmp thead th span{display:inline-flex;align-items:center;gap:7px}
.cmp thead .flag{width:16px;height:11px;border-radius:2px}
.cmp tbody th{color:var(--paper-3);font-weight:500;width:32%}
.cmp td{font-weight:600}
.cmp .no{color:var(--paper-3);font-weight:500}
/* Fenêtre plein écran d'un tome */
li.t[data-ti]{cursor:pointer}
.tb{position:fixed;inset:0;z-index:60;background:rgba(35,35,37,.95);touch-action:none;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;transition:opacity .18s}
.tb.on{opacity:1}.tb[hidden]{display:none!important}
.tb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:44px;height:44px;border:0;border-radius:22px;background:var(--ink-3);color:var(--paper);display:grid;place-items:center;cursor:pointer}
/* Compteur aligné sur le bord gauche de la couverture, comme le tome et les dates */
.tb-c{position:absolute;left:max(16px, calc(50% - min(66vh,760px) * 5 / 14));top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--paper);letter-spacing:.04em}
@media (min-width:720px){.tb-c{font-size:30px}}
/* Ordinateur : compteur centré au-dessus de la couverture, en grand */

.tb-in{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;min-height:0;flex:1;justify-content:center}
.tb-cv{height:min(66vh,760px);aspect-ratio:5/7;max-width:100%;border-radius:10px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.tb-cv img{width:100%;height:100%;object-fit:cover;display:block}
.tb-t,.tb-ds{width:calc(min(66vh,760px) * 5 / 7);max-width:100%}
.tb-t{margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;text-align:left}
.tb-t em{font-style:normal;color:var(--paper-2);font-size:18px}
.tb-ds{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px}
.tb-d{margin:0;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.tb-d .flag{width:20px;height:14px;border-radius:2px}
.tb-nav{display:flex;gap:10px;width:100%;max-width:520px;margin-top:14px}
.tb-nav button{flex:1;height:44px;border:0;border-radius:14px;background:var(--ink-2);color:var(--paper);font:inherit;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tb-nav button:disabled{opacity:.3;cursor:default}
body.tb-open{overflow:hidden}
@media (max-height:640px){.tb-cv{height:56vh}.tb-t,.tb-ds{width:calc(56vh * 5 / 7)}.tb-c{left:max(16px, calc(50% - 56vh * 5 / 14))}}
/* Onglet News */
.tabs .nb{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--ink-3);font-size:11px;margin-left:4px;padding:0 5px}
/* Une news de moins d'un mois : le compteur passe en bleu vif pour la repérer. */
.tabs .nb.hot{background:var(--blue);color:#fff;font-weight:700}
.nw{list-style:none;margin:0;padding:0}
.nw li+li{border-top:1px solid var(--ink-3)}
.nw summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 2px;cursor:pointer;min-width:0}
.nw summary::-webkit-details-marker{display:none}
.nw summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--paper-3);border-bottom:2px solid var(--paper-3);transform:rotate(45deg);margin:0 4px 4px auto;transition:transform .15s}
.nw details[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.nw-c{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:6px;color:#7FA7C9;background:color-mix(in srgb,#7FA7C9 18%,var(--ink-3))}
.nw-c.lic{color:#7BC67E;background:color-mix(in srgb,#7BC67E 18%,var(--ink-3))}
.nw-t{min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-b{padding:0 2px 14px;font-size:14px;line-height:1.55;color:var(--paper-2)}
.nw-d{flex:none;font-size:11.5px;font-weight:700;color:#fff;background:#000;border-radius:6px;padding:4px 7px;white-space:nowrap}
.nw-s{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:32px;padding:0 12px;border-radius:16px;background:var(--ink-3);font-size:13px;font-weight:700;color:#fff;text-decoration:none}
.nw-s b{color:#6FA8F5}
.nw-b p{margin:0}
.nw-none{color:var(--paper-3);font-size:14px}
/* Extraits (bas de l'onglet Info & Extraits) */
.ext{margin-top:20px}
.ext.info-h{margin-top:4px}
.ext h3{margin:0 0 8px;font-size:15px;font-weight:700}
.ex{display:flex;align-items:center;gap:10px;padding:12px 2px;border-top:1px solid var(--ink-3);font-size:14px;font-weight:600;text-decoration:none}
.ex .flag{width:18px;height:12px;border-radius:2px}
.ex span{flex:1}
.ex i{font-style:normal;color:var(--blue);font-weight:700}
.ex.off{color:var(--paper-3)}
.ex em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--paper-3)}
/* Adaptations : par catégorie, une ligne par œuvre */
.wk-cat{margin:0 0 18px}
.wk-cat:last-child{margin-bottom:4px}
.wk-cat h3{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--blue)}
.wk-it{padding:10px 0;border-top:1px solid var(--ink-3)}
.wk-it b{display:block;font-size:14.5px}
.wk-it b em{font-style:normal;color:var(--paper-3);font-weight:600;margin-left:6px}
.wk-it p{margin:3px 0 0;font-size:13px;color:var(--paper-2)}
.wk-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.wk-l a{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:var(--ink-3);color:var(--paper-2);font-size:12px;font-weight:600;text-decoration:none}
.wk-l button{display:inline-flex;align-items:center;height:26px;padding:0 10px;border:0;border-radius:13px;background:var(--blue);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.apercu{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber,#F2B33D) 18%,var(--ink-3));color:#F2B33D;font-size:13.5px;font-weight:600}
.cv .ap{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:8px;background:#F2B33D;color:#000;font-size:11px;font-weight:800}
.wk-mere{margin-top:22px;padding-top:14px;border-top:1px solid var(--ink-3)}
.wk-mere:first-child{margin-top:0;padding-top:0;border-top:0}
.wk-mh{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--paper-2)}
.wk-mh a{color:var(--blue);text-decoration:none;font-weight:600;white-space:nowrap}
.wk-cat h4{margin:6px 0 4px;font-size:13px;font-weight:700;color:var(--blue)}
.vid{position:fixed;inset:0;z-index:90;background:rgba(35,35,37,.95);display:grid;place-items:center;padding:16px}
.vid-in{width:min(960px,100%)}
.vid-f{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid-f iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-ask{max-width:420px;background:#1B1B1D;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.vid-ask p{margin:0 0 4px;color:var(--paper-2);font-size:14.5px}
.vid-ask button,.vid-ask a{height:44px;border:0;border-radius:22px;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;background:var(--ink-3);color:var(--paper)}
.vid-ask .vid-ok{background:#305887;color:#fff}
.vid-b{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.vid-b a{color:var(--paper-2);font-weight:600;font-size:14px;text-decoration:none}
.vid-b button{height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--ink-2);color:var(--paper);font:inherit;font-weight:700;cursor:pointer}
.wk-l a b{display:inline;font-size:12px;color:var(--paper);margin-left:3px}
.yt{position:relative;margin-top:10px;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:0;display:block;cursor:pointer;padding:0}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt span{position:absolute;inset:0;display:grid;place-items:center}
.yt span i{width:58px;height:58px;border-radius:50%;background:#305887;display:grid;place-items:center}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-l{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--paper-3);text-decoration:none}
.yt small{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.75);padding:2px 7px;border-radius:5px;color:var(--paper)}

/* Tomes */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:var(--sh-h,0px);z-index:5;background:var(--ink);padding:8px 0 10px}
.sec-h h2{margin:0}
.sec-tools{display:flex;gap:8px;align-items:center}
.sort{width:48px;height:48px;border:0;border-radius:14px;background:var(--ink-3);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.sort svg{width:20px;height:20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--ink-3);border-radius:14px}
.seg button{height:40px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--paper-2);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink-2);color:var(--paper)}
.seg small{color:var(--paper-3);font-weight:600}
.ed-info{margin:0 0 12px;font-size:13px;color:var(--paper-3)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}}
.t{display:flex;flex-direction:column;gap:6px;min-width:0}
.cv{position:relative;width:100%;aspect-ratio:5/7;border-radius:10px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center}
@media (min-width:640px){.cv{border-radius:14px}}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .wait{position:absolute;left:5px;bottom:5px;right:5px;text-align:center;background:rgba(0,0,0,.8);border-radius:6px;padding:3px 2px;font-size:9.5px;line-height:1.2;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)}
.t-n{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-d{font-size:12.5px;color:var(--paper-2);line-height:1.3}
.t-o{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--paper-3);line-height:1.3}
.t-o .flag{width:14px;height:10px;border-radius:2px}
.empty{color:var(--paper-3);text-align:center;padding:40px 0}
.search{width:100%;height:46px;border:0;border-radius:14px;background:var(--ink-3);color:var(--paper);font:inherit;font-size:15px;padding:0 16px;margin:-2px 0 10px;outline:none;box-shadow:none;-webkit-appearance:none;appearance:none}
.search:focus,.search:focus-visible{outline:none;box-shadow:none}
.search::placeholder{color:var(--paper-3)}
/* Filtres de la liste : pays en accès direct, type / année / genre dans un panneau */
.fl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px 2px}
.fl::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border:1px solid #2C2C2F;border-radius:17px;background:transparent;color:var(--paper-2);font:inherit;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:#305887;border-color:#305887;color:#fff}
.chip[aria-expanded=true]{border-color:var(--paper-2);color:var(--paper)}
.chip .n{min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.chip svg{opacity:.7}
.chip.clear{border-color:transparent;color:var(--blue);padding:0 6px}
.fp{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.fp[hidden]{display:none}
.fcount{margin:0 0 12px;font-size:12.5px;color:var(--paper-3)}
a.t{text-decoration:none}
.grid .empty{grid-column:1/-1}
.foot{margin-top:40px;color:var(--paper-3);font-size:13px;text-align:center}
/* Champs en 16 px minimum : sinon iPhone zoome quand on touche le champ */
input,select,textarea{font-size:16px!important}
.seo-pre{padding:18px 0;color:var(--paper-2);max-width:720px}.seo-pre h1{font-family:var(--f-display,Antonio),sans-serif;text-transform:uppercase;font-size:34px;color:var(--paper);margin:0 0 8px}.seo-pre p{margin:0 0 10px}
</style>
</head>
<body>
<script src="/site/header.js?v=9"></script>
<div class="page">
  <div id="app"><p class="empty">Chargement…</p></div>
</div>
<script>
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const tn = n => (Number.isInteger(n) && n < 10) ? "0" + n : String(n ?? "");
const slugify = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const FLAGS = {
  Japon: `<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="Japon"><rect width="22" height="15" fill="#F5F5F7"/><circle cx="11" cy="7.5" r="4.2" fill="#E5483A"/></svg>`,
  France: `<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="France"><rect width="7.34" height="15" fill="#2F5DA8"/><rect x="7.33" width="7.34" height="15" fill="#F5F5F7"/><rect x="14.66" width="7.34" height="15" fill="#E5483A"/></svg>`
};
const couv = u => "/api/couv?u=" + encodeURIComponent(u);
function dTxt(t){
  if (!t || !t.date) return "Date à venir";
  const d = new Date(t.date + "T12:00:00");
  return t.prec === "Mois" ? `${MOIS[d.getMonth()]} ${d.getFullYear()}` : d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
}
const slug = decodeURIComponent(location.pathname.replace(/^\/series\/?/, "").replace(/\/$/, "")) || new URLSearchParams(location.search).get("s") || "";
let DATA = null, PAYS = "France";

function authorLink(name){ return name ? `<a href="/auteurs/${slugify(name)}">${esc(name)}</a>` : ""; }
function coverUrl(s, eds){
  const t1 = p => (eds.find(e => e.pays === p)?.tomes || []).find(t => t.n === 1 && t.cover);
  return (t1("France") || t1("Japon"))?.cover || s.cover1 || eds.flatMap(e => e.tomes).find(t => t.cover)?.cover || "";
}
function mainCover(s, eds){
  // Couverture de présentation : l'édition française d'abord (son plus petit tome illustré), le Japon seulement s'il n'y a pas de France.
  const first = p => eds.filter(e => e.pays === p).flatMap(e => e.tomes).filter(t => t.cover).sort((a, b) => (a.n ?? 999) - (b.n ?? 999))[0];
  const any = eds.flatMap(e => e.tomes).find(t => t.cover);
  const c = (first("France") || first("Japon"))?.cover || s.cover1 || any?.cover;
  const ph = `<span class="ph" lang="ja">${esc((s.jp || s.t).slice(0, 6))}</span>`;
  return c ? `<img src="${couv(c)}" alt="" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">` : ph;
}
// Statut par pays, en texte : drapeau + « en cours », « terminé », « en pause », « abandonné »…
// Statut avec une majuscule : « En cours », « Terminé », « Annoncé »…
const cap = v => { const t = String(v || "").toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); };
function statut(pays, st){
  if (!st) return "";
  const cls = /cours/i.test(st) ? "on" : /termin/i.test(st) ? "end" : /pause/i.test(st) ? "pause" : /abandon|arr[êe]t|stopp/i.test(st) ? "stop" : /annonc/i.test(st) ? "soon" : "";
  return `<span>${FLAGS[pays] || ""}<b class="${cls}" style="font-weight:600">${esc(cap(st))}</b></span>`;
}
// Ligne d'en-tête par pays : « 13 tomes · en cours », ou « 33 tomes · terminé (1990-1998) ».
// Les années ne s'affichent que pour une série terminée.
function ligne(pays, s, eds){
  const st = pays === "France" ? s.stFR : s.stJP;
  if (!st || /non licenci/i.test(st)) return "";
  const today = new Date().toISOString().slice(0, 10);
  const tomes = eds.filter(e => e.pays === pays).flatMap(e => e.tomes).filter(t => t.date && t.date <= today);
  const n = (pays === "France" ? s.tomesFR : s.tomesJP) || tomes.reduce((m, t) => Math.max(m, t.n || 0), 0);
  let ans = "";
  if (/termin/i.test(st)) {
    let a = "", b = "";
    if (pays === "Japon") { a = (s.prepub || "").slice(0, 4) || s.y1 || (s.t1JP || "").slice(0, 4); b = (s.prepubFin || "").slice(0, 4) || s.y2 || ""; }
    else { const ys = tomes.map(t => t.date.slice(0, 4)).sort(); a = (s.t1FR || "").slice(0, 4) || ys[0] || ""; b = ys[ys.length - 1] || ""; }
    if (!b && tomes.length) b = tomes.map(t => t.date.slice(0, 4)).sort().pop();
    ans = a && b ? ` (${a === b ? a : a + "-" + b})` : a ? ` (${a})` : "";
  }
  const cls = /cours/i.test(st) ? "on" : /termin/i.test(st) ? "end" : /pause/i.test(st) ? "pause" : /abandon|arr[êe]t|stopp/i.test(st) ? "stop" : /annonc/i.test(st) ? "soon" : "";
  return `<span>${FLAGS[pays] || ""}${n ? `${n} tome${n > 1 ? "s" : ""} · ` : ""}<b class="${cls}" style="font-weight:600;white-space:nowrap">${esc(cap(st))}${ans}</b></span>`;
}
const dLong = d => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";
// Adaptations : un champ Notion peut contenir plusieurs œuvres (séparées par « | », « ; » ou un retour à la ligne).
// « Titre (2026, détails) » devient : Titre · 2026 + détails. Les bandes-annonces viennent du champ « Trailers ».
// Ordre : films, dramas, OAV, animés, jeux. Libellé au pluriel quand il y a plusieurs œuvres.
const CATS = [["film", "Film", "Films"], ["drama", "Drama", "Dramas"], ["oav", "OAV", "OAV"], ["anime", "Animé", "Animés"], ["jeux", "Jeu vidéo", "Jeux vidéo"]];
// Une ligne d'adaptation : « Titre (2026, détails) <lien source> <lien YouTube> ». Les liens YouTube sont des bandes-annonces.
// Une œuvre : « Titre (année, détails) <source> [VO|VF] <vidéo> … ». Les vidéos YouTube ou Dailymotion
// peuvent être précédées de « VO » ou « VF » pour avoir un bouton par version.
function adParse(x){
  let src = "", vids = [], m;
  while ((m = x.match(/\s*(?:\b(VO|VF|VOSTFR)\s*:?\s*)?<?(https?:\/\/[^\s>]+)>?\s*$/i))) {
    if (vidSpec(m[2])) vids.unshift({ u: m[2], l: (m[1] || "").toUpperCase() }); else src = src || m[2];
    x = x.slice(0, m.index);
  }
  const yt = vids.length ? vids[0].u : "";
  const r = x.match(/^(.*?)\s*\((\d{4})\s*,?\s*(.*)\)\s*$/);
  return r ? { t: r[1], y: r[2], d: r[3], src, yt, vids } : { t: x.trim(), y: "", d: "", src, yt, vids };
}
function adCats(o, tr){
  return CATS.map(([k, un, plus]) => {
    const raw = (o[k] || "").trim();
    if (!raw || /^(aucun|non|-)/i.test(raw)) return null;
    const items = raw.split(/\s*(?:\||;|\n)\s*/).filter(Boolean).map(adParse);
    // Bandes-annonces du champ « Trailers » : dans l'ordre des œuvres de la catégorie, si la ligne n'a pas déjà la sienne.
    (tr || []).filter(t => t.cat === k).forEach((t, i) => { if (items[i] && !items[i].vids.length) { items[i].yt = t.url; items[i].vids = [{ u: t.url, l: "" }]; } });
    return { label: items.length > 1 ? plus : un, items };
  }).filter(Boolean);
}
// Adaptations de la série + celles de la série d'origine (pour une suite, une préquelle ou un spin-off).
function ADAPT(s){
  const own = adCats(s, s.trailers);
  const mere = s.mere ? adCats(s.mere, []) : [];
  return mere.length ? own.concat([{ mere: s.mere, cats: mere }]) : own;
}
const SRC_NOMS = { "asianwiki.com": "AsianWiki", "myanimelist.net": "MyAnimeList", "anilist.co": "AniList", "mydramalist.com": "MyDramaList", "netflix.com": "Netflix", "wikipedia.org": "Wikipedia", "eiga.com": "Eiga.com", "realsound.jp": "Real Sound", "animenewsnetwork.com": "Anime News Network", "allcinema.net": "allcinema" };
const srcNom = u => { try { const h = new URL(u).hostname.replace(/^www\./, ""); return SRC_NOMS[h] || SRC_NOMS[h.split(".").slice(-2).join(".")] || h; } catch (e) { return "Source"; } };
const adLinks = it => { const v = (it.vids || []).filter(x => vidSpec(x.u));
  return it.src || v.length ? `<div class="wk-l">${it.src ? `<a href="${esc(it.src)}" target="_blank" rel="noopener">Source :<b>${esc(srcNom(it.src))}</b>&nbsp;↗</a>` : ""}${v.map(x => `<button type="button" data-vid="${vidSpec(x.u)}">▶ Bande-annonce${x.l ? " " + x.l : ""}</button>`).join("")}</div>` : ""; };
const adItem = (it, court) => `<div class="wk-it"><b>${esc(it.t)}${it.y ? `<em>${it.y}</em>` : ""}</b>${!court && it.d ? `<p>${esc(it.d.charAt(0).toUpperCase() + it.d.slice(1))}</p>` : ""}${adLinks(it)}</div>`;
function adHTML(ad){
  return ad.map(c => c.mere
    ? `<div class="wk-mere"><h3 class="wk-mh">Adaptations de la série d'origine · ${esc(shown(c.mere))}${c.mere.visible ? ` <a href="/series/${esc(c.mere.slug)}">Voir la fiche ↗</a>` : ""}</h3>${c.cats.map(k => `<div class="wk-cat"><h4>${k.label}</h4>${k.items.map(it => adItem(it, true)).join("")}</div>`).join("")}</div>`
    : `<div class="wk-cat"><h3>${c.label}</h3>${c.items.map(it => adItem(it, false)).join("")}</div>`).join("");
}
// Fenêtre vidéo (bande-annonce) : la vidéo ne se charge qu'à l'ouverture.
function vidOpen(spec){
  const [k, id] = spec.includes(":") ? spec.split(":") : ["yt", spec];
  const dm = k === "dm", nom = dm ? "Dailymotion" : "YouTube";
  const page = dm ? `https://www.dailymotion.com/video/${id}` : `https://www.youtube.com/watch?v=${id}`;
  const src = dm ? `https://www.dailymotion.com/embed/video/${id}?autoplay=1` : `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}`;
  // Sans accord pour les cookies des plateformes vidéo : on propose d'accepter ou d'ouvrir la vidéo sur la plateforme.
  if (window.FG_CONSENT && !FG_CONSENT.video()) {
    const d = document.createElement("div"); d.className = "vid"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Bande-annonce");
    d.innerHTML = `<div class="vid-in vid-ask"><p>Cette bande-annonce est hébergée par ${nom}, qui dépose ses propres cookies.</p>
      <button type="button" class="vid-ok" data-vok="${spec}">Accepter et lire</button><a href="${page}" target="_blank" rel="noopener">Ouvrir sur ${nom} ↗</a><button type="button" data-vclose>Fermer</button></div>`;
    document.body.appendChild(d); document.documentElement.style.overflow = "hidden"; return;
  }
  const d = document.createElement("div"); d.className = "vid"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Bande-annonce");
  d.innerHTML = `<div class="vid-in"><div class="vid-f"><iframe src="${src}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Bande-annonce"></iframe></div>
    <div class="vid-b"><a href="${page}" target="_blank" rel="noopener">Ouvrir sur ${nom} ↗</a><button type="button" data-vclose>Fermer</button></div></div>`;
  document.body.appendChild(d); document.documentElement.style.overflow = "hidden";
}
// Vidéo reconnue : « yt:ID » (YouTube) ou « dm:ID » (Dailymotion), sinon "".
function vidSpec(u){ const y = ytId(u); if (y) return "yt:" + y; const m = String(u).match(/dailymotion\.com\/(?:embed\/)?video\/([a-z0-9]+)|dai\.ly\/([a-z0-9]+)/i); return m ? "dm:" + (m[1] || m[2]) : ""; }
function ytId(u){ const m = String(u).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? m[1] : ""; }
function ytHTML(t){ const id = ytId(t.url); if (!id) return "";
  return `<button class="yt" data-yt="${id}" aria-label="Lire la bande-annonce"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><span><i><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></i></span>${t.nom ? `<small>${esc(t.nom)}</small>` : ""}</button><a class="yt-l" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Voir sur YouTube ↗</a>`; }
let TAB = "syn", ASC = true;

// Titre affiché : le titre FR, sauf quand le titre de la série s'écrit en capitales (CROWS, WORST…).
const shown = s => (s.t && s.fr && s.t === s.t.toUpperCase() && /[A-Z]/.test(s.t) && s.t.toLowerCase() === s.fr.toLowerCase()) ? s.t : (s.fr || s.t);
// Fil d'Ariane : page d'où l'on vient (Calendrier, Actualités, Séries par défaut) / titre de la série.
function crumb(titre){
  let from = { href: "/series/", label: "Séries" };
  try {
    const r = document.referrer ? new URL(document.referrer) : null;
    if (r && r.origin === location.origin) {
      if (r.pathname.startsWith("/calendrier")) from = { href: "/calendrier/", label: "Calendrier" };
      else if (r.pathname === "/" || r.pathname === "/index.html") from = { href: "/", label: "Actualités" };
      else if (r.pathname.startsWith("/auteurs")) from = { href: r.pathname, label: "Mangakas" };
    }
  } catch (e) {}
  return `<nav class="crumb" aria-label="Fil d'Ariane"><a href="${from.href}" data-back>${from.label}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(titre)}</span></nav>`;
}
function render(){
  const { serie: s, editions: eds } = DATA;
  const titre = shown(s);
  document.title = `${titre} (manga) – tomes, sorties, extraits | FuryoGang`;
  const pays = [...new Set(eds.map(e => e.pays))].filter(Boolean);
  if (!pays.includes(PAYS)) PAYS = pays[0] || "France";
  const pubFR = [...new Set(eds.filter(e => e.pays === "France").map(e => e.pub))];
  const pubJP = [...new Set(eds.filter(e => e.pays === "Japon").map(e => e.pub))];
  if (!pubJP.length && s.pubJP) pubJP.push(s.pubJP);
  const same = s.scen && s.scen === s.dess;
  const ad = ADAPT(s);
  if (TAB === "ad" && !ad.length) TAB = "syn";
  document.getElementById("app").innerHTML = `
  ${crumb(titre)}
  ${s.apercu ? `<p class="apercu">Aperçu administrateur · cette fiche n'est pas encore publiée, toi seul la vois.</p>` : ""}
  <div class="head">
    <div class="main-cv zoom" role="button" aria-label="Voir les couvertures en grand">${mainCover(s, eds)}</div>
    <div>
      <h1 id="ttl" data-jp="${esc(s.jp || "")}">${esc(titre)}</h1>
      ${s.jp ? `<p class="jp" lang="ja">${esc(s.jp)}</p>` : ""}
      <dl class="credits">${same ? `<dt>Auteur :</dt><dd>${authorLink(s.scen)}</dd>` : `${s.scen ? `<dt>Scénario :</dt><dd>${authorLink(s.scen)}</dd>` : ""}${s.dess ? `<dt>Dessin :</dt><dd>${authorLink(s.dess)}</dd>` : ""}`}</dl>
      <div class="st">${ligne("France", s, eds)}${ligne("Japon", s, eds)}</div>
    </div>
  </div>
  <div class="band" aria-hidden="true"></div>
  <div class="tabs" role="tablist">
      <button role="tab" data-tab="syn" aria-selected="${TAB === "syn"}">Synopsis</button>
      <button role="tab" data-tab="info" aria-selected="${TAB === "info"}">Info &amp; Extraits</button>
      <button role="tab" data-tab="news" aria-selected="${TAB === "news"}">News${(s.news || []).length ? ` <small class="nb${s.news.some(n => n.date && (Date.now() - new Date(n.date + "T12:00:00")) < 30 * 864e5) ? " hot" : ""}">${s.news.length}</small>` : ""}</button>
      ${ad.length ? `<button role="tab" data-tab="ad" aria-selected="${TAB === "ad"}">Adaptations</button>` : ""}
  </div>
  <div class="panel">${panel(s, pubFR, pubJP, eds, ad)}</div>
  ${eds.length ? `<div class="band" aria-hidden="true"></div><section class="sec">
    <div class="sec-h"><h2>Tomes</h2>
      <div class="sec-tools">
        ${pays.length > 1 ? `<div class="seg" role="group" aria-label="Pays">${pays.map(p => `<button data-p="${p}" aria-pressed="${p === PAYS}">${FLAGS[p] || ""}${p} <small>${eds.filter(e => e.pays === p).reduce((n, e) => n + e.tomes.length, 0)}</small></button>`).join("")}</div>` : ""}
        <button class="sort" id="sort" aria-label="${ASC ? "Afficher le dernier tome en premier" : "Afficher le premier tome en premier"}" title="Ordre de sortie">${ASC
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/></svg>'}</button>
      </div>
    </div>
    <div id="tomes"></div>
  </section>` : ""}`;
  if (eds.length) renderTomes();
  markCut();
}
function panel(s, pubFR, pubJP, eds, ad){
  // News de la série : une ligne par news (catégorie + petit titre), qui se déplie d'un appui.
  if (TAB === "news") {
    const n = s.news || [];
    if (!n.length) return `<p class="nw-none">Pas encore de news pour cette série.</p>`;
    const MC = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
    const dd = d => { if (!d) return ""; const x = new Date(d + "T12:00:00"); return `${x.getDate()} ${MC[x.getMonth()]} ${String(x.getFullYear()).slice(2)}`; }; // ex. « 8 sept. 26 »
    return `<ul class="nw">${n.map(it => `<li><details><summary>${it.date ? `<time class="nw-d">${dd(it.date)}</time>` : ""}<span class="nw-c${it.cat === "Licence FR" ? " lic" : ""}">${esc(it.cat)}</span><span class="nw-t">${esc(it.titre)}</span></summary>
      <div class="nw-b">${it.texte ? `<p>${esc(it.texte)}</p>` : ""}${it.src ? `<a class="nw-s" href="${esc(it.src)}" target="_blank" rel="noopener">Source : <b>${esc(it.srcName || "officielle")}</b> ↗</a>` : ""}</div></details></li>`).join("")}</ul>`;
  }
  // Liste simple : titre, année, détails, liens Source et Bande-annonce (vidéo en fenêtre, au clic).
  if (TAB === "ad") return adHTML(ad);
  if (TAB === "info") {
    const today = new Date().toISOString().slice(0, 10);
    const nJP = s.tomesJP || eds.filter(e => e.pays === "Japon").reduce((n, e) => Math.max(n, e.tomes.length), 0) || "";
    const nFR = s.tomesFR || eds.filter(e => e.pays === "France").reduce((n, e) => Math.max(n, ...e.tomes.filter(t => t.date && t.date <= today).map(t => t.n || 0), 0), 0) || "";
    const labels = [...new Set(eds.filter(e => e.pays === "France" && e.label && e.label !== e.pub).map(e => e.label))];
    const hasFR = pubFR.length || s.stFR || nFR;
    const prepub = (dLong(s.prepub) || (s.y1 ? String(s.y1) : "")) + (s.prepubFin ? " → " + dLong(s.prepubFin) : "");
    const tomes = (n, st) => n ? `${n}${st ? " · " + cap(st) : ""}` : (st ? cap(st) : "");
    const cell = v => v ? `<td>${esc(v)}</td>` : `<td class="no">—</td>`;
    const rows = [
      ["Éditeur", pubJP.join(", "), pubFR.join(", ") + (labels.length ? " · " + labels.join(", ") : "")],
      ["Magazine", s.mag, ""],
      ["Prépublication", prepub, ""],
      ["Tomes", tomes(nJP, s.stJP), tomes(nFR, s.stFR)],
    ].filter(r => r[1] || (hasFR && r[2]));
    return `<div class="ext info-h"><h3>Informations</h3></div><table class="cmp"><thead><tr><th></th>${hasFR ? `<th><span>${FLAGS.France}France</span></th>` : ""}<th><span>${FLAGS.Japon}Japon</span></th></tr></thead>
    <tbody>${rows.map(([k, jp, fr]) => `<tr><th>${k}</th>${hasFR ? cell(fr) : ""}${cell(jp)}</tr>`).join("")}</tbody></table>
    <div class="ext"><h3>Extraits</h3>
      ${[["France", s.extraitFR, "Extrait en français"], ["Japon", s.extraitJP, "Extrait japonais"]].map(([p, u, l]) => u
        ? `<a class="ex" href="${esc(u)}" target="_blank" rel="noopener">${FLAGS[p]}<span>${l}</span><i aria-hidden="true">↗</i></a>`
        : `<span class="ex off">${FLAGS[p]}<span>${l}</span><em>Non disponible</em></span>`).join("")}
    </div>`;
  }
  // Sous le synopsis : une seule ligne, le type (Seinen, Shonen…) mis en avant puis les genres (défile si trop long).
  const tags = s.type || (s.genres || []).length ? `<div class="tags">${s.type ? `<b>${esc(s.type)}</b>` : ""}${(s.genres || []).map(g => `<span>${esc(g)}</span>`).join("")}</div>` : "";
  return (s.resume ? `<p class="resume">${esc(s.resume)}</p>` : `<p class="resume">Synopsis à venir.</p>`) + tags;
}

// Fenêtre plein écran d'un tome (comme dans le calendrier) : couverture en grand, n° / total, date de sortie du pays affiché, précédent / suivant.

function renderTomes(){

document.addEventListener("click", e => {

// Sans nom de série dans l'adresse : liste de toutes les séries.
function renderList(items){
  document.title = "Séries manga furyō, yakuza et crime · FuryoGang";
  document.getElementById("app").innerHTML = `
  <input class="search" id="q" type="search" placeholder="Chercher une série" aria-label="Chercher une série" autocomplete="off">
  <div class="fl" id="fl"></div>
  <div class="fp" id="fp" hidden></div>
  <p class="fcount" id="fc"></p>
  <ul class="grid" id="sl"></ul>`;
  // Valeurs proposées : seulement celles présentes dans la base (genres du plus fréquent au plus rare).
  items.forEach(s => { s.type = s.type === "Manwha" ? "Manhwa" : (s.type || ""); s.dec = s.y1 ? Math.floor(s.y1 / 10) * 10 : null; });
  const count = arr => { const m = {}; arr.forEach(v => { if (v) m[v] = (m[v] || 0) + 1; }); return Object.keys(m).sort((a, b) => m[b] - m[a] || a.localeCompare(b, "fr")); };
  const OPTS = {
    type: count(items.map(s => s.type)),
    dec: [...new Set(items.map(s => s.dec).filter(Boolean))].sort((a, b) => b - a).map(String),
    genre: count(items.flatMap(s => s.genres || [])),
  };
  const decLabel = d => (+d >= 2000 ? "Années " + d : "Années " + String(d).slice(2));
  const LABEL = { type: "Type", dec: "Année", genre: "Genre" };
  const F = { pays: "", type: new Set(), dec: new Set(), genre: new Set() };
  let open = "";
  // Tri : alphabétique par défaut, ou par année de parution (début de la série au Japon).
  const SORTS = [["az", "A → Z"], ["za", "Z → A"], ["new", "Plus récentes"], ["old", "Plus anciennes"]];
  let SORT = "az";
  const name = s => shown(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const sorter = (a, b) => {
    if (SORT === "za") return name(b).localeCompare(name(a), "fr");
    if (SORT === "new" || SORT === "old") {
      if (!a.y1 !== !b.y1) return a.y1 ? -1 : 1; // sans année : à la fin
      if (a.y1 !== b.y1) return SORT === "new" ? b.y1 - a.y1 : a.y1 - b.y1;
    }
    return name(a).localeCompare(name(b), "fr");
  };
  const caret = `<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  const nAct = () => (F.pays ? 1 : 0) + F.type.size + F.dec.size + F.genre.size;
  const drawBar = () => {
    const pays = [["France", "France"], ["Japon", "Japon"]].map(([k, l]) => `<button class="chip" data-pays="${k}" aria-pressed="${F.pays === k}">${l}</button>`).join("");
    const sortChip = `<button class="chip" data-open="sort" aria-expanded="${open === "sort"}">${SORT === "az" ? "Trier" : SORTS.find(x => x[0] === SORT)[1]}${caret}</button>`;
    const menus = sortChip + ["type", "dec", "genre"].filter(k => OPTS[k].length).map(k => `<button class="chip" data-open="${k}" aria-expanded="${open === k}">${LABEL[k]}${F[k].size ? `<span class="n">${F[k].size}</span>` : caret}</button>`).join("");
    document.getElementById("fl").innerHTML = pays + menus + (nAct() ? `<button class="chip clear" data-clear>Effacer</button>` : "");
    const fp = document.getElementById("fp");
    fp.hidden = !open;
    fp.innerHTML = open === "sort" ? SORTS.map(([k, l]) => `<button class="chip" data-sort="${k}" aria-pressed="${SORT === k}">${l}</button>`).join("") : open ? OPTS[open].map(v => `<button class="chip" data-k="${open}" data-v="${esc(v)}" aria-pressed="${F[open].has(v)}">${esc(open === "dec" ? decLabel(v) : v)}</button>`).join("") : "";
  };
  // Dans une même catégorie : l'un ou l'autre. Entre catégories : tout doit correspondre.
  const keep = s => (!F.pays || (F.pays === "France" ? s.inFR : s.inJP))
    && (!F.type.size || F.type.has(s.type))
    && (!F.dec.size || F.dec.has(String(s.dec)))
    && (!F.genre.size || (s.genres || []).some(g => F.genre.has(g)));
  let cur = "";
  const draw = q => {
    cur = q;
    const n = slugify(q);
    const list = items.filter(s => keep(s) && (!n || slugify([s.fr, s.t, s.jp].join(" ")).includes(n) || (s.jp || "").includes(q))).sort(sorter);
    document.getElementById("fc").textContent = (n || nAct()) ? `${list.length} série${list.length > 1 ? "s" : ""}` : "";
    document.getElementById("fc").hidden = !(n || nAct());
    document.getElementById("sl").innerHTML = list.map(s => `<li><a class="t" href="/series/${s.slug}" data-pre="${esc(JSON.stringify({ t: s.fr || s.t, jp: s.jp, c: s.cover }))}"><div class="cv">${s.cover ? `<img src="${couv(s.cover)}" alt="" loading="lazy">` : `<span class="ph" lang="ja">${esc((s.jp || s.t).slice(0, 6))}</span>`}${s.apercu ? `<span class="ap">Aperçu</span>` : ""}</div>
      <span class="t-n">${esc(shown(s))}</span>${(SORT === "new" || SORT === "old") && s.y1 ? `<span class="t-d">${s.y1}</span>` : ""}</a></li>`).join("") || `<li class="empty">Aucune série trouvée.</li>`;
  };
  const q = document.getElementById("q");
  drawBar(); draw(""); q.addEventListener("input", e => draw(e.target.value.trim()));
  document.getElementById("app").addEventListener("click", e => {
    const b = e.target.closest(".fl .chip, .fp .chip"); if (!b) return;
    if (b.dataset.sort) { SORT = b.dataset.sort; open = ""; }
    else if (b.dataset.pays) F.pays = F.pays === b.dataset.pays ? "" : b.dataset.pays;
    else if (b.dataset.open) open = open === b.dataset.open ? "" : b.dataset.open;
    else if ("clear" in b.dataset) { F.pays = ""; F.type.clear(); F.dec.clear(); F.genre.clear(); open = ""; }
    else if (b.dataset.k) { const set = F[b.dataset.k], v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v); }
    drawBar(); draw(cur);
  });

  const reset = () => { if (q.value || nAct() || open || SORT !== "az") { q.value = ""; SORT = "az"; F.pays = ""; F.type.clear(); F.dec.clear(); F.genre.clear(); open = ""; drawBar(); draw(""); } };
  addEventListener("pageshow", reset); setTimeout(reset, 0);
}
