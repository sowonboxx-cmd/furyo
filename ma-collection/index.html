<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection · FuryoGang</title>
<meta name="description" content="Ta bibliothèque de mangas furyō, yakuza et crime : les tomes que tu as, ceux qui te manquent, ta pile à lire et ta wishlist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* Bibliothèque « Ma collection » (Will, 06/10/2026).
   Ordinateur : maquette A (barre latérale : onglets, chiffres, filtres ; grille de 6). Téléphone : maquette A (onglets soulignés,
   chiffres Tomes / Séries / Panier / Wishlist visibles, grille de 3). /ma-collection/<série> = la page de la série : tomes à cocher. */
:root{
  --bg:#000; --s1:#1C1C1E; --s2:#2C2C2E; --s3:#38383B; --line:#2C2C2F;
  --fg:#F5F5F7; --fg2:#D8D8DC; --mut:#98989D;
  --blue:#658DBB; --cta:#305887; --yel:#F2B33D; --red:#BC002D; --ok:#4DAB9A;
  --fd:Antonio,"Arial Narrow",Impact,sans-serif; --fb:Inter,"Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--fb);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
/* ---------- accueil ---------- */
.lay{display:block}
.side{display:none}
.h1{margin:0;font:700 34px/1 var(--fd);text-transform:uppercase}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 0 11px;color:var(--mut);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:var(--blue)}
.tabs em{font-style:normal;font-size:12px;margin-left:4px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.stats div{background:var(--s1);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font:700 24px/1 var(--fd);color:var(--yel);font-variant-numeric:tabular-nums}
.stats small{font:700 9.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.quota{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2);margin-top:12px}
.quota b{color:var(--fg);font-variant-numeric:tabular-nums}
.quota .bar{flex:1;height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.quota .bar i{display:block;height:100%;background:var(--yel)}
.tools{display:flex;gap:8px;align-items:center;margin-top:12px}
.search{flex:1;min-width:0;height:42px;border-radius:10px;background:var(--s1);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 15px var(--fb)}
.search input::placeholder{color:var(--mut)}
.sort{height:42px;border-radius:10px;background:var(--s1);border:0;color:var(--fg2);font:600 13px var(--fb);padding:0 10px;cursor:pointer}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:0;background:var(--s1);color:var(--fg2);font:600 13px var(--fb);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--fg);color:#000}
.cnt{color:var(--mut);font-size:12.5px;margin:14px 0 6px;display:flex;justify-content:space-between;gap:10px}
.sh2{margin:24px 0 4px;font:700 20px var(--fd);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.sh2 small{font:500 12.5px var(--fb);color:var(--mut);text-transform:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;padding-top:6px}
.c{min-width:0;display:flex;flex-direction:column;gap:5px;text-decoration:none}
.cv{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--s1)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font:700 13px/1.15 "Noto Sans JP",var(--fb);color:var(--mut)}
.c b{font:600 12.5px/1.25 var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{font:500 11.5px var(--fb);color:var(--mut);font-variant-numeric:tabular-nums}
.c small.full{color:var(--yel)}
.c small.add{color:var(--blue)}
.tag{position:absolute;left:5px;top:5px;background:var(--yel);color:#000;font:800 9px var(--fb);letter-spacing:.06em;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.more{display:flex;justify-content:center;margin-top:18px}
.btn{height:44px;border-radius:22px;border:0;background:var(--cta);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 14.5px var(--fb);padding:0 20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.g{background:var(--s1);color:var(--fg)}
.btn.busy{opacity:.5;pointer-events:none}
.arr{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.side .sbox{background:var(--s1);border-radius:14px;padding:14px}
.side .sbox b{display:block;font:700 26px var(--fd);color:var(--yel)}
.side .sbox small{color:var(--fg2);font-size:13px}
.side .sbox .bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:8px}.side .sbox .bar i{display:block;height:100%;background:var(--yel)}
.side h4{margin:0 0 8px;font:700 12px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.side .lk{display:flex;flex-direction:column;gap:2px}
.side .lk button{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;border:0;background:none;font-weight:600;color:var(--fg2);cursor:pointer;text-align:left}
.side .lk button[aria-pressed=true]{background:var(--s1);color:var(--fg)}
.side .lk em{font-style:normal;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.side .fk{display:flex;flex-direction:column;gap:7px}
.side .fk button{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--fg2);font-size:14px;cursor:pointer;padding:0;text-align:left}
.side .fk i{width:16px;height:16px;border-radius:4px;border:1.5px solid #555;flex:none}
.side .fk button[aria-pressed=true] i{background:var(--blue);border-color:var(--blue)}
/* ---------- page série ---------- */
.hero{position:relative;overflow:hidden;margin:-22px -16px 0;padding:18px 16px 18px}
.hero .bgi{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.42);transform:scale(1.2)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),#000 96%)}
.hero .in{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:end}
.hero .c1{width:96px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--s1);box-shadow:0 10px 26px rgba(0,0,0,.6)}
.hero .c1 img{width:100%;height:100%;object-fit:cover;display:block}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;text-decoration:none;position:relative;margin-bottom:12px}
.hero h1{margin:0;font:700 30px/1 var(--fd);text-transform:uppercase;overflow-wrap:anywhere}
.hero p{margin:5px 0 0;color:var(--fg2);font-size:13px}
.hero .acts{display:none}
.edsw{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.edsw button{flex:1 0 auto;background:var(--s1);border:0;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);text-align:left;cursor:pointer}
.edsw button b{display:block;color:var(--fg);font-size:13.5px}
.edsw button[aria-pressed=true]{background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.lseg{display:flex;margin-top:12px;background:var(--s1);border-radius:10px;padding:3px}
.lseg button{flex:1;border:0;background:none;font:600 12.5px var(--fb);padding:7px 0;border-radius:8px;color:var(--fg2);cursor:pointer;white-space:nowrap}
.lseg button[aria-pressed=true]{background:var(--s3);color:var(--fg)}
.prog{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prog .l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}
.prog .l b{color:var(--fg);font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.pb i{display:block;height:100%;background:var(--blue)}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ctas{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.ctas .btn{flex:1}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin-top:14px}
.t{min-width:0;display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.t.miss .cv img{filter:grayscale(1) brightness(.4)}
.t.soon .cv{border:1.5px dashed #3A3A3D;background:var(--s1)}
.t.soon{cursor:default}
.t small{font:600 11.5px var(--fb);color:var(--fg2);display:flex;justify-content:space-between;gap:4px}
.t small em{font-style:normal;color:var(--mut);font-weight:500;white-space:nowrap}
.t .cv .n{position:absolute;inset:0;display:grid;place-items:center;font:700 28px var(--fd);color:#48484A}
.bk-ck{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.bk-ck svg{width:14px;height:14px;stroke:#000;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.bk-ck.k{background:var(--yel)}.bk-ck.w{background:#E58AD1}.bk-ck.p{background:var(--blue)}
.plus{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;font:700 16px/1 var(--fb)}
.t.busy{opacity:.5;pointer-events:none}
/* ---------- accès ---------- */
.gate{max-width:420px;margin:40px auto;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate .stack{display:flex;margin-bottom:8px}.gate .stack span{width:78px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;margin:0 -12px;box-shadow:0 8px 20px rgba(0,0,0,.6);background:var(--s1)}
.gate .stack span img{width:100%;height:100%;object-fit:cover;display:block}
.gate .stack span:nth-child(1){transform:rotate(-8deg)}.gate .stack span:nth-child(3){transform:rotate(8deg)}.gate .stack span:nth-child(2){position:relative;z-index:1;transform:translateY(-8px)}
.gate b{font:700 32px/1.05 var(--fd);text-transform:uppercase}
.gate p{margin:0;color:var(--fg2);max-width:32ch}
.gate .btn{align-self:stretch}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);background:#F5F5F7;color:#000;font:600 14px var(--fb);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:99;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pay{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.pay>div{background:var(--s1);border-radius:20px;padding:24px;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px}
.pay b{font:700 30px/1 var(--fd);text-transform:uppercase}.pay p{margin:0;color:var(--fg2)}
/* ---------- ordinateur : barre latérale ---------- */
@media (min-width:980px){
  .page{padding:30px 32px 70px}
  .lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:20px}
  .lay .mtop{display:none}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:22px 16px}
  .c b{font-size:14px}.c small{font-size:12.5px}
  .tools{margin-top:0}
  .hero{margin:-30px -32px 0;padding:30px 32px}
  .hero .in{grid-template-columns:170px minmax(0,1fr) 320px;gap:28px}
  .hero .c1{width:170px}
  .hero h1{font-size:56px}
  .hero p{font-size:15px}
  .hero .acts{display:flex;flex-direction:column;gap:12px}
  .mob{display:none!important}
  .tg{grid-template-columns:repeat(8,minmax(0,1fr));gap:16px 12px}
  .det-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}
  .det-tools .lseg{margin:0;flex:0 0 460px}
}
</style>
</head>
<body>
<script src="/site/header.js?v=32"></script>
<div class="page"><div id="app"><p class="empty">Chargement…</p></div></div>
<div class="toast" id="toast"></div>
<script>
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const couv = (u, w) => u ? "/api/couv?u=" + encodeURIComponent(u) + "&w=" + (w || 360) : "";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const I = {
  s: '<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  back: '<svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  arr: '<svg class="arr" viewBox="0 0 24 24"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>',
  ck: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'
};
const LISTS = [["c", "Collection"], ["p", "Pile à lire"], ["k", "Panier"], ["w", "Wishlist"]];
const VERBE = { c: "Possédé", p: "À lire", k: "Au panier", w: "Wishlist" };
let CAT = [], BYID = {}, BYSLUG = {}, L = { c: {}, p: {}, k: {}, w: {} }, MAX = 25, TAB = "c", Q = "", SORT = "az", DET = {};
const F = { statut: new Set(), pays: new Set(), genre: new Set() };
let SHOWN = 60;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2000); }
const app = () => document.getElementById("app");
const slugAdr = () => decodeURIComponent((location.pathname.match(/^\/ma-collection\/([^/]+)/) || [])[1] || "");

/* ---------- données ---------- */
async function detail(id){
  if (!DET[id]) DET[id] = fetch("/api/biblio?id=" + id).then(r => r.json()).catch(() => ({ error: "x" }));
  const d = await DET[id]; DET[id + ":v"] = d; return d;
}
// Séries d'une liste + le nombre de tomes de la série dans la liste.
function seriesDe(l){ const m = {}; Object.values(L[l]).forEach(s => { m[s] = (m[s] || 0) + 1; }); return m; }
// Édition de référence pour « 7/9 tomes » : celle où le membre a le plus de tomes (France d'abord à égalité).
function resume(d, l){
  if (!d || !d.editions) return null;
  let best = null;
  for (const e of d.editions) {
    const has = e.tomes.filter(t => L[l][t.id]).length, parus = e.tomes.filter(t => t.paru).length;
    if (!best || has > best.has) best = { e, has, parus, total: e.nb || e.tomes.length };
  }
  return best;
}

/* ---------- accueil ---------- */
async function home(){
  document.title = "Ma collection · FuryoGang";
  const ids = Object.keys(seriesDe(TAB));
  await Promise.all(ids.map(detail));
  drawHome();
}
function card(s, l){
  const r = s._r, inList = s._n || 0, full = l === "c" && r && r.parus > 0 && r.has >= r.parus;
  const sub = !inList ? `<small class="add">+ Ajouter</small>` : l === "c" && r ? `<small class="${full ? "full" : ""}">${r.has}/${r.parus || r.total} tome${(r.parus || r.total) > 1 ? "s" : ""}</small>` : `<small>${inList} tome${inList > 1 ? "s" : ""}</small>`;
  return `<a class="c" href="/ma-collection/${esc(s.slug)}"><span class="cv">${s.cover ? `<img src="${esc(couv(s.cover))}" alt="" loading="lazy">` : `<span class="ph" lang="ja">${esc((s.jp || s.t).slice(0, 8))}</span>`}${full ? '<span class="tag">Complète</span>' : ""}</span><b>${esc(s.fr || s.t)}</b>${sub}</a>`;
}
function filtre(list){
  const q = norm(Q);
  return list.filter(s => {
    if (q && !norm([s.t, s.fr, s.jp].join(" ")).includes(q) && !(s.jp || "").includes(Q)) return false;
    if (F.pays.size && !s.pays.some(p => F.pays.has(p))) return false;
    if (F.genre.size && !(s.genres || []).some(g => F.genre.has(g))) return false;
    if (F.statut.size && TAB === "c") {
      const r = s._r, full = r && r.parus > 0 && r.has >= r.parus;
      if (!((F.statut.has("complete") && full) || (F.statut.has("manque") && !full))) return false;
    }
    return true;
  }).sort((a, b) => SORT === "za" ? norm(b.fr || b.t).localeCompare(norm(a.fr || a.t)) : SORT === "new" ? (b.y1 || 0) - (a.y1 || 0) : norm(a.fr || a.t).localeCompare(norm(b.fr || b.t)));
}
function counts(){
  const sc = Object.keys(seriesDe("c")).length;
  return { tomes: Object.keys(L.c).length, series: sc, p: Object.keys(L.p).length, k: Object.keys(L.k).length, w: Object.keys(L.w).length };
}
function drawHome(){
  const n = counts(), m = seriesDe(TAB);
  const mine = Object.keys(m).map(id => BYID[id]).filter(Boolean).map(s => ({ ...s, _n: m[s.id], _r: resume(DET[s.id + ":v"], TAB) }));
  const listeF = filtre(mine);
  const cherche = !!Q;
  const base = cherche ? filtre(CAT.filter(s => !m[s.id]).map(s => ({ ...s, _n: 0 }))) : [];
  const vide = !mine.length;
  const genres = [...new Set(CAT.flatMap(s => s.genres || []))].sort((a, b) => a.localeCompare(b, "fr")).slice(0, 14);
  const quota = MAX ? `<div class="quota"><b>${n.tomes}/${MAX}</b><span>tomes gratuits</span><div class="bar"><i style="width:${Math.min(100, n.tomes / MAX * 100)}%"></i></div></div>` : "";
  const tabs = `<div class="tabs mob">${LISTS.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${TAB === k}">${l}<em>${k === "c" ? n.tomes : n[k]}</em></button>`).join("")}</div>`;
  const stats = `<div class="stats mob"><div><b>${n.tomes}</b><small>Tomes</small></div><div><b>${n.series}</b><small>Séries</small></div><div><b>${n.k}</b><small>Panier</small></div><div><b>${n.w}</b><small>Wishlist</small></div></div>`;
  const chip = (g, v, l) => `<button data-f="${g}" data-v="${esc(v)}" aria-pressed="${F[g].has(v)}">${esc(l)}</button>`;
  const chips = `<div class="chips mob">${TAB === "c" ? chip("statut", "complete", "Complètes") + chip("statut", "manque", "Il me manque des tomes") : ""}${chip("pays", "France", "France")}${chip("pays", "Japon", "Japon")}${genres.slice(0, 8).map(g => chip("genre", g, g)).join("")}</div>`;
  const side = `<aside class="side"><h1 class="h1">Ma collection</h1>${MAX ? `<div class="sbox"><b>${n.tomes}/${MAX}</b><small>tomes gratuits</small><div class="bar"><i style="width:${Math.min(100, n.tomes / MAX * 100)}%"></i></div></div>` : `<div class="sbox"><b>${n.tomes}</b><small>tomes · ${n.series} séries</small></div>`}
    <div><h4>Ma bibliothèque</h4><div class="lk">${LISTS.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${TAB === k}">${l}<em>${k === "c" ? n.tomes : n[k]}</em></button>`).join("")}</div></div>
    ${TAB === "c" ? `<div><h4>Statut</h4><div class="fk">${[["complete", "Complètes"], ["manque", "Il me manque des tomes"]].map(([v, l]) => `<button data-f="statut" data-v="${v}" aria-pressed="${F.statut.has(v)}"><i></i>${l}</button>`).join("")}</div></div>` : ""}
    <div><h4>Pays</h4><div class="fk">${["France", "Japon"].map(v => `<button data-f="pays" data-v="${v}" aria-pressed="${F.pays.has(v)}"><i></i>${v}</button>`).join("")}</div></div>
    <div><h4>Genre</h4><div class="fk">${genres.map(v => `<button data-f="genre" data-v="${esc(v)}" aria-pressed="${F.genre.has(v)}"><i></i>${esc(v)}</button>`).join("")}</div></div></aside>`;
  const nomTab = LISTS.find(x => x[0] === TAB)[1];
  const grille = listeF.length ? `<div class="grid">${listeF.map(s => card(s, TAB)).join("")}</div>`
    : vide && !cherche ? `<p class="empty">${TAB === "c" ? "Ta collection est vide. Cherche une série ci-dessus, ouvre-la et coche les tomes que tu as." : `Rien dans « ${nomTab} » pour l'instant. Ouvre une série et choisis « ${nomTab} » pour y ajouter des tomes.`}</p>`
    : cherche ? "" : `<p class="empty">Aucune série ne correspond à ces filtres.</p>`;
  const catalogue = cherche ? `<div class="sh2">Toute la base<small>${base.length} série${base.length > 1 ? "s" : ""}</small></div>${base.length ? `<div class="grid">${base.slice(0, SHOWN).map(s => card(s, TAB)).join("")}</div>${base.length > SHOWN ? `<div class="more"><button class="btn g" data-more>Voir plus</button></div>` : ""}` : `<p class="empty">Aucune série trouvée dans la base.</p>`}`
    : vide ? `<div class="sh2">Toute la base<small>${CAT.length} séries à collectionner</small></div><div class="grid">${filtre(CAT.map(s => ({ ...s, _n: 0 }))).slice(0, SHOWN).map(s => card(s, TAB)).join("")}</div>${CAT.length > SHOWN ? `<div class="more"><button class="btn g" data-more>Voir plus</button></div>` : ""}` : "";
  app().innerHTML = `<div class="lay">${side}<div><div class="mtop mob"><h1 class="h1">Ma collection</h1>${tabs}${stats}${quota}</div>
    <div class="tools"><label class="search">${I.s}<input id="q" type="search" placeholder="Chercher une série à ajouter ou dans ta collection" value="${esc(Q)}" autocomplete="off"></label><select class="sort" id="sort" aria-label="Trier"><option value="az"${SORT === "az" ? " selected" : ""}>A → Z</option><option value="za"${SORT === "za" ? " selected" : ""}>Z → A</option><option value="new"${SORT === "new" ? " selected" : ""}>Plus récentes</option></select></div>
    ${chips}<div class="cnt"><span>${nomTab} · ${mine.length} série${mine.length > 1 ? "s" : ""}${TAB === "c" ? " · " + n.tomes + " tome" + (n.tomes > 1 ? "s" : "") : ""}</span></div>${grille}${catalogue}</div></div>`;
  const q = document.getElementById("q");
  q.oninput = () => { Q = q.value; SHOWN = 60; const pos = q.selectionStart; drawHome(); const q2 = document.getElementById("q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} };
  document.getElementById("sort").onchange = e => { SORT = e.target.value; drawHome(); };
}

/* ---------- page d'une série ---------- */
let ED = null, LT = "c";
async function serie(slug){
  const s = BYSLUG[slug] || BYID[slug];
  if (!s) { app().innerHTML = `<p class="empty">Série introuvable. <a href="/ma-collection/">Retour à ma collection</a></p>`; return; }
  document.title = (s.fr || s.t) + " · Ma collection · FuryoGang";
  app().innerHTML = `<p class="empty">Chargement…</p>`;
  const d = await detail(s.id); DET[s.id + ":v"] = d;
  if (!d || d.error) { app().innerHTML = `<p class="empty">Impossible de charger cette série.</p>`; return; }
  // Édition affichée : celle où le membre a déjà des tomes, sinon la française, sinon la première.
  const r = resume(d, "c");
  ED = (r && r.has ? r.e : d.editions[0]).id; LT = TAB;
  drawSerie(s, d);
}
function drawSerie(s, d){
  const e = d.editions.find(x => x.id === ED) || d.editions[0];
  const cover = (e.tomes.find(t => t.cover) || {}).cover || s.cover;
  const parus = e.tomes.filter(t => t.paru), has = e.tomes.filter(t => L.c[t.id]).length, total = e.nb || e.tomes.length;
  const inL = e.tomes.filter(t => L[LT][t.id]).length;
  const fiche = d.serie.fiche ? `<a class="btn" href="/series/${esc(d.serie.slug)}">Voir la fiche ${I.arr}</a>` : `<span class="btn g" style="opacity:.6;cursor:default">Fiche bientôt en ligne</span>`;
  const tout = parus.length ? `<button class="btn g" data-jusqua>+ Jusqu'au T.${esc(parus[parus.length - 1].n)}</button>` : "";
  const prog = `<div class="prog"><div class="l"><span><b>${has}</b> possédé${has > 1 ? "s" : ""} sur ${parus.length} paru${parus.length > 1 ? "s" : ""}</span><span>${total} au total</span></div><div class="pb"><i style="width:${total ? has / total * 100 : 0}%"></i></div></div>`;
  const edsw = d.editions.length > 1 ? `<div class="edsw">${d.editions.map(x => `<button data-ed="${x.id}" aria-pressed="${x.id === e.id}"><b>${esc(x.pays)} · ${esc(x.pub)}</b>${x.tomes.filter(t => L.c[t.id]).length}/${x.tomes.filter(t => t.paru).length} parus</button>`).join("")}</div>` : "";
  const lseg = `<div class="lseg">${LISTS.map(([k, l]) => `<button data-lt="${k}" aria-pressed="${LT === k}">${l}</button>`).join("")}</div>`;
  const tome = t => {
    if (!t.paru) return `<div class="t soon"><span class="cv">${t.cover ? `<img src="${esc(couv(t.cover, 300))}" alt="" loading="lazy" style="opacity:.35">` : `<span class="n">${esc(t.n)}</span>`}</span><small>T.${esc(t.n)}<em>À paraître</em></small></div>`;
    const on = !!L[LT][t.id], own = !!L.c[t.id];
    const etat = LT === "c" ? (own ? "Possédé" : "Manquant") : on ? VERBE[LT] : own ? "Possédé" : "";
    return `<button class="t${LT === "c" && !own ? " miss" : ""}" data-t="${t.id}" aria-pressed="${on}" aria-label="Tome ${esc(t.n)} : ${on ? "retirer de" : "ajouter à"} ${esc(LISTS.find(x => x[0] === LT)[1])}"><span class="cv">${t.cover ? `<img src="${esc(couv(t.cover, 300))}" alt="" loading="lazy">` : `<span class="n">${esc(t.n)}</span>`}${on ? `<span class="bk-ck ${LT}">${I.ck}</span>` : `<span class="plus">+</span>`}</span><small>T.${esc(t.n)}<em>${etat}</em></small></button>`;
  };
  const leg = LT === "c" ? `<div class="leg"><span><i style="background:var(--ok)"></i>Possédé</span><span><i style="background:#555"></i>Manquant</span><span><i style="border:1.5px dashed #555"></i>À paraître</span><span>Touche un tome pour le cocher</span></div>`
    : `<div class="leg"><span>${inL} tome${inL > 1 ? "s" : ""} dans « ${esc(LISTS.find(x => x[0] === LT)[1])} » · touche un tome pour l'ajouter ou le retirer</span></div>`;
  app().innerHTML = `<div class="hero"><div class="bgi" style="background-image:url('${esc(couv(cover, 300))}')"></div><div class="fade"></div>
    <a class="back" href="/ma-collection/">${I.back}Ma collection</a>
    <div class="in"><span class="c1">${cover ? `<img src="${esc(couv(cover, 400))}" alt="">` : ""}</span><div><h1>${esc(d.serie.fr || d.serie.t)}</h1>${d.serie.auteurs ? `<p>${esc(d.serie.auteurs)}</p>` : ""}<p>${esc([e.pub, e.label, total ? total + " tomes" : "", (e.statut || "").toLowerCase()].filter(Boolean).join(" · "))}</p>${edsw}</div>
    <div class="acts">${prog}<div class="ctas" style="margin:0">${fiche}${LT === "c" ? tout : ""}</div></div></div></div>
    <div class="mob">${prog}</div>
    <div class="det-tools">${lseg}${leg}</div>
    <div class="tg">${e.tomes.map(tome).join("")}</div>
    <div class="ctas mob">${fiche}${LT === "c" ? tout : ""}</div>`;
}

/* ---------- actions ---------- */
async function envoyer(l, on, tomes, el){
  el && el.classList.add("busy");
  try {
    const r = await fetch("/api/collection", { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ l, on, tomes }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 402 || j.error === "quota") { if (j.lists) L = j.lists; quotaPlein(); return false; }
    if (r.status === 401) { gate(); return false; }
    if (!r.ok || !j.ok) throw new Error(j.error || "Erreur");
    L = j.lists; MAX = j.max; return true;
  } catch (err) { toast("Impossible d'enregistrer, réessaie."); return false; }
  finally { el && el.classList.remove("busy"); }
}
function quotaPlein(){
  const p = document.createElement("div"); p.className = "pay";
  p.innerHTML = `<div><b>${MAX}/${MAX} tomes</b><p>Ta collection gratuite est pleine. L'offre pour aller plus loin arrive bientôt ; en attendant, tes ${MAX} tomes restent là et tu peux en retirer pour en ajouter d'autres.</p><button class="btn">OK</button></div>`;
  document.body.appendChild(p); p.onclick = e => { if (e.target === p || e.target.closest(".btn")) p.remove(); };
}
document.addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]"); if (tb) { TAB = tb.dataset.tab; F.statut.clear(); home(); return; }
  const fb = e.target.closest("[data-f]"); if (fb) { const g = F[fb.dataset.f], v = fb.dataset.v; g.has(v) ? g.delete(v) : g.add(v); drawHome(); return; }
  if (e.target.closest("[data-more]")) { SHOWN += 60; drawHome(); return; }
  const lk = e.target.closest("a.c, a.back"); if (lk && lk.getAttribute("href").startsWith("/ma-collection/")) { e.preventDefault(); history.pushState(null, "", lk.getAttribute("href")); route(); window.scrollTo(0, 0); return; }
  const s = BYSLUG[slugAdr()]; const d = s && DET[s.id + ":v"]; if (!d) return;
  const ed = e.target.closest("[data-ed]"); if (ed) { ED = ed.dataset.ed; drawSerie(s, d); return; }
  const lt = e.target.closest("[data-lt]"); if (lt) { LT = lt.dataset.lt; drawSerie(s, d); return; }
  const t = e.target.closest("[data-t]");
  if (t) { const on = !L[LT][t.dataset.t]; if (await envoyer(LT, on, [{ t: t.dataset.t, s: s.id }], t)) { drawSerie(s, d); if (on && LT === "c" && MAX && Object.keys(L.c).length === MAX) toast(`${MAX}/${MAX} : ta collection gratuite est pleine`); } return; }
  const j = e.target.closest("[data-jusqua]");
  if (j) { const ee = d.editions.find(x => x.id === ED) || d.editions[0]; const tomes = ee.tomes.filter(x => x.paru && !L.c[x.id]).map(x => ({ t: x.id, s: s.id }));
    if (!tomes.length) { toast("Tu as déjà tous les tomes parus ✓"); return; }
    if (await envoyer("c", true, tomes, j)) { drawSerie(s, d); toast(`${tomes.length} tome${tomes.length > 1 ? "s" : ""} ajouté${tomes.length > 1 ? "s" : ""} ✓`); } }
});
addEventListener("popstate", route);

/* ---------- accès ---------- */
function gate(){
  const pile = CAT.filter(s => s.cover).slice(0, 3);
  app().innerHTML = `<div class="gate"><div class="stack">${pile.map(s => `<span><img src="${esc(couv(s.cover, 200))}" alt=""></span>`).join("")}</div><b>Range ta collection</b><p>Note tes tomes, ce qu'il te manque, ta pile à lire et ta wishlist. Réservé aux membres, gratuit jusqu'à 25 tomes.</p><button class="btn" id="join">Devenir membre</button><button class="btn g" id="join2">J'ai déjà un compte</button></div>`;
  const go = () => { const b = document.getElementById("sh-me"); if (b) b.click(); };
  document.getElementById("join").onclick = go; document.getElementById("join2").onclick = go;
}
async function route(){
  const sl = slugAdr();
  if (sl) await serie(sl); else await home();
}
(async function start(){
  const [cat, col] = await Promise.all([
    fetch("/api/biblio").then(r => r.json()).catch(() => ({})),
    fetch("/api/collection", { credentials: "same-origin" }).then(r => r.status === 401 ? { gate: 1 } : r.json()).catch(() => ({ gate: 1 })),
  ]);
  CAT = cat.items || []; CAT.forEach(s => { BYID[s.id] = s; BYSLUG[s.slug] = s; });
  if (col.gate || !col.ok) { gate(); return; }
  L = { c: {}, p: {}, k: {}, w: {}, ...col.lists }; MAX = col.max;
  // Les détails des séries de la collection, pour les « 7/9 tomes ».
  const ids = [...new Set(Object.values(L).flatMap(x => Object.values(x)))];
  await Promise.all(ids.map(detail));
  route();
})();
</script>
