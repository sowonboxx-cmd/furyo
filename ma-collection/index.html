<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma collection · FuryoGang</title>
<meta name="description" content="Ta bibliothèque de mangas furyō, yakuza et crime : les tomes que tu as, ceux qui te manquent, et ceux que tu as envie de lire.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* Bibliothèque « Ma collection » (Will, 06/10/2026).
   Ordinateur : maquette A (barre latérale : onglets, chiffres, filtres ; grille de 6). Téléphone : maquette A (onglets soulignés,
   chiffres Tomes / Séries / Panier / Wishlist visibles, grille de 3). /ma-collection/<série> = la page de la série : tomes à cocher. */
:root{
  --bg:#000; --s1:#1C1C1E; --s2:#2C2C2E; --s3:#38383B; --line:#2C2C2F;
  --fg:#F5F5F7; --fg2:#D8D8DC; --mut:#98989D;
  --blue:#658DBB; --cta:#305887; --yel:#F2B33D; --red:#BC002D; --ok:#4DAB9A;
  --fd:Antonio,"Arial Narrow",Impact,sans-serif; --fb:Inter,"Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--fb);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page{max-width:1320px;margin:0 auto;padding:22px 16px 60px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
/* ---------- accueil ---------- */
.lay{display:block}
.side{display:none}
.h1{margin:0;font:700 34px/1 var(--fd);text-transform:uppercase}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;padding:8px 0 11px;color:var(--mut);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:var(--blue)}
.tabs em{font-style:normal;font-size:12px;margin-left:4px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.stats div{background:var(--s1);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font:700 24px/1 var(--fd);color:var(--yel);font-variant-numeric:tabular-nums}
.stats small{font:700 9.5px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.lck{opacity:.6;margin-left:auto;flex:none}
.quota{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2);margin-top:12px}
.quota b{color:var(--fg);font-variant-numeric:tabular-nums}
.quota .bar{flex:1;height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.quota .bar i{display:block;height:100%;background:var(--yel)}
.tools{display:flex;gap:8px;align-items:center;margin-top:12px}
.search{flex:1;min-width:0;height:42px;border-radius:10px;background:var(--s1);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 15px var(--fb)}
.search input::placeholder{color:var(--mut)}
.sort{height:42px;border-radius:10px;background:var(--s1);border:0;color:var(--fg2);font:600 13px var(--fb);padding:0 10px;cursor:pointer}
/* Mobile (Will, 08/10/2026) : plus de pastilles ni de menu A → Z, un seul bouton « Filtres » qui ouvre une feuille avec tous les tris et filtres. */
/* Mini classement sous le compteur (Will, 08/10/2026) : les 3 premiers du classement général, puis « Voir plus » vers Communauté. */
.side .rkb{background:var(--s1);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;zoom:1.05}
.side .rkb .ch{display:flex;justify-content:space-between;font:700 10.5px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.side .rkb .ch span:first-child{color:var(--fg)}
.side .rkb a.r{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--fg);min-width:0}
.side .rkb .n{width:14px;font:700 15px var(--fd);color:var(--mut);text-align:center;flex:none}
.side .rkb .av{width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font:700 12px var(--fb);color:#000}
.side .rkb .av img{width:100%;height:100%;object-fit:cover}
.side .rkb .ps{flex:1;min-width:0;font:600 13.5px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .rkb .t{font:700 15px var(--fd);color:var(--fg2)}
.side .rkb .r1 .n,.side .rkb .r1 .t{color:#F2B33D}.side .rkb .r1 .av{box-shadow:0 0 0 2px #F2B33D}
.side .rkb .r2 .av{box-shadow:0 0 0 2px #C9CED6}.side .rkb .r3 .av{box-shadow:0 0 0 2px #C98A55}
.side .rkb .r1 .ps{font-weight:700}
.side .rkb .crn{width:12px;height:10px;color:#F2B33D;flex:none;margin-left:-3px}
.side .rkb .vp{margin-top:2px;height:32px;border-radius:16px;background:var(--s2);color:var(--fg);font:600 13px var(--fb);display:grid;place-items:center;text-decoration:none}
.fbtn{flex:none;height:42px;border-radius:10px;border:0;background:var(--s1);color:var(--fg);font:600 13.5px var(--fb);padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.fbtn svg{width:17px;height:17px}.fbtn em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:#0A84FF;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media (max-width:979px){.tools .sort,.chips{display:none!important}}
.fsh{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.fsh>div{width:100%;max-height:82vh;overflow:auto;background:var(--s1);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.fsh .gr{width:36px;height:5px;border-radius:3px;background:var(--s2);margin:4px auto 10px}
.fsh .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.fsh .hd b{font:700 22px var(--fd);text-transform:uppercase}
.fsh .hd button{border:0;background:none;color:#0A84FF;font:600 14px var(--fb);cursor:pointer;padding:6px 0}
.fsh h5{margin:16px 0 8px;font:700 11px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.fsh .ops{display:flex;flex-wrap:wrap;gap:6px}
.fsh .ops button{height:34px;padding:0 13px;border-radius:17px;border:0;background:var(--s2);color:var(--fg2);font:600 13px var(--fb);cursor:pointer}
.fsh .ops button[aria-pressed=true]{background:var(--fg);color:#000}
.fsh .go{margin-top:18px;width:100%}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 12px;border-radius:16px;border:0;background:var(--s1);color:var(--fg2);font:600 13px var(--fb);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--fg);color:#000}
.cnt{color:var(--mut);font-size:12.5px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
/* Raccourci vers « Toute la base » (Will, 09/10/2026) */
.cnt .gob{color:var(--yel);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}.cnt .gob:hover{text-decoration:underline}
.sh2{margin:24px 0 4px;font:700 20px var(--fd);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
#base{scroll-margin-top:calc(var(--sh-h, 64px) + 12px)}
.sh2 small{font:500 12.5px var(--fb);color:var(--mut);text-transform:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;padding-top:6px}
.c{min-width:0;display:flex;flex-direction:column;gap:5px;text-decoration:none}
.cv{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--s1)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font:700 13px/1.15 "Noto Sans JP",var(--fb);color:var(--mut)}
.c b{font:600 12.5px/1.25 var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c small{font:500 11.5px var(--fb);color:var(--mut);font-variant-numeric:tabular-nums}
.c small.full{color:var(--yel)}
.c small.add{color:var(--blue)}
.tag{position:absolute;left:5px;top:5px;background:var(--yel);color:#000;font:800 9px var(--fb);letter-spacing:.06em;padding:2px 5px;border-radius:4px;text-transform:uppercase}
.more{display:flex;justify-content:center;margin-top:18px}
.btn{height:44px;border-radius:22px;border:0;background:var(--cta);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 14.5px var(--fb);padding:0 20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.g{background:var(--s1);color:var(--fg)}
.btn.busy{opacity:.5;pointer-events:none}
.arr{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.side .sbox{background:var(--s1);border-radius:14px;padding:14px}
.side .sbox b{display:block;font:700 26px var(--fd);color:var(--yel)}
.side .sbox small{color:var(--fg2);font-size:13px}
/* Total de la base à côté de sa collection, pour comparer d'un coup d'œil (Will, 08/10/2026) */
.side .sbox b em{font-style:normal;color:var(--fg2);font-size:18px;font-weight:700}
/* Compteur Z1 : ma collection vs base, pourcentage en exposant (Will, 08/10/2026) */
.side .cmp{background:var(--s1);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;zoom:1.05}
.side .cmp .ch{display:flex;justify-content:space-between;font:700 10.5px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.side .cmp .ch span:first-child{color:var(--yel)}
.side .cmp .cr{display:flex;align-items:flex-end;gap:6px}
.side .cmp .cr b{font:700 26px var(--fd);color:var(--yel);line-height:.8;padding-top:1px}
.side .cmp .cs{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch}
.side .cmp .cs em{font:700 9.5px var(--fb);font-style:normal;line-height:1;color:var(--fg)}
.side .cmp .cs span{font:700 10.5px var(--fb);letter-spacing:.08em;color:var(--fg2);line-height:1;margin-bottom:-5px}
.side .cmp .cr>i{margin-left:auto;font:700 17px var(--fd);font-style:normal;color:var(--fg);line-height:.8}
.side .cmp .cb{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:8px}.side .cmp .cb i{display:block;height:100%;background:var(--yel)}
.side .sbox small.base{display:block;margin-top:8px}
.side .sbox .bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:8px}.side .sbox .bar i{display:block;height:100%;background:var(--yel)}
.side h4{margin:0 0 8px;font:700 12px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.side .lk{display:flex;flex-direction:column;gap:2px}
.side .lk button{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;border:0;background:none;font-weight:600;color:var(--fg2);cursor:pointer;text-align:left}
.side .lk button[aria-pressed=true]{background:var(--s1);color:var(--fg)}
.side .lk em{font-style:normal;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.side .fk{display:flex;flex-direction:column;gap:7px}
.side .fk button{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--fg2);font-size:14px;cursor:pointer;padding:0;text-align:left}
.side .fk i{width:16px;height:16px;border-radius:4px;border:1.5px solid #555;flex:none}
.side .fk button[aria-pressed=true] i{background:var(--blue);border-color:var(--blue)}
/* ---------- page série ---------- */
/* En-tête D3 (Will, 07/10) */
.sc{position:relative;background:#161618;border-radius:20px;padding:14px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px}
.scv{display:block;width:96px;aspect-ratio:5/7;border-radius:8px;overflow:hidden;background:var(--s1);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.scv img{width:100%;height:100%;object-fit:cover;display:block}
.stx{min-width:0;display:contents}
.stx>div:first-child{min-width:0}
.sc h1{margin:0;font:700 30px/1 var(--fd);text-transform:uppercase;overflow-wrap:anywhere}
.jpt{margin:4px 0 0;color:var(--fg2);font-size:13px}
.scr{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}.scr dt{color:var(--mut)}.scr dd{margin:0;font-weight:600}
.eds{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.eds button{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1.5px solid transparent;background:#1F1F22;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.eds .flag{width:22px;height:15px;border-radius:2px;flex:none}
.eds span{display:flex;flex-direction:column;flex:1;min-width:0}.eds b{font-size:14px}.eds em{font-style:normal;color:var(--mut);font-size:12.5px}
.eds i{font-style:normal;font-weight:600;color:var(--fg)}.eds i.on{color:var(--ok)}.eds i.stop{color:#E5483A}
.eds .n{flex:none;font:700 20px var(--fd);color:var(--fg2);font-variant-numeric:tabular-nums}
/* Édition choisie (Will, 07/10) : fond noir, trait rouge, sans bordure ; survol des autres plus clair. */
.eds button{position:relative;border:0;transition:background .15s}
.eds button[aria-pressed=true]{background:#000;padding-left:24px}
.eds button[aria-pressed=true]::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--red)}
.eds button[aria-pressed=false]:hover{background:#2A2A2D}
.pane{grid-column:1/-1;background:#0E0E10;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.big{display:flex;align-items:baseline;gap:8px}.big b{font:700 56px/.85 var(--fd);font-variant-numeric:tabular-nums}.big span{font:700 18px var(--fd);color:var(--mut);text-transform:uppercase}
.pane .pb{height:6px}
.pane .btn{display:flex;align-items:center;justify-content:center;gap:10px}
.ic.st{width:19px;height:19px;fill:currentColor;stroke:none;flex:none}
@media (max-width:979px){.pane .big,.pane .pb{display:none}.pane{padding:12px}}

.hero{position:relative;overflow:hidden;margin:-22px -16px 0;padding:18px 16px 18px}
.hero .bgi{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.42);transform:scale(1.2)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),#000 96%)}
.hero .in{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:stretch}
.hero .tx{display:flex;flex-direction:column;gap:12px;min-width:0}.hero .tx .edsw{margin-top:auto}
.hero .acts{align-self:end}.hero .c1{align-self:start}
.hero .c1{width:96px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--s1);box-shadow:0 10px 26px rgba(0,0,0,.6)}
.hero .c1 img{width:100%;height:100%;object-fit:cover;display:block}
/* Cœur « Suivre la série » comme sur les fiches (Will, 09/10/2026). */
.sc{position:relative}.sc h1{padding-right:44px}
.mfol{position:absolute;top:0;right:0;z-index:2;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;border:0;border-radius:17px;background:var(--s1);color:var(--fg);font:600 13px var(--fb);cursor:pointer}
.mfol svg{width:16px;height:16px}.mfol[aria-pressed=true]{color:#FF4D67}.mfol[aria-pressed=true] span{color:var(--fg)}
@media (max-width:979px){.mfol{width:36px;padding:0;justify-content:center;background:transparent}.mfol svg{width:21px;height:21px}.mfol span{display:none}}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;text-decoration:none;position:relative;margin-bottom:12px}
.hero h1{margin:0;font:700 30px/1 var(--fd);text-transform:uppercase;overflow-wrap:anywhere}
.hero p{margin:5px 0 0;color:var(--fg2);font-size:13px}
.hero .acts{display:none}
.edsw{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.edsw button{flex:1 0 auto;background:var(--s1);border:0;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);text-align:left;cursor:pointer}
.edsw button b{display:block;color:var(--fg);font-size:13.5px}
.edsw button[aria-pressed=true]{background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.lseg{display:flex;margin-top:12px;background:var(--s1);border-radius:10px;padding:3px}
.lseg button{flex:1;border:0;background:none;font:600 12.5px var(--fb);padding:7px 0;border-radius:8px;color:var(--fg2);cursor:pointer;white-space:nowrap}
.lseg button[aria-pressed=true]{background:var(--s3);color:var(--fg)}
.prog{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prog .l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}
.prog .l b{color:var(--fg);font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.pb i{display:block;height:100%;background:var(--blue)}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ctas{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.ctas .btn{flex:1}
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin-top:14px}
.t{min-width:0;display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.t.miss .cv{background:#000}.t.miss .cv img{opacity:.35}
.t.soon .cv{border:1.5px dashed #3A3A3D;background:var(--s1)}
.t.soon{cursor:default}
.t small{font:600 11.5px var(--fb);color:var(--fg2);display:flex;justify-content:space-between;gap:4px}
.t small em{font-style:normal;color:var(--mut);font-weight:500;white-space:nowrap}
.t .cv .jpc{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.72);color:#D8D8DC;font:600 10px/1.4 var(--fb,inherit);letter-spacing:.02em}
.t .cv .n{position:absolute;inset:0;display:grid;place-items:center;font:700 28px var(--fd);color:#48484A}
.bk-ck{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.bk-ck svg{width:14px;height:14px;stroke:#000;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.bk-ck.k{background:var(--yel)}.bk-ck.w{background:#E58AD1}.bk-ck.p{background:var(--blue)}
.plus{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;font:700 16px/1 var(--fb)}
.t.busy{opacity:.5;pointer-events:none}
/* ---------- accès ---------- */
.gate{max-width:420px;margin:40px auto;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate .stack{display:flex;margin-bottom:8px}.gate .stack span{width:78px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;margin:0 -12px;box-shadow:0 8px 20px rgba(0,0,0,.6);background:var(--s1)}
.gate .stack span img{width:100%;height:100%;object-fit:cover;display:block}
.gate .stack span:nth-child(1){transform:rotate(-8deg)}.gate .stack span:nth-child(3){transform:rotate(8deg)}.gate .stack span:nth-child(2){position:relative;z-index:1;transform:translateY(-8px)}
.gate b{font:700 32px/1.05 var(--fd);text-transform:uppercase}
.gate p{margin:0;color:var(--fg2);max-width:32ch}
.gate .btn{align-self:stretch}
.pay.gp>.gate{margin:0;position:relative;background:var(--s1);border-radius:20px;padding:28px 22px 22px;max-width:400px;width:100%}
.gx{position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:var(--s2);color:var(--fg2);font:600 20px/1 var(--fb);cursor:pointer}

}

<body>
<script src="/site/header.js?v=44"></script>
<div class="page"><div id="app"></div></div>
<script>document.getElementById("app").innerHTML = window.FG_SK ? (/^\/ma-collection\/[^/]+/.test(location.pathname) ? FG_SK.fiche() : FG_SK.grid(12)) : "";</script>
<div class="toast" id="toast"></div>
<script>
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const couv = (u, w) => u ? "/api/couv?u=" + encodeURIComponent(u) + "&w=" + (w || 360) : "";
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const I = {
  fil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  s: '<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  back: '<svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  arr: '<svg class="arr" viewBox="0 0 24 24"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>',
  ck: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'
};
I.stack = '<svg class="ic st" viewBox="0 0 24 24"><rect x="3" y="5" width="4" height="15" rx="1"/><rect x="8.5" y="3" width="4" height="17" rx="1"/><path d="m14.6 5.6 3.9-1 3.6 14.3-3.9 1z"/></svg>';
const FLAG = {
  Japon: '<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="Japon"><rect width="22" height="15" fill="#F5F5F7"/><circle cx="11" cy="7.5" r="4.2" fill="#E5483A"/></svg>',
  France: '<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="France"><rect width="7.34" height="15" fill="#2F5DA8"/><rect x="7.33" width="7.34" height="15" fill="#F5F5F7"/><rect x="14.66" width="7.34" height="15" fill="#E5483A"/></svg>'
};
// « Envie de lire » remplace Pile à lire et Wishlist (Will, 09/10/2026) : clé w ; l'ancienne pile (p) y est fusionnée côté serveur.
const LISTS = [["c", "Collection"], ["w", "Envie de lire"], ["k", "Panier"]];
// Envie de lire et Panier : réservés aux membres Premium (Will, 08/10/2026). La Collection est illimitée pour tous.
const VERROU = '<svg class="lck" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>';
const ferme = k => k !== "c" && !VIP;
const VERBE = { c: "Possédé", p: "Envie de lire", k: "Au panier", w: "Envie de lire" };
// Compteur Z1 : ma collection à gauche, base FuryoGang à droite, % en exposant
function cmpBox(n) {
  const fr = v => v.toLocaleString("fr-FR"), pc = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
  const row = (v, tot, lab) => { const p = pc(v, tot); return `<div><div class="cr"><b>${fr(v)}</b><div class="cs"><em>${String(p).replace(".", ",")} %</em><span>${lab}</span></div><i>${fr(tot)}</i></div><div class="cb"><i style="width:${Math.min(100, p)}%"></i></div></div>`; };
  return `<div class="cmp"><div class="ch"><span>Ma collection</span><span>Total</span></div>${row(n.tomes, STATS.tomes, "TOMES")}${STATS.series ? row(n.series, STATS.series, "SÉRIES") : ""}</div>`;
}
let STATS = {}, CAT = [], BYID = {}, BYSLUG = {}, L = { c: {}, p: {}, k: {}, w: {} }, MAX = null, VIP = false, TAB = "c", Q = "", SORT = "az", DET = {};
const F = { statut: new Set(), pays: new Set(), genre: new Set() };
let SHOWN = 60;
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2000); }
const app = () => document.getElementById("app");
const slugAdr = () => decodeURIComponent((location.pathname.match(/^\/ma-collection\/([^/]+)/) || [])[1] || "");

/* ---------- données ---------- */
async function detail(id){
  // Jusqu'à 4 essais espacés : Notion peut répondre « trop de requêtes » quand la base est très sollicitée. Une erreur n'est pas gardée en mémoire.
  const get = async () => { for (let k = 0; k < 4; k++) { try { const r = await fetch("/api/biblio?id=" + id + (k ? "&t=" + k : "")); const j = await r.json(); if (r.ok && j && j.editions) return j; } catch (e) {} await new Promise(f => setTimeout(f, 800 + k * 1200)); } return { error: "x" }; };
  if (!DET[id]) DET[id] = get();
  const d = await DET[id]; if (d.error) delete DET[id]; else DET[id + ":v"] = d; return d;
}
// Séries d'une liste + le nombre de tomes de la série dans la liste.
function seriesDe(l){ const m = {}; Object.values(L[l]).forEach(s => { m[s] = (m[s] || 0) + 1; }); return m; }
// Édition de référence pour « 7/9 tomes » : celle où le membre a le plus de tomes (France d'abord à égalité).
function resume(d, l){
  if (!d || !d.editions) return null;
  let best = null;
  for (const e of d.editions) {
    const has = e.tomes.filter(t => L[l][t.id]).length, parus = e.tomes.filter(t => t.paru).length;
    if (!best || has > best.has) best = { e, has, parus, total: e.nb || e.tomes.length };
  }
  return best;
}

/* ---------- accueil ---------- */
async function home(){
  document.title = "Ma collection · FuryoGang";
  const ids = Object.keys(seriesDe(TAB));
  await Promise.all(ids.map(detail));
  drawHome();
}
function card(s, l){
  const r = s._r, inList = s._n || 0, full = l === "c" && r && r.parus > 0 && r.has >= r.parus;
  const sub = !inList ? `<small class="add">+ Ajouter</small>` : l === "c" && r ? `<small class="${full ? "full" : ""}">${r.has}/${r.parus || r.total} tome${(r.parus || r.total) > 1 ? "s" : ""}</small>` : `<small>${inList} tome${inList > 1 ? "s" : ""}</small>`;
  return `<a class="c" href="/ma-collection/${esc(s.slug)}"><span class="cv">${s.cover ? `<img src="${esc(couv(s.cover))}" alt="" loading="lazy">` : `<span class="ph" lang="ja">${esc((s.jp || s.t).slice(0, 8))}</span>`}${full ? '<span class="tag">Complète</span>' : ""}</span><b>${esc(s.fr || s.t)}</b>${sub}</a>`;
}
function filtre(list){
  const q = norm(Q);
  return list.filter(s => {
    if (q && !norm([s.t, s.fr, s.jp].join(" ")).includes(q) && !(s.jp || "").includes(Q)) return false;
    if (F.pays.size && !s.pays.some(p => F.pays.has(p))) return false;
    if (F.genre.size && !(s.genres || []).some(g => F.genre.has(g))) return false;
    if (F.statut.size && TAB === "c") {
      const r = s._r, full = r && r.parus > 0 && r.has >= r.parus;
      if (!((F.statut.has("complete") && full) || (F.statut.has("manque") && !full))) return false;
    }
    return true;
  }).sort((a, b) => SORT === "za" ? norm(b.fr || b.t).localeCompare(norm(a.fr || a.t)) : SORT === "new" ? (b.y1 || 0) - (a.y1 || 0) : SORT === "old" ? (a.y1 || 9999) - (b.y1 || 9999) : SORT === "tomes" ? (b._n || 0) - (a._n || 0) || norm(a.fr || a.t).localeCompare(norm(b.fr || b.t)) : norm(a.fr || a.t).localeCompare(norm(b.fr || b.t)));
}
function counts(){
  const sc = Object.keys(seriesDe("c")).length;
  return { tomes: Object.keys(L.c).length, series: sc, p: Object.keys(L.p).length, k: Object.keys(L.k).length, w: Object.keys(L.w).length };
}
// Feuille « Filtres » (mobile) : tri + statut + pays + genres, appliqués tout de suite.
const TRIS = [["az", "A → Z"], ["za", "Z → A"], ["new", "Plus récentes"], ["old", "Plus anciennes"], ["tomes", "Plus de tomes"]];
const nbF = () => F.statut.size + F.pays.size + F.genre.size + (SORT !== "az" ? 1 : 0);
function feuille(){
  let f = document.querySelector(".fsh");
  if (!f) { f = document.createElement("div"); f.className = "fsh"; document.body.appendChild(f);
    f.addEventListener("click", e => {
      if (e.target === f || e.target.closest(".go")) { f.remove(); return; }
      if (e.target.closest("[data-raz]")) { F.statut.clear(); F.pays.clear(); F.genre.clear(); SORT = "az"; drawHome(); feuille(); return; }
      const t = e.target.closest("[data-tri]"); if (t) { SORT = t.dataset.tri; drawHome(); feuille(); return; }
      const b = e.target.closest("[data-ff]"); if (b) { const g = F[b.dataset.ff], v = b.dataset.v; g.has(v) ? g.delete(v) : g.add(v); drawHome(); feuille(); }
    }); }
  const op = (g, v, l) => `<button data-ff="${g}" data-v="${esc(v)}" aria-pressed="${F[g].has(v)}">${esc(l)}</button>`;
  const genres = [...new Set(CAT.flatMap(x => x.genres || []))].sort((a, b) => a.localeCompare(b, "fr"));
  const n = (document.querySelector(".cnt span") || {}).textContent || "";
  f.innerHTML = `<div role="dialog" aria-label="Filtres"><div class="gr"></div><div class="hd"><b>Filtres</b><button data-raz>Tout effacer</button></div>
    <h5>Trier</h5><div class="ops">${TRIS.map(([k, l]) => `<button data-tri="${k}" aria-pressed="${SORT === k}">${l}</button>`).join("")}</div>
    ${TAB === "c" ? `<h5>Statut</h5><div class="ops">${op("statut", "complete", "Complètes")}${op("statut", "manque", "Tome manquant")}</div>` : ""}
    <h5>Pays</h5><div class="ops">${op("pays", "France", "France")}${op("pays", "Japon", "Japon")}</div>
    <h5>Genre</h5><div class="ops">${genres.map(g => op("genre", g, g)).join("")}</div>
    <button class="btn go">Voir ${esc(n.split("·")[1] ? n.split("·")[1].trim() : "les séries")}</button></div>`;
}
// Mini classement (général) : chargé une fois, après la collection.
let RANG = null;
const RCOUL = ["#F2B33D", "#E58FA8", "#7FA7C9", "#7BC67E", "#A48CD6", "#E0955F", "#9C978A", "#E5483A"];
function rangBox(){
  if (!RANG || !RANG.length) return "";
  const av = m => m.photo ? `<span class="av"><img src="${esc(m.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>` : `<span class="av" style="background:${RCOUL[(m.num || 0) % RCOUL.length]}">${esc((m.pseudo || "?")[0].toUpperCase())}</span>`;
  return `<div class="rkb"><div class="ch"><span>Classement</span><span>Tomes</span></div>${RANG.map((x, i) => `<a class="r r${i + 1}" href="${x.m.slug ? "/membres/" + encodeURIComponent(x.m.slug) : "/communaute/"}"><span class="n">${i + 1}</span>${av(x.m)}<span class="ps">${esc(x.m.pseudo || "Membre")}</span>${i === 0 ? '<svg class="crn" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 11H4z"/></svg>' : ""}<span class="t">${x.n.toLocaleString("fr-FR")}</span></a>`).join("")}<a class="vp" href="/communaute/">Voir plus</a></div>`;
}
async function chargerRang(){
  try {
    const [c, m] = await Promise.all([fetch("/api/communaute", { credentials: "same-origin" }).then(r => r.ok ? r.json() : null), fetch("/api/membres").then(r => r.ok ? r.json() : null)]);
    if (!c || !c.ok || !m) return;
    const MB = Object.fromEntries((m.items || []).filter(x => x.id).map(x => [x.id, x]));
    RANG = ((c.classements || {}).g || []).filter(x => MB[x.id] && x.n > 0).slice(0, 3).map(x => ({ n: x.n, m: MB[x.id] }));
    const sd = document.querySelector(".side"), w = sd && sd.querySelector(".cmp, .sbox");
    if (RANG.length && w && !sd.querySelector(".rkb")) w.insertAdjacentHTML("afterend", rangBox());
  } catch (e) {}
}
function drawHome(){
  const n = counts(), m = seriesDe(TAB);
  const mine = Object.keys(m).map(id => BYID[id]).filter(Boolean).map(s => ({ ...s, _n: m[s.id], _r: resume(DET[s.id + ":v"], TAB) }));
  const listeF = filtre(mine);
  const cherche = !!Q;
  const base = cherche ? filtre(CAT.filter(s => !m[s.id]).map(s => ({ ...s, _n: 0 }))) : [];
  const vide = !mine.length;
  const genres = [...new Set(CAT.flatMap(s => s.genres || []))].sort((a, b) => a.localeCompare(b, "fr")).slice(0, 14);
  const quota = MAX ? `<div class="quota"><b>${n.tomes}/${MAX}</b><span>tomes gratuits</span><div class="bar"><i style="width:${Math.min(100, n.tomes / MAX * 100)}%"></i></div></div>` : "";
  const tabs = `<div class="tabs mob">${LISTS.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${TAB === k}"${ferme(k) ? ' data-lock="1"' : ""}>${l}${ferme(k) ? VERROU : `<em>${k === "c" ? n.tomes : n[k]}</em>`}</button>`).join("")}</div>`;
  const stats = `<div class="stats mob"><div><b>${n.tomes}</b><small>Tomes</small></div><div><b>${n.series}</b><small>Séries</small></div><div><b>${n.k}</b><small>Panier</small></div><div><b>${n.w}</b><small>Envie de lire</small></div></div>`;
  const chip = (g, v, l) => `<button data-f="${g}" data-v="${esc(v)}" aria-pressed="${F[g].has(v)}">${esc(l)}</button>`;
  const chips = `<div class="chips mob">${TAB === "c" ? chip("statut", "complete", "Complètes") + chip("statut", "manque", "Tome manquant") : ""}${chip("pays", "France", "France")}${chip("pays", "Japon", "Japon")}${genres.slice(0, 8).map(g => chip("genre", g, g)).join("")}</div>`;
  const side = `<aside class="side"><h1 class="h1">Ma collection</h1>${MAX ? `<div class="sbox"><b>${n.tomes}/${MAX}</b><small>tomes gratuits</small><div class="bar"><i style="width:${Math.min(100, n.tomes / MAX * 100)}%"></i></div>${STATS.tomes ? `<small class="base">Dans la base : ${STATS.tomes.toLocaleString("fr-FR")} tomes · ${STATS.series} séries</small>` : ""}</div>` : STATS.tomes ? cmpBox(n) : `<div class="sbox"><b>${n.tomes}</b><small>tomes · ${n.series} séries</small></div>`}${rangBox()}
    <div><h4>Ma bibliothèque</h4><div class="lk">${LISTS.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${TAB === k}"${ferme(k) ? ' data-lock="1"' : ""}>${l}${ferme(k) ? VERROU : `<em>${k === "c" ? n.tomes : n[k]}</em>`}</button>`).join("")}</div></div>
    ${TAB === "c" ? `<div><h4>Statut</h4><div class="fk">${[["complete", "Complètes"], ["manque", "Tome manquant"]].map(([v, l]) => `<button data-f="statut" data-v="${v}" aria-pressed="${F.statut.has(v)}"><i></i>${l}</button>`).join("")}</div></div>` : ""}
    <div><h4>Pays</h4><div class="fk">${["France", "Japon"].map(v => `<button data-f="pays" data-v="${v}" aria-pressed="${F.pays.has(v)}"><i></i>${v}</button>`).join("")}</div></div>
    <div><h4>Genre</h4><div class="fk">${genres.map(v => `<button data-f="genre" data-v="${esc(v)}" aria-pressed="${F.genre.has(v)}"><i></i>${esc(v)}</button>`).join("")}</div></div></aside>`;
  const nomTab = LISTS.find(x => x[0] === TAB)[1];
  const grille = listeF.length ? `<div class="grid">${listeF.map(s => card(s, TAB)).join("")}</div>`
    : vide && !cherche ? `<p class="empty">${TAB === "c" ? "Ta collection est vide. Cherche une série ci-dessus, ouvre-la et coche les tomes que tu as." : `Rien dans « ${nomTab} » pour l'instant. Ouvre une série et choisis « ${nomTab} » pour y ajouter des tomes.`}</p>`
    : cherche ? "" : `<p class="empty">Aucune série ne correspond à ces filtres.</p>`;
  const RESTE = cherche ? [] : filtre(CAT.filter(s => !m[s.id]).map(s => ({ ...s, _n: 0 }))), LIM = vide ? SHOWN : SHOWN - 30; // 30 d'abord sous la collection, puis +60 à chaque « Voir plus »
  const catalogue = cherche ? `<div class="sh2">Toute la base<small>${base.length} série${base.length > 1 ? "s" : ""}</small></div>${base.length ? `<div class="grid">${base.slice(0, SHOWN).map(s => card(s, TAB)).join("")}</div>${base.length > SHOWN ? `<div class="more"><button class="btn g" data-more>Voir plus</button></div>` : ""}` : `<p class="empty">Aucune série trouvée dans la base.</p>`}`
    : `<div class="sh2" id="base">Toute la base<small>${STATS.series || CAT.length} séries · ${(STATS.tomes || 0).toLocaleString("fr-FR")} tomes</small></div><div class="grid">${RESTE.slice(0, LIM).map(s => card(s, TAB)).join("")}</div>${RESTE.length > LIM ? `<div class="more"><button class="btn g" data-more>Voir plus</button></div>` : ""}`;
  app().innerHTML = `<div class="lay">${side}<div><div class="mtop mob"><h1 class="h1">Ma collection</h1>${tabs}${stats}${quota}</div>
    <div class="tools"><label class="search">${I.s}<input id="q" type="search" placeholder="Chercher une série" value="${esc(Q)}" autocomplete="off"></label><button class="fbtn mob" type="button" data-fsh>${I.fil}Filtres${nbF() ? `<em>${nbF()}</em>` : ""}</button><select class="sort" id="sort" aria-label="Trier"><option value="az"${SORT === "az" ? " selected" : ""}>A → Z</option><option value="za"${SORT === "za" ? " selected" : ""}>Z → A</option><option value="new"${SORT === "new" ? " selected" : ""}>Plus récentes</option></select></div>
    ${chips}<div class="cnt"><span>${nomTab} · ${mine.length} série${mine.length > 1 ? "s" : ""}${TAB === "c" ? " · " + n.tomes + " tome" + (n.tomes > 1 ? "s" : "") : ""}</span><a class="gob" href="#base" data-gobase>Toute la base ↓</a></div>${grille}${catalogue}</div></div>`;
  const q = document.getElementById("q");
  q.oninput = () => { Q = q.value; SHOWN = 60; const pos = q.selectionStart; drawHome(); const q2 = document.getElementById("q"); q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} };
  document.getElementById("sort").onchange = e => { SORT = e.target.value; drawHome(); };
}

/* ---------- page d'une série ---------- */
let ED = null, LT = "c";
// Suivre la série depuis Ma collection : même stockage que le cœur des fiches (/api/follow).
const COEUR = on => `<svg viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3 15 3 8.8C3 6 5.1 4 7.7 4c1.8 0 3.3 1 4.3 2.4C13 5 14.5 4 16.3 4 18.9 4 21 6 21 8.8 21 15 12 20.5 12 20.5z"/></svg>`;
const SUIVI = {};
const folHtml = sl => `<button type="button" class="mfol" data-mfol="${esc(sl)}" aria-pressed="${!!SUIVI[sl]}" aria-label="${SUIVI[sl] ? "Ne plus suivre la série" : "Suivre la série"}">${COEUR(SUIVI[sl])}<span>${SUIVI[sl] ? "Suivie" : "Suivre"}</span></button>`;
function folCharger(sl){ if (sl in SUIVI) return; SUIVI[sl] = false;
  fetch("/api/follow?s=" + encodeURIComponent(sl), { credentials: "same-origin" }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.ok) { SUIVI[sl] = !!j.on; const b = document.querySelector(`[data-mfol="${sl}"]`); if (b) b.outerHTML = folHtml(sl); } }).catch(() => {}); }
async function serie(slug){
  const s = BYSLUG[slug] || BYID[slug];
  if (!s) { app().innerHTML = `<p class="empty">Série introuvable. <a href="/ma-collection/">Retour à ma collection</a></p>`; return; }
  document.title = (s.fr || s.t) + " · Ma collection · FuryoGang";
  app().innerHTML = window.FG_SK ? FG_SK.fiche() : "";
  const d = await detail(s.id); DET[s.id + ":v"] = d;
  if (!d || d.error) { app().innerHTML = `<p class="empty">Impossible de charger cette série.</p>`; return; }
  // Édition affichée : celle où le membre a déjà des tomes, sinon la française, sinon la première.
  const r = resume(d, "c");
  ED = (r && r.has ? r.e : d.editions[0]).id; LT = TAB;
  drawSerie(s, d);
}
function drawSerie(s, d){
  const e = d.editions.find(x => x.id === ED) || d.editions[0];
  const cover = (e.tomes.find(t => t.cover) || {}).cover || s.cover;
  const parus = e.tomes.filter(t => t.paru), has = e.tomes.filter(t => L.c[t.id]).length, total = e.nb || e.tomes.length;
  const inL = e.tomes.filter(t => L[LT][t.id]).length;
  const fiche = d.serie.fiche ? `<a class="btn" href="/series/${esc(d.serie.slug)}">Voir la fiche ${I.arr}</a>` : `<span class="btn g" style="opacity:.6;cursor:default">Fiche bientôt en ligne</span>`;
  // En-tête « D3 » (Will, 07/10) : carte arrondie, éditions en lignes drapeau, panneau compteur à droite.
  const reste = parus.filter(t => !L.c[t.id]).length;
  // « Tout ajouter » : Collection, et Envie de lire (Will, 09/10/2026 : on achète parfois toute la série d'un coup).
  const resteP = parus.filter(t => !L.w[t.id]).length;
  const tout = !parus.length || !"cw".includes(LT) ? "" : LT === "w"
    ? (resteP ? `<button class="btn" data-jusqua>${I.stack}Toute la série · ${parus.length} tome${parus.length > 1 ? "s" : ""}</button>` : `<span class="btn g" style="cursor:default">Toute la série est dans Envie de lire</span>`)
    : reste ? `<button class="btn" data-jusqua>${I.stack}Tout ajouter · ${parus.length} tome${parus.length > 1 ? "s" : ""}</button>` : `<span class="btn g" style="cursor:default">Tous les tomes parus sont là</span>`;
  const pane = `<div class="pane"><div class="big"><b>${has}</b><span>/ ${parus.length} tome${parus.length > 1 ? "s" : ""}${parus.length < total ? ` · ${total} prévus` : ""}</span></div><div class="pb"><i style="width:${parus.length ? has / parus.length * 100 : 0}%"></i></div>${tout}${fiche}</div>`;
  const st = x => { const v = (x.statut || "").trim(); return v ? ` · <i class="${/cours/i.test(v) ? "on" : /stop|arr/i.test(v) ? "stop" : "end"}">${esc(v)}</i>` : ""; };
  const eds = `<div class="eds">${d.editions.map(x => { const xp = x.tomes.filter(t => t.paru).length, xh = x.tomes.filter(t => L.c[t.id]).length, xn = x.nb || x.tomes.length;
    return `<button data-ed="${x.id}" aria-pressed="${x.id === e.id}">${FLAG[x.pays] || ""}<span><b>${esc([x.pays, x.pub, x.label].filter(Boolean).join(" · "))}</b><em>${xn} tome${xn > 1 ? "s" : ""}${st(x)}</em></span><span class="n">${xh}/${xp}</span></button>`; }).join("")}</div>`;
  const aut = d.serie.auteurs ? `<dl class="scr"><dt>${/,|&| et /.test(d.serie.auteurs) ? "Auteurs" : "Auteur"} :</dt><dd>${esc(d.serie.auteurs)}</dd></dl>` : "";
  const lseg = `<div class="lseg">${LISTS.map(([k, l]) => `<button data-lt="${k}" aria-pressed="${LT === k}"${ferme(k) ? ' data-lock="1"' : ""}>${l}${ferme(k) ? VERROU : ""}</button>`).join("")}</div>`;
  // Repli (Will, 07/10) : un tome français sans couverture affiche celle du même tome japonais, marquée « Couv. JP ».
  const jpEd = e.pays !== "Japon" ? d.editions.find(x => x.pays === "Japon") : null;
  const jpCov = {}; if (jpEd) jpEd.tomes.forEach(x => { if (x.cover) jpCov[x.n] = x.cover; });
  const img = (t, op) => t.cover ? `<img src="${esc(couv(t.cover, 300))}" alt="" loading="lazy"${op}>`
    : jpCov[t.n] ? `<img src="${esc(couv(jpCov[t.n], 300))}" alt="" loading="lazy"${op}><span class="jpc">Couv. JP</span>` : `<span class="n">${esc(t.n)}</span>`;
  const tome = t => {
    if (!t.paru) return `<div class="t soon"><span class="cv">${img(t, ' style="opacity:.35"')}</span><small>T.${esc(t.n)}<em>À paraître</em></small></div>`;
    const on = !!L[LT][t.id], own = !!L.c[t.id];
    const etat = LT === "c" ? (own ? "Possédé" : "Manquant") : on ? VERBE[LT] : own ? "Possédé" : "";
    return `<button class="t${LT === "c" && !own ? " miss" : ""}" data-t="${t.id}" aria-pressed="${on}" aria-label="Tome ${esc(t.n)} : ${on ? "retirer de" : "ajouter à"} ${esc(LISTS.find(x => x[0] === LT)[1])}"><span class="cv">${img(t, "")}${on ? `<span class="bk-ck ${LT}">${I.ck}</span>` : `<span class="plus">+</span>`}</span><small>T.${esc(t.n)}<em>${etat}</em></small></button>`;
  };
  const leg = LT === "c" ? `<div class="leg"><span><i style="background:var(--ok)"></i>Possédé</span><span><i style="background:#555"></i>Manquant</span><span><i style="border:1.5px dashed #555"></i>À paraître</span><span>Touche un tome pour le cocher</span></div>`
    : `<div class="leg"><span>${inL} tome${inL > 1 ? "s" : ""} dans « ${esc(LISTS.find(x => x[0] === LT)[1])} » · touche un tome pour l'ajouter ou le retirer</span></div>`;
  folCharger(d.serie.slug || s.slug);
  app().innerHTML = `<a class="back" href="/ma-collection/">${I.back}Ma collection</a>
    <div class="sc">${folHtml(d.serie.slug || s.slug)}<span class="scv">${cover ? `<img src="${esc(couv(cover, 400))}" alt="">` : ""}</span>
      <div class="stx"><div><h1>${esc(d.serie.fr || d.serie.t)}</h1>${d.serie.jp ? `<p class="jpt" lang="ja">${esc(d.serie.jp)}</p>` : ""}${aut}</div>${eds}</div>
      ${pane}</div>
    <div class="det-tools">${lseg}${leg}</div>
    <div class="tg">${e.tomes.map(tome).join("")}</div>
`;
}

/* ---------- actions ---------- */
async function envoyer(l, on, tomes, el){
  el && el.classList.add("busy");
  try {
    const r = await fetch("/api/collection", { method: "POST", headers: { "content-type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ l, on, tomes }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 402 || j.error === "premium") { premium(); return false; }
    if (r.status === 401) { gate(); return false; }
    if (!r.ok || !j.ok) throw new Error(j.error || "Erreur");
    L = j.lists; MAX = j.max; VIP = !!j.vip; return true;
  } catch (err) { toast("Impossible d'enregistrer, réessaie."); return false; }
  finally { el && el.classList.remove("busy"); }
}
function premium(){
  const p = document.createElement("div"); p.className = "pay";
  p.innerHTML = `<div><b>Premium</b><p>« Envie de lire » et le Panier sont réservés aux membres Premium. Ta collection, elle, est illimitée.</p><button class="btn">OK</button></div>`;
  document.body.appendChild(p); p.onclick = e => { if (e.target === p || e.target.closest(".btn")) p.remove(); };
}
document.addEventListener("click", async e => {
  if (e.target.closest("[data-fsh]")) { feuille(); return; }
  if (e.target.closest("[data-lock]")) { premium(); return; }
  if (e.target.closest("[data-gobase]")) { e.preventDefault(); const bs = document.getElementById("base"); if (bs) bs.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const fo = e.target.closest("[data-mfol]"); if (fo) { const sl = fo.dataset.mfol; SUIVI[sl] = !SUIVI[sl]; fo.outerHTML = folHtml(sl);
    fetch("/api/follow", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ s: sl }) }).then(r => r.json()).then(j => { if (j && j.ok) { SUIVI[sl] = !!j.on; const b = document.querySelector(`[data-mfol="${sl}"]`); if (b) b.outerHTML = folHtml(sl); toast(j.on ? "Série suivie ♥" : "Tu ne suis plus la série"); } }).catch(() => toast("Impossible d'enregistrer, réessaie.")); return; }
  const tb = e.target.closest("[data-tab]"); if (tb) { TAB = tb.dataset.tab; F.statut.clear(); home(); return; }
  const fb = e.target.closest("[data-f]"); if (fb) { const g = F[fb.dataset.f], v = fb.dataset.v; g.has(v) ? g.delete(v) : g.add(v); drawHome(); return; }
  if (e.target.closest("[data-more]")) { SHOWN += 60; drawHome(); return; }
  const lk = e.target.closest("a.c, a.back"); if (lk && lk.getAttribute("href").startsWith("/ma-collection/")) { e.preventDefault();
    // Retour à la liste (Will, 07/10) : on revient à l'endroit où on était, avec autant de séries affichées.
    if (lk.matches("a.back") && history.state && history.state.depuis) { history.back(); return; }
    const surListe = !slugAdr();
    if (surListe) history.replaceState({ y: scrollY, shown: SHOWN }, "");
    history.pushState({ depuis: surListe }, "", lk.getAttribute("href")); route(); window.scrollTo(0, 0); return; }
  const s = BYSLUG[slugAdr()]; const d = s && DET[s.id + ":v"]; if (!d) return;
  const ed = e.target.closest("[data-ed]"); if (ed) { ED = ed.dataset.ed; drawSerie(s, d); return; }
  const lt = e.target.closest("[data-lt]"); if (lt) { LT = lt.dataset.lt; drawSerie(s, d); return; }
  const t = e.target.closest("[data-t]");
  if (t) { const on = !L[LT][t.dataset.t]; if (await envoyer(LT, on, [{ t: t.dataset.t, s: s.id, p: ((d.editions.find(x => x.tomes.some(y => y.id === t.dataset.t)) || {}).pays === "France" ? "F" : "J") }], t)) { drawSerie(s, d); if (on && LT === "c" && MAX && Object.keys(L.c).length === MAX) toast(`${MAX}/${MAX} : ta collection gratuite est pleine`); } return; }
  const j = e.target.closest("[data-jusqua]");
  if (j) { const li = LT === "w" ? "w" : "c", ee = d.editions.find(x => x.id === ED) || d.editions[0]; const tomes = ee.tomes.filter(x => x.paru && !L[li][x.id]).map(x => ({ t: x.id, s: s.id, p: ee.pays === "France" ? "F" : "J" }));
    if (!tomes.length) { toast(li === "w" ? "Toute la série est déjà dans Envie de lire ✓" : "Tu as déjà tous les tomes parus ✓"); return; }
    if (await envoyer(li, true, tomes, j)) { drawSerie(s, d); toast(`${tomes.length} tome${tomes.length > 1 ? "s" : ""} ${li === "w" ? "dans Envie de lire" : "ajouté" + (tomes.length > 1 ? "s" : "")} ✓`); } }
});
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
addEventListener("popstate", async e => { const st = e.state || {}; if (!slugAdr() && st.shown) SHOWN = Math.max(SHOWN, st.shown); await route(); window.scrollTo(0, !slugAdr() && st.y ? st.y : 0); });

/* ---------- accès ---------- */
// Visiteur non connecté (Will, 07/10) : il voit la page et peut défiler, mais tout clic ouvre cette fenêtre.
let GUEST = false;
function gate(){
  if (document.querySelector(".pay.gp")) return;
  const pile = CAT.filter(s => s.cover).slice(0, 3);
  const p = document.createElement("div"); p.className = "pay gp";
  p.innerHTML = `<div class="gate"><button class="gx" aria-label="Fermer">×</button><div class="stack">${pile.map(s => `<span><img src="${esc(couv(s.cover, 200))}" alt=""></span>`).join("")}</div><b>Range ta collection</b><p>Note tes tomes et ce qu'il te manque. Gratuit et illimité pour les membres ; envie de lire et panier avec Premium.</p><button class="btn" id="join">Devenir membre</button><button class="btn g" id="join2">J'ai déjà un compte</button></div>`;
  document.body.appendChild(p);
  const go = () => { p.remove(); const b = document.getElementById("sh-me"); if (b) b.click(); };
  p.querySelector("#join").onclick = go; p.querySelector("#join2").onclick = go;
  p.onclick = e => { if (e.target === p || e.target.closest(".gx")) p.remove(); };
}
// Capture : bloque tout clic, saisie ou focus dans la page tant qu'on n'est pas connecté.
["click", "focusin", "keydown"].forEach(ev => document.addEventListener(ev, e => {
  if (!GUEST || !e.target.closest || !e.target.closest("#app")) return;
  // Visiteur (Will, 08/10/2026) : il peut ouvrir une série, changer d'édition, revenir et voir plus, pour regarder ; tout le reste ouvre le message.
  if (ev !== "keydown" && e.target.closest("a.c, a.back, [data-ed], [data-more], [data-gobase]")) return;
  if (ev === "keydown" && !/^(Enter| )$/.test(e.key) && !e.target.matches("input,select,textarea")) return;
  e.preventDefault(); e.stopPropagation();
  if (e.target.blur) e.target.blur();
  gate();
}, true));
async function route(){
  const sl = slugAdr();
  if (sl) await serie(sl); else await home();
}
(async function start(){
  const [cat, col] = await Promise.all([
    fetch("/api/biblio").then(r => r.json()).catch(() => ({})),
    fetch("/api/collection", { credentials: "same-origin" }).then(r => r.status === 401 ? { gate: 1 } : r.json()).catch(() => ({ gate: 1 })),
  ]);
  CAT = cat.items || []; STATS = cat.stats || {}; CAT.forEach(s => { BYID[s.id] = s; BYSLUG[s.slug] = s; });
  if (col.gate || !col.ok) { GUEST = true; route(); return; }
  L = { c: {}, p: {}, k: {}, w: {}, ...col.lists }; MAX = col.max; VIP = !!col.vip; chargerRang();
  // Les détails des séries de la collection, pour les « 7/9 tomes ».
  // Une seule requête pour toutes les séries de la collection (lue dans l'index, sans Notion) : Will, 07/10/2026.
  const ids = [...new Set(Object.values(L).flatMap(x => Object.values(x)))];
  for (let i = 0; i < ids.length; i += 150) {
    const j = await fetch("/api/biblio?ids=" + ids.slice(i, i + 150).join(",")).then(r => r.json()).catch(() => ({}));
    for (const [id, d] of Object.entries(j.details || {})) if (!DET[id + ":v"]) DET[id + ":v"] = d;
  }
  route();
})();
</script>
