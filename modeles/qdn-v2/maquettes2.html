<!doctype html>

<!-- Will, 25/11/2026, 2e tour : titre sur une ligne, plus de fonds noirs nus (mosaïque manga), grandes images de tomes
     pour les news (pas les visuels déjà vus), 4 pistes de mise en page des news, sorties ensemble (par jour) ou séparées
     Japon / France sur une semaine chargée (19–25 octobre), « Ça arrive » moins rouge avec du japonais. -->
<style>
@font-face{font-family:A;src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:I;src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:J;src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#2a2a2e}
.w{display:inline-block;vertical-align:top;margin:20px}.w>b{display:block;font:800 26px I;color:#fff;margin-bottom:10px}
.s{position:relative;overflow:hidden;width:1080px;height:1440px;background:#0c0c0e;color:#F2EFE9;font-family:I}
.logo{position:absolute;top:40px;left:50%;transform:translateX(-50%);height:64px;z-index:20}
.t{font:700 120px/.95 A;text-transform:uppercase}
.k{font:700 28px/1 A;letter-spacing:.28em;text-transform:uppercase;color:#F2C14E}
.pill{display:inline-flex;align-items:center;height:46px;padding:0 16px;border-radius:9px;font:700 27px/1 A;text-transform:uppercase;letter-spacing:.04em;color:#121214}
.cv{flex:none;background:#111 center/cover;border:7px solid #121214;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.mz{position:absolute;inset:0;overflow:hidden}
.mz .g{position:absolute;left:-260px;top:-300px;width:1600px;display:grid;grid-template-columns:repeat(7,1fr);gap:18px;transform:rotate(-8deg)}
.mz .g i{display:block;aspect-ratio:7/10;background:center/cover;filter:grayscale(1) contrast(1.2)}
.mz.r{background:#CB002F}.mz.r .g{opacity:.32;mix-blend-mode:multiply}
.mz.r::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 45%,rgba(150,0,30,.5),transparent 75%),linear-gradient(180deg,transparent 55%,rgba(110,0,22,.75))}
.mz.n{background:#0c0c0e}.mz.n .g{opacity:.2}
.mz.n::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 45%,rgba(12,12,14,.35),rgba(12,12,14,.85) 80%),linear-gradient(180deg,rgba(12,12,14,.6),transparent 25%,transparent 70%,rgba(12,12,14,.9))}
.lab{display:flex;justify-content:center;align-items:center;gap:22px;font:700 32px A;letter-spacing:.3em;text-transform:uppercase}
.lab i{width:90px;height:2px;background:#fff}.lab b{font:900 30px J;color:#F2C14E;letter-spacing:.1em}
.h4{font:700 64px/1 A;text-transform:uppercase;margin:16px 0 0}
.p{font:500 27px/1.35 I;color:#d8d4cc;margin:14px 0 0}
.jp{font:900 30px J;color:#E5483A;margin-top:8px}
.vt{position:absolute;writing-mode:vertical-rl;font:900 96px/1 J;letter-spacing:.04em}
.dt{display:inline-block;font:700 22px/1 A;padding:7px 10px;border-radius:6px;text-transform:uppercase}
.fl{display:block;height:34px;line-height:34px;text-align:center;font:700 20px/34px A;letter-spacing:.12em;text-transform:uppercase}
.fl.j{background:#BC002D;color:#fff}.fl.f{background:#1f4fd1;color:#fff}
.cell b{display:block;font:700 26px/1.05 A;text-transform:uppercase;margin-top:12px}.cell span{display:block;font:600 17px I;color:#bdb9b1;margin-top:5px}
</style>

<body>
<div id="out"></div>
<script>

  ["2026-10-20", "j", "Dustland", "T.02", "/couvertures/9784253020312-hd.jpg"],
  ["2026-10-20", "j", "WORST Gaiden Guriko", "T.40", "https://furyo.pages.dev/couvertures/9784253020398-hd.jpg"],
  ["2026-10-20", "j", "WORST Gaiden Dokuro", "T.23", "https://furyogang.com/couvertures/9784253020404-hd.jpg"],

document.getElementById("out").innerHTML = S.map(function (x, i) { return '<div class="w"><b>' + x[0] + '</b><div id="s' + i + '">' + x[1] + "</div></div>"; }).join("");
