<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Modèle · Nouvel arc · FuryoGang</title>
<!-- Modèle « Nouvel arc » (Will, 24/11/2026) : piste « Pleine page » retenue parmi les 6 maquettes (maquettes.html).
     Premier usage : Hangure, chapitre 146, Young Champion n°24.
     Visuel réseaux 1080 × 1440 (#r) et image de lien 1200 × 630 (#l). Tout passe par l'adresse :
       visuel : page couleur officielle (plein cadre, cadrée en haut pour garder le visage)
       pos    : cadrage vertical du visuel en % (0 = haut, défaut 6)
       titre  : nom court de la série (Antonio, capitales)
       sous   : sous-titre en romaji, en rouge (jamais le titre japonais)
       chap   : numéro de chapitre · mag : magazine et numéro (ex. Young Champion n°24)
       extra  : mot en jaune entre les deux (défaut « Page couleur », vide = rien)
       kanji  : cartouche vertical (défaut 新章開幕)
     Rendu : node render.js (Playwright) → reseaux.jpg et lien.jpg. -->
<style>
@font-face{font-family:A;src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:I;src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:J;src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#333}
.c{position:relative;overflow:hidden;background:#0c0c0e;color:#f3f3f5;margin:20px;font-family:I}
.pill{display:inline-block;background:#4DAB9A;color:#fff;font:800 34px/1 I;padding:14px 26px;border-radius:14px;text-transform:uppercase}
.t{font:700 132px/1 A;text-transform:uppercase;letter-spacing:.005em}
.st{font:700 50px/1.05 A;text-transform:uppercase;color:#E5483A}
.meta{font:700 40px/1 A;text-transform:uppercase;color:#f3f3f5;white-space:nowrap}
.meta b{color:#F2C14E;font-weight:700}
.vt{position:absolute;writing-mode:vertical-rl;font:900 110px/1 J;color:#fff;background:#E5483A;padding:24px 14px;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.logo{position:absolute;z-index:5}
/* Visuel réseaux */
#r{width:1080px;height:1440px}
#r .full{position:absolute;left:0;right:0;top:0;height:1060px;background:center/cover}
#r .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,14,.55) 0,transparent 14%,transparent 52%,rgba(12,12,14,.9) 70%,#0c0c0e 76%)}
#r .logo{top:34px;left:50%;transform:translateX(-50%);height:66px}
#r .vt{left:40px;top:150px}
#r .mid{position:absolute;left:0;right:0;top:1000px;text-align:center}
/* Image de lien */
#l{width:1200px;height:630px}
#l .bg{position:absolute;inset:-20px;background:center/cover;filter:grayscale(1) blur(2px);opacity:.3}
#l .full{position:absolute;right:0;top:0;bottom:0;width:560px;background:center/cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
#l .logo{top:30px;left:64px;height:46px}
#l .txt{position:absolute;left:64px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;max-width:700px;padding-top:30px}
#l .pill{font-size:26px;align-self:flex-start}
#l .t{font-size:104px;margin-top:18px}
#l .st{font-size:40px;margin-top:6px}
#l .meta{font-size:31px;margin-top:22px}
#l .vt{right:28px;top:30px;font-size:62px;padding:16px 10px}
</style>
</head>
<body>
<div class="c" id="r"><div class="full" id="rf"></div><div class="sh"></div><img class="logo" src="/img/social/logo-blanc.png" alt=""><div class="vt" id="rk"></div>
 <div class="mid"><span class="pill">Nouvel arc</span><div class="t" id="rt" style="margin-top:20px"></div><div class="st" id="rs" style="margin-top:6px"></div><div class="meta" id="rm" style="margin-top:26px"></div></div></div>
<div class="c" id="l"><div class="bg" id="lb"></div><div class="full" id="lf"></div><img class="logo" src="/img/social/logo-blanc.png" alt=""><div class="vt" id="lk"></div>
 <div class="txt"><span class="pill">Nouvel arc</span><div class="t" id="lt"></div><div class="st" id="ls"></div><div class="meta" id="lm"></div></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), g = function (k, d) { return q.has(k) ? q.get(k) : (d || ""); };
  var e = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); };
  var tiret = function (s) { return e(s).replace(/-/g, '<span style="font-family:I;font-weight:800">-</span>'); };
  var v = g("visuel"), pos = g("pos", "6"), extra = g("extra", "Page couleur"), k = g("kanji", "新章開幕");
  var meta = [g("chap") ? "Chapitre " + e(g("chap")) : "", extra ? "<b>" + e(extra) + "</b>" : "", e(g("mag"))].filter(Boolean).join(" · ");
  ["rf", "lf", "lb"].forEach(function (id) { var d = document.getElementById(id); d.style.backgroundImage = "url('" + v + "')"; d.style.backgroundPosition = "center " + pos + "%"; });
  document.getElementById("rt").innerHTML = document.getElementById("lt").innerHTML = tiret(g("titre"));
  document.getElementById("rs").innerHTML = document.getElementById("ls").innerHTML = tiret(g("sous"));
  document.getElementById("rm").innerHTML = document.getElementById("lm").innerHTML = meta;
  document.getElementById("rk").textContent = document.getElementById("lk").textContent = k;
  // Textes longs : on réduit pour tenir sur une ligne.
  [["rt", 1000], ["rs", 1000], ["rm", 1000], ["lt", 620], ["ls", 620], ["lm", 620]].forEach(function (a) { var el = document.getElementById(a[0]), fs = parseFloat(getComputedStyle(el).fontSize); el.style.whiteSpace = "nowrap"; el.style.display = "inline-block"; el.style.alignSelf = "flex-start"; while (el.offsetWidth > a[1] && fs > 20) { fs -= 2; el.style.fontSize = fs + "px"; } el.style.display = "block"; el.style.alignSelf = ""; });
  var im = new Image(); im.onload = function () { document.body.dataset.ok = 1; }; im.src = v;
})();
</script>
</body>
</html>
