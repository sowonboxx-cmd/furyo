<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Modèle · Nouvelle série au Japon · FuryoGang</title>
<!-- Modèle « Nouvelle série au Japon » (Will) : visuel réseaux 5b (1080 × 1440) et image de lien N6 (1200 × 630).
     Premier usage : Shisei-dō (28/10/2026). Repris pour Bōryoku Banzai le 24/11/2026.
     Tout passe par l'adresse : ?titre=&jp=&auteurs=&sous=&visuel=&fond=&fondLien=&kanji=新連載
       titre     : nom de la série (Antonio, en capitales)
       jp        : titre japonais (rouge)
       auteurs   : auteurs en japonais, sous le titre japonais (visuel réseaux)
       sous      : sous-titre jaune de l'image de lien (ex. ~SANKYŌDAI NO KIZUNA~ ou les auteurs)
       visuel    : image officielle encadrée (page d'ouverture, planche couleur, couverture)
       fond      : image de fond du visuel réseaux (passée en noir et blanc, faible opacité)
       fondLien  : image de fond de l'image de lien (une planche en noir et blanc), sinon « fond »
     Rendu : node render.js (Playwright) → reseaux.jpg et lien.jpg dans le dossier courant. -->
<style>
@font-face{font-family:A;src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:I;src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:J;src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#333}
.c{position:relative;overflow:hidden;background:#0c0c0e;color:#f3f3f5;margin:20px}
.bg{position:absolute;inset:-10px;background:center/cover;filter:grayscale(1);opacity:.32}
.sh{position:absolute;inset:0}
/* Visuel réseaux 5b */
#r{width:1080px;height:1440px}
#r .sh{background:linear-gradient(180deg,rgba(12,12,14,.25) 0%,rgba(12,12,14,.15) 45%,rgba(12,12,14,.85) 78%,#0c0c0e 100%)}
#r .logo{position:absolute;top:34px;left:50%;transform:translateX(-50%);height:66px}
#r .kanji{position:absolute;top:80px;left:0;right:0;text-align:center;font:900 340px/1 J;color:#FF7369;opacity:.92;letter-spacing:.02em}
#r .vis{position:absolute;left:50%;transform:translateX(-50%);border:6px solid #fff;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.7);background:#111;display:block;object-fit:cover}
#r .bas{position:absolute;left:0;right:0;bottom:56px;text-align:center}
.pill{display:inline-block;background:#FF7369;color:#fff;font:800 34px/1 I;padding:14px 26px;border-radius:14px;letter-spacing:.01em;text-transform:uppercase}
#r .t{font:700 150px/1 A;text-transform:uppercase;margin-top:22px;letter-spacing:.005em}
#r .jp{font:900 54px/1.15 J;color:#E5483A;margin-top:14px}
#r .au{font:900 40px/1.15 J;color:#E5483A;opacity:.85;margin-top:6px}
/* Image de lien N6 */
#l{width:1200px;height:630px}
#l .bg{opacity:.5}
#l .sh{background:linear-gradient(90deg,rgba(12,12,14,.92) 0%,rgba(12,12,14,.7) 45%,rgba(12,12,14,.1) 75%)}
#l .txt{position:absolute;left:64px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;max-width:640px}
#l .pill{font-size:28px;align-self:flex-start}
#l .t{font:700 112px/1 A;text-transform:uppercase;margin-top:20px}
#l .s{font:700 46px/1.1 A;color:#F2C14E;text-transform:uppercase;margin-top:10px}
#l .vis{position:absolute;right:70px;top:50%;transform:translateY(-50%) rotate(3deg);border:6px solid #fff;border-radius:6px;box-shadow:0 26px 60px rgba(0,0,0,.75);object-fit:cover;background:#111}
</style>
</head>
<body>
<div class="c" id="r"><div class="bg" id="rbg"></div><div class="sh"></div><div class="kanji" id="kanji">新連載</div><img class="logo" src="/img/social/logo-blanc.png" alt=""><img class="vis" id="rvis" alt=""><div class="bas"><span class="pill">Nouvelle série au Japon</span><div class="t" id="rt"></div><div class="jp" id="rjp"></div><div class="au" id="rau"></div></div></div>
<div class="c" id="l"><div class="bg" id="lbg"></div><div class="sh"></div><div class="txt"><span class="pill">Nouvelle série au Japon</span><div class="t" id="lt"></div><div class="s" id="ls"></div></div><img class="vis" id="lvis" alt=""></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), g = function (k) { return q.get(k) || ""; };
  var tiret = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }).replace(/-/g, '<span style="font-family:I;font-weight:800">-</span>'); };
  document.getElementById("rt").innerHTML = document.getElementById("lt").innerHTML = tiret(g("titre"));
  document.getElementById("rjp").textContent = g("jp");
  document.getElementById("rau").textContent = g("auteurs");
  document.getElementById("ls").innerHTML = tiret(g("sous"));
  if (g("kanji")) document.getElementById("kanji").textContent = g("kanji");
  document.getElementById("rbg").style.backgroundImage = "url('" + g("fond") + "')";
  document.getElementById("lbg").style.backgroundImage = "url('" + (g("fondLien") || g("fond")) + "')";
  // Titre long : on réduit pour tenir sur une ligne.
  [["rt", 1000, 150], ["lt", 560, 112]].forEach(function (a) { var e = document.getElementById(a[0]), fs = a[2]; e.style.whiteSpace = "nowrap"; e.style.display = "inline-block"; while (e.offsetWidth > a[1] && fs > 60) { fs -= 4; e.style.fontSize = fs + "px"; } e.style.display = "block"; });
  // Visuel encadré : on garde ses proportions (portrait ou paysage) dans la place disponible.
  function poser(id, maxW, maxH, top) {
    var im = document.getElementById(id); im.onload = function () {
      var k = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight); im.style.width = Math.round(im.naturalWidth * k) + "px"; im.style.height = Math.round(im.naturalHeight * k) + "px";
      if (top !== null) im.style.top = top + "px";
      // Visuel en paysage : le bloc titre remonte juste sous l'image (pas de grand vide).
      if (id === "rvis" && im.naturalWidth > im.naturalHeight) { var bas = document.querySelector("#r .bas"); bas.style.bottom = "auto"; bas.style.top = (top + parseInt(im.style.height, 10) + 90) + "px"; }
      document.body.dataset.ok = (+document.body.dataset.ok || 0) + 1;
    }; im.src = g("visuel");
  }
  poser("rvis", 960, 760, 300); poser("lvis", 450, 470, null);
})();
</script>
</body>
</html>
