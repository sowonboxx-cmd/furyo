<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#232325;color:#F5F5F7;font:500 15px Inter;padding:30px}
.v{background:#000;border-radius:22px;padding:18px 22px;margin-bottom:18px;display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center}
.v>b{font:700 34px Antonio;text-transform:uppercase}
.xt{background:#1C1C1E;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:9px}
.xt small{font:700 11.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:#98989D}.xt .t{font:700 28px/1 Antonio;text-transform:uppercase}
.xt p{margin:0;color:#CFCFD4;font-size:14px}
.xa{display:flex;gap:8px;margin-top:4px}
.xa a{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 16px;border-radius:12px;font:700 14px Inter;text-decoration:none}
.flag{width:20px;height:14px;border-radius:3px;display:block;overflow:hidden;flex:none}
svg.ar{width:13px;height:13px}
.a a{background:#F5F5F7;color:#000}
.b a{background:#2D2D32;color:#fff}
.c a{background:#000;color:#fff;box-shadow:inset 0 0 0 1.5px #3A3A40}
.d a{background:#3A3A40;color:#fff}.d .flag{box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}
.e a{background:#F5F5F7;color:#000}.e .flag{box-shadow:0 0 0 1.5px #000}
</style></head><body>
<script>
const FR='<svg class="flag" viewBox="0 0 22 15"><rect width="7.34" height="15" fill="#2F5DA8"/><rect x="7.33" width="7.34" height="15" fill="#F5F5F7"/><rect x="14.66" width="7.34" height="15" fill="#E5483A"/></svg>';
const JP='<svg class="flag" viewBox="0 0 22 15"><rect width="22" height="15" fill="#F5F5F7"/><circle cx="11" cy="7.5" r="4.2" fill="#E5483A"/></svg>';
const AR='<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const V=[["a","Actuel","Fond blanc : le drapeau japonais disparaît"],["b","1 · Gris","Fond gris foncé, texte blanc"],["c","2 · Noir","Fond noir, fin contour gris"],["d","3 · Gris + cadre","Gris moyen, drapeaux cerclés"],["e","4 · Blanc + cadre","Fond blanc, drapeaux cerclés de noir"]];
document.body.innerHTML=V.map(([k,t,d])=>`<div class="v ${k}"><b>${t}</b><div class="xt"><small>Lire le début · ${d}</small><span class="t">Les premières pages</span><p><strong>CROWS</strong>, chapitre 1. Cliquez sur une page pour zoomer.</p><div class="xa"><a href="#">${FR}Lire l'extrait${AR}</a><a href="#">${JP}Lire l'extrait${AR}</a></div></div></div>`).join("");
</script></body></html>
