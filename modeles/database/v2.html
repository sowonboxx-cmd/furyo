<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manga Database · maquettes v2</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Maquettes v2 (Will, 26/11/2026) : DA du site (cartes noires sur fond #232326, Antonio + Inter), aucune intégration. */
:root{--bg:#232326;--paper:#F4F1EA;--mute:#9a9aa2;--red:#BC002D;--blue:#3E7BE0;--gold:#F2C14E;--green:#5FCB7A;--tile:#1b1b1f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:500 15px/1.45 Inter,sans-serif}
.nav{height:68px;background:#18181b;border-bottom:1px solid #2a2a2f;display:flex;align-items:center;gap:34px;padding:0 148px}
.nav img{height:38px}.nav span{font:700 19px Antonio;letter-spacing:.03em;text-transform:uppercase;color:#e9e6df}.nav span.on{color:#fff;box-shadow:inset 0 -3px 0 var(--red);padding-bottom:6px}
.wrap{max-width:1200px;margin:0 auto;padding:40px 0 70px}
.box{background:#000;border-radius:22px;padding:24px}
.lab{font:700 11.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
h2.s{font:700 34px Antonio;text-transform:uppercase;margin:0 0 16px;display:flex;align-items:baseline;gap:12px}h2.s small{font:500 13px Inter;text-transform:none;color:var(--mute)}
.D{font-family:Antonio;text-transform:uppercase}
.bar{height:10px;border-radius:6px;background:#333338;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;background:#000;font:600 14px Inter;color:#e9e6df;white-space:nowrap}.chip.on{background:var(--paper);color:#111}
svg.ic{width:16px;height:16px;flex:none}
.search{flex:1;background:#000;border-radius:14px;padding:14px 16px;color:var(--mute);display:flex;gap:10px;align-items:center}
.tools{display:flex;gap:10px;align-items:center;margin:26px 0 22px}
/* Cartes séries */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 18px}
.cv{position:relative;aspect-ratio:7/10;border-radius:8px;overflow:hidden;background:#111}.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .nv{position:absolute;right:8px;top:8px;background:var(--blue);color:#fff;font:800 11px Inter;letter-spacing:.04em;padding:4px 8px;border-radius:6px;text-transform:uppercase}
.card{min-width:0}.card b{display:block;margin-top:9px;font:700 20px/1.05 Antonio;text-transform:uppercase}
.card .g{display:block;margin-top:4px;font:600 12.5px Inter;color:#cfcfd4;white-space:nowrap;overflow:hidden}
.card .m{display:flex;gap:6px;align-items:center;margin-top:5px;font:600 12px Inter;color:var(--mute);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px}.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.st.ec{color:var(--green)}.st.fi{color:#cfcfd4}
.flag{display:inline-block;width:18px;height:12px;border-radius:2px;flex:none;vertical-align:-1px}
.flag.fr{background:linear-gradient(90deg,#1f4bd8 33%,#fff 33% 66%,#e4202f 66%)}.flag.jp{background:radial-gradient(circle at 50% 50%,#bc002d 3.3px,#fff 3.6px)}
/* D : page base */
.dA{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.big{font:700 86px/.9 Antonio}.big small{font:500 18px Inter;color:#cfcfd4;margin-left:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.kp div{background:var(--tile);border-radius:14px;padding:13px 15px}.kp b{display:block;font:700 32px Antonio}.kp span{font-size:12.5px;color:var(--mute)}
.kp .k1 b{color:var(--blue)}.kp .k2 b{color:var(--gold)}.kp .k3 b{color:#ff5a7a}
.der{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.der .cv{border-radius:10px}
.der>a{min-width:0}.der b{display:block;margin-top:8px;font:700 18px/1.05 Antonio;text-transform:uppercase}.der small{display:block;color:var(--mute);font-size:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.hcard{min-width:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;background:#000;border-radius:18px;padding:14px;position:relative;overflow:hidden}
.hcard .cv{border-radius:8px}.hcard b{display:block;font:700 28px/1 Antonio;text-transform:uppercase;margin-top:4px}
.hcard .g{display:block;margin-top:8px;font:600 13px Inter;color:#cfcfd4}.hcard .m{margin-top:8px;display:flex;gap:8px;font:600 12.5px Inter;color:var(--mute)}
.hcard .date{position:absolute;right:14px;top:14px;font:700 11px Inter;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.band{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:26px;align-items:center;background:#000;border-radius:22px;padding:22px 26px}
.band .n{font:700 64px/.9 Antonio}.band .n small{font:500 15px Inter;color:#cfcfd4;margin-left:8px}
.band .kpi{text-align:center;padding:0 10px;border-left:1px solid #2a2a2f}.band .kpi b{display:block;font:700 34px Antonio}.band .kpi span{font-size:12px;color:var(--mute)}
/* F : fiche */
.hero{display:grid;grid-template-columns:260px 1fr;gap:36px;background:#000;border-radius:22px;padding:32px;position:relative}
.hero .cv{border-radius:12px}
.hero h1{font:700 76px/.9 Antonio;text-transform:uppercase;margin:0}.hero .jp{font:700 19px "Noto Sans JP";color:#e9e6df;margin-top:4px}
.aut{margin:14px 0 0;font-size:17px;color:var(--mute)}.aut b{color:#fff;font-weight:700;margin-left:6px}
.hero p.r{font-size:17px;line-height:1.6;color:#e7e5df;margin:16px 0 18px;max-width:760px;text-align:justify}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb{background:#2a6fe0;color:#fff;border-radius:7px;font:700 14px Inter;padding:5px 12px}.pg{background:#2d2d32;color:#e9e6df;border-radius:7px;font:600 14px Inter;padding:5px 12px}
.cxw{height:30px;display:inline-flex;align-items:center;background:#D4002F;color:#fff;border-radius:7px;padding:0 10px 0 0;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 6px 18px rgba(212,0,47,.35)}
.cxw i{font-style:normal;display:inline-flex;align-items:center}.cxw .k{height:30px;padding:0 9px;margin-right:9px;background:rgba(0,0,0,.28);font:700 10px Inter;letter-spacing:.08em;text-transform:uppercase;color:#ffd5de}.cxw .t{font:700 17px/1 Antonio;text-transform:uppercase}.cxw .x{font:800 12px Inter;padding:0 .25em}
.actions{position:absolute;right:26px;top:26px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.suivre{display:inline-flex;gap:6px;align-items:center;font:700 14px Inter;color:#fff}.coll{display:inline-flex;gap:6px;align-items:center;background:#1a7cf5;color:#fff;font:700 14px Inter;padding:8px 14px;border-radius:999px}
.fno{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:#77777e;border:1px solid #2e2e33;border-radius:999px;padding:5px 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats>div{background:var(--tile);border-radius:14px;padding:13px 16px}
.stats b{display:flex;align-items:center;gap:9px;font:700 34px/1 Antonio;text-transform:uppercase}.stats span{display:block;margin-top:6px;font:600 13px Inter;color:var(--mute)}.stats .ec{color:var(--green)}
.sbig{display:flex;gap:34px;margin-top:16px}.sbig div b{display:flex;align-items:center;gap:10px;font:700 46px/1 Antonio;text-transform:uppercase}.sbig div span{display:block;margin-top:6px;font:600 14px Inter;color:var(--mute)}.sbig .ec{color:var(--green)}
.tabs{display:flex;gap:6px;background:#000;border-radius:18px;padding:7px;margin-top:24px}.tabs a{flex:1;text-align:center;padding:11px;border-radius:13px;font:700 24px Antonio;text-transform:uppercase;color:#8d8d95}.tabs a sup{font:600 12px Inter;margin-left:6px;vertical-align:2px}.tabs a.on{background:#38383d;color:#fff}
.infos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#000;border-radius:22px;padding:18px;margin-top:12px}.infos div{background:var(--tile);border-radius:14px;padding:16px 18px}.infos b{display:block;margin-top:6px;font:600 16px Inter;color:#fff}
.sec{margin-top:30px}
.ext .pages{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.ext .pages img{width:100%;aspect-ratio:1810/2576;object-fit:cover;border-radius:8px;background:#fff;display:block;cursor:zoom-in}
.ext .bas{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.lien{display:inline-flex;gap:8px;align-items:center;background:var(--paper);color:#111;font:700 14px Inter;padding:10px 16px;border-radius:12px}
.seg{display:inline-flex;background:var(--tile);border-radius:12px;padding:4px}.seg span{padding:7px 12px;border-radius:9px;font:600 13px Inter;color:#9a9aa2;display:inline-flex;gap:7px;align-items:center}.seg span.on{background:#38383d;color:#fff}
.ext2{display:grid;grid-template-columns:1.1fr 2fr;gap:14px}.ext2 .un{width:100%;aspect-ratio:1810/2576;object-fit:cover;border-radius:10px;background:#fff}.ext2 .q{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ext2 .q img{width:100%;aspect-ratio:1810/2576;object-fit:cover;border-radius:8px;background:#fff}
.tomes{background:#000;border-radius:22px;padding:24px 28px}.tomes .hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}.tomes .hd h2{margin:0;font:700 38px Antonio;text-transform:uppercase;flex:1}
.tomes .ed{display:flex;gap:12px;align-items:center;margin-bottom:16px;font:600 15px Inter;color:#cfcfd4}.tomes .ed b{color:#fff}.tomes .ed .k{background:#2d2d32;color:#fff;font:700 17px Antonio;text-transform:uppercase;padding:5px 12px;border-radius:7px}
.tg{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}.tg b{display:block;margin-top:8px;font:700 19px Antonio;text-transform:uppercase}.tg small{color:#cfcfd4;font-size:14px}
.ad{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.ad .af{aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:#111;position:relative}.ad .af img{width:100%;height:100%;object-fit:cover}
.ad .y{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.85);font:700 13px Inter;padding:4px 9px;border-radius:7px}.ad .ty{position:absolute;left:10px;top:10px;background:var(--red);font:800 11px Inter;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}.ad .ty.tv{background:#2a6fe0}
.ad b{display:block;margin-top:10px;font:700 21px/1.05 Antonio;text-transform:uppercase}.ad small{display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--mute);font:600 13px Inter}
.uni{display:flex;align-items:center;gap:22px;background:linear-gradient(100deg,#D4002F 0%,#8a001f 45%,#000 85%);border-radius:22px;padding:26px 30px}
.uni .k{font:700 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:#ffd5de;background:rgba(0,0,0,.25);padding:6px 10px;border-radius:6px}.uni b{font:700 48px/1 Antonio;text-transform:uppercase}.uni span{color:#ffe3e9;font-size:14.5px}
.go{margin-left:auto;display:inline-flex;gap:8px;align-items:center;background:#fff;color:#111;font:700 14px Inter;padding:11px 16px;border-radius:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:50}.lb img{height:86vh;border-radius:6px}
.lb .ar{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}.lb .ar.g{left:40px}.lb .ar.d{right:40px}
.lb .c{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font:700 14px Inter;background:rgba(30,30,34,.9);padding:7px 14px;border-radius:20px}.lb .x{position:absolute;right:30px;top:24px;color:#fff;font:400 34px Inter}
.lb .cr{position:absolute;left:40px;bottom:22px;color:#9a9aa2;font:600 13px Inter}
</style></head><body>
<div class="nav"><img src="/img/social/logo-blanc.png" alt=""><span>Actualités</span><span class="on">Séries</span><span>À l'écran</span><span>Calendrier</span><span>Au Japon</span><span>Ma collection</span></div>
<div class="wrap" id="app">Chargement…</div>
<script>
const V = new URLSearchParams(location.search).get("v") || "d1";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const couv = (u, w = 360) => u ? "/api/couv?w=" + w + "&u=" + encodeURIComponent(u) : "";
const IC = {
  search: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  fl: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  ext: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  dn: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>',
  heart: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  lib: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 4v16M9 4v16M13 5l4 15"/></svg>',
  sort: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 4v16m0 0-3-3m3 3 3-3M16 20V4m0 0-3 3m3-3 3 3"/></svg>',
  zoom: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>',
  g: '<svg style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 5-7 7 7 7"/></svg>',
  d: '<svg style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 5 7 7-7 7"/></svg>',
  play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
};
const FL = p => `<i class="flag ${p}"></i>`;
const typ = t => String(t || "").replace(/^Shonen$/, "Shōnen").replace(/^Shojo$/, "Shōjo");
const nom = s => s.fr || s.t;
const statut = s => /termin/i.test(s.stJP) ? '<span class="st fi">Terminé</span>' : '<span class="st ec">En cours</span>';
const carte = (s, o = {}) => `<a class="card"><div class="cv"><img src="${couv(s.cover)}" alt="" loading="lazy">${o.nv ? '<span class="nv">Nouveau</span>' : ""}</div><b>${esc(nom(s))}</b><span class="g">${esc((s.genres || []).slice(0, 3).join(" · "))}</span><span class="m">${esc(typ(s.type))}${s.y1 ? " · " + s.y1 : ""} · ${statut(s)}</span></a>`;
Promise.all([fetch("/api/series").then(r => r.json()), fetch("/api/avancement").then(r => r.json()), fetch("/api/serie?s=crows").then(r => r.json())]).then(([S, A, C]) => {
  const items = S.items.slice().sort((a, b) => nom(a).localeCompare(nom(b), "fr")), by = {}; items.forEach(s => by[s.slug] = s);
  const rec = (A.recentes || []).slice(0, 3).map(x => Object.assign({ date: x.date }, by[x.slug] || {})).filter(x => x.slug);
  const dateC = d => d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "";
  const app = document.getElementById("app");
  const tools = `<div class="tools"><div class="search">${IC.search} Chercher une série, un auteur</div><span class="chip">France</span><span class="chip">Japon</span><span class="chip">En cours</span><span class="chip">Terminé</span><span class="chip">A à Z ${IC.dn}</span><span class="chip">Type ${IC.dn}</span><span class="chip">Année ${IC.dn}</span></div>`;
  const grille = `<h2 class="s">Toute la base <small>${A.enLigne} fiches · A à Z</small></h2><div class="grid">${items.slice(0, 18).map(s => carte(s)).join("")}</div>`;
  if (V === "d1") {
    app.innerHTML = `<div class="dA"><div class="box"><div class="lab">Manga Database · fiches en ligne</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin:10px 0 14px"><div class="big">${A.enLigne}<small>sur ${A.total} séries</small></div><b class="D" style="font-size:42px;color:var(--blue)">${String(A.pct).replace(".", ",")} %</b></div>
      <div class="bar"><i style="width:${A.pct}%"></i></div>
      <div class="kp"><div class="k1"><b>+${A.semaine}</b><span>cette semaine</span></div><div class="k2"><b>${A.reste}</b><span>encore à faire</span></div><div class="k3"><b>${A.total}</b><span>séries suivies</span></div></div></div>
      <div class="box"><div class="lab">Dernières fiches</div><div class="der">${rec.map(s => `<a><div class="cv"><img src="${couv(s.cover)}"><span class="nv">${dateC(s.date)}</span></div><b>${esc(nom(s))}</b><small>${esc(typ(s.type))} · ${s.y1 || ""}</small></a>`).join("")}</div></div></div>
      ${tools}${grille}`;
  }
  if (V === "d2") {
    app.innerHTML = `<div class="band"><div><div class="lab">Manga Database</div><div class="n">${A.enLigne}<small>fiches sur ${A.total}</small></div></div>
      <div><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="lab">Avancement</span><b class="D" style="font-size:22px;color:var(--blue)">${String(A.pct).replace(".", ",")} %</b></div><div class="bar" style="height:14px"><i style="width:${A.pct}%;background:linear-gradient(90deg,#3E7BE0,#7aa7ff)"></i></div></div>
      <div class="kpi"><b style="color:var(--blue)">+${A.semaine}</b><span>cette semaine</span></div><div class="kpi"><b style="color:var(--gold)">${A.reste}</b><span>à faire</span></div><div class="kpi"><b style="color:#ff5a7a">${A.total}</b><span>séries</span></div></div>
      <h2 class="s" style="margin-top:34px">Dernières fiches</h2>
      <div class="row3">${rec.map(s => `<a class="hcard"><div class="cv"><img src="${couv(s.cover, 260)}"></div><div><span class="date">${dateC(s.date)}</span><span class="nv" style="background:var(--blue);color:#fff;font:800 10.5px Inter;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px">Nouveau</span><b>${esc(nom(s))}</b><span class="g">${esc((s.genres || []).slice(0, 3).join(" · "))}</span><span class="m">${esc(typ(s.type))} · ${s.y1 || ""} · ${statut(s)}</span></div></a>`).join("")}</div>
      ${tools}${grille}`;
  }
  if (V === "d3") {
    app.innerHTML = `<div class="box" style="display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:center">
      <div><div class="lab">Manga Database</div><div class="big" style="margin-top:10px">${A.enLigne}<small>fiches</small></div><div class="bar" style="margin-top:16px"><i style="width:${A.pct}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px;font:600 13px Inter;color:var(--mute)"><span>${String(A.pct).replace(".", ",")} % de la base</span><span>${A.total} séries</span></div>
        <div class="kp" style="grid-template-columns:1fr 1fr"><div class="k1"><b>+${A.semaine}</b><span>cette semaine</span></div><div class="k2"><b>${A.reste}</b><span>encore à faire</span></div></div></div>
      <div><div class="lab" style="margin-bottom:10px">Dernières fiches</div><div class="der" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0">${rec.map(s => `<a style="display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--tile);border-radius:14px;padding:10px"><div class="cv"><img src="${couv(s.cover, 220)}"></div><div style="min-width:0"><small style="color:var(--blue);font-weight:800;letter-spacing:.05em;text-transform:uppercase">${dateC(s.date)}</small><b style="font-size:21px;white-space:normal">${esc(nom(s))}</b><small style="margin-top:6px;color:#cfcfd4">${esc((s.genres || []).slice(0, 2).join(" · "))}</small><small style="margin-top:4px">${esc(typ(s.type))} · ${s.y1 || ""}</small></div></a>`).join("")}</div></div></div>
      ${tools}${grille}`;
  }
  // ---- Fiche CROWS
  const s = C.serie, eds = C.editions || [], fr = eds.find(e => e.pays === "France"), pages = [1, 2, 3, 4, 5].map(i => "/img/extraits/crows/" + i + ".jpg");
  const ads = [].concat(String(s.film || "").split("\n"), String(s.drama || "").split("\n")).filter(Boolean).map(l => ({ t: l.replace(/\s*[(<].*$/, ""), y: (l.match(/\((\d{4})/) || [])[1], tv: /épisodes/.test(l), ep: (l.match(/(\d+) épisodes/) || [])[1], img: (l.match(/<https:\/\/furyo\.pages\.dev(\/affiches\/[^>]+)>/) || [])[1], ba: /youtube|dailymotion/.test(l) }));
  const sim = items.filter(x => x.slug !== "crows").map(x => ({ x, sc: (x.genres || []).filter(g => (s.genres || []).includes(g)).length + (x.type === s.type ? 1 : 0) })).sort((a, b) => b.sc - a.sc).slice(0, 6).map(o => o.x);
  const actions = (fno) => `<div class="actions"><span class="suivre">${IC.heart} Suivre</span><span class="coll">${IC.lib} Collection</span>${fno === "haut" ? '<span class="fno">Fiche n°001</span>' : ""}</div>`;
  const pills = `<div class="pills"><span class="pb">Shōnen</span><a class="cxw"><i class="k">Univers</i><i class="t">CROWS</i><i class="x">×</i><i class="t">WORST</i><i style="margin-left:8px">${IC.ext}</i></a>${(s.genres || []).map(g => `<span class="pg">${esc(g)}</span>`).join("")}</div>`;
  const stats4 = `<div class="stats"><div><b>${FL("jp")}26 tomes</b><span>Terminé · 1990-1998</span></div><div><b>${FL("fr")}${fr.tomes.length} tomes</b><span class="ec">En cours · Kana depuis 2025</span></div><div><b>${ads.length}</b><span>films et séries TV</span></div><div><b>1990</b><span>Monthly Shōnen Champion</span></div></div>`;
  const sbig = `<div class="sbig"><div><b>${FL("jp")}26 tomes</b><span>Japon · terminé · 1990-1998</span></div><div><b>${FL("fr")}${fr.tomes.length} tomes</b><span class="ec">France · en cours · Kana</span></div><div><b>${ads.length}</b><span>adaptations</span></div></div>`;
  const tabs = (l) => `<div class="tabs">${l.map((t, i) => `<a class="${i ? "" : "on"}">${t}</a>`).join("")}</div>`;
  const infos = `<div class="infos"><div><span class="lab">${FL("fr")} Éditeur France</span><b>Kana · Dark Kana</b></div><div><span class="lab">${FL("jp")} Éditeur Japon</span><b>Akita Shoten</b></div><div><span class="lab">Magazine</span><b>Monthly Shōnen Champion</b></div><div><span class="lab">Prépublication</span><b>1990</b></div></div>`;
  const extrait = (mode) => mode === "grand" ?
    `<div class="sec box ext"><h2 class="s">Extrait <small>Chapitre 1 · cliquez pour lire</small><span style="margin-left:auto" class="seg"><span class="on">${FL("fr")} Kana</span><span>${FL("jp")} Akita Shoten</span></span></h2>
      <div class="ext2"><img class="un" src="${pages[0]}"><div class="q">${pages.slice(1).map(p => `<img src="${p}">`).join("")}</div></div>
      <div class="bas"><a class="lien">Lire la suite chez Kana ${IC.ext}</a><span style="color:var(--mute);font-size:13px">CROWS © Hiroshi Takahashi / Akita Shoten · Édition française Kana</span></div></div>` :
    `<div class="sec box ext"><h2 class="s">Extrait <small>Chapitre 1 · cliquez sur une page pour zoomer</small><span style="margin-left:auto" class="seg"><span class="on">${FL("fr")} Version française</span><span>${FL("jp")} Version japonaise</span></span></h2>
      <div class="pages">${pages.map(p => `<img src="${p}">`).join("")}</div>
      <div class="bas"><a class="lien">Lire la suite chez Kana ${IC.ext}</a><span style="color:var(--mute);font-size:13px">CROWS © Hiroshi Takahashi / Akita Shoten · Édition française Kana</span></div></div>`;
  const tomes = `<div class="sec tomes"><div class="hd"><h2>Tomes</h2><span class="seg"><span class="on">${FL("fr")} France <small style="opacity:.6">9</small></span><span>${FL("jp")} Japon <small style="opacity:.6">67</small></span></span><span class="chip" style="background:#1b1b1f;padding:10px 12px">${IC.sort}</span></div>
      <div class="ed"><span class="k">Shinsōban</span><span><b>Kana</b> · Dark Kana · 9 tomes · 2025</span></div>
      <div class="tg">${fr.tomes.filter(t => t.cover).slice(0, 7).map(t => `<div><div class="cv"><img src="${couv(t.cover, 260)}"></div><b>Tome ${String(t.n).padStart(2, "0")}</b><small>${t.date ? t.date.split("-").reverse().join("/") : ""}</small></div>`).join("")}</div></div>`;
  const adapt = `<div class="sec"><h2 class="s">Adaptations <small>${ads.length} films et séries TV</small></h2><div class="ad">${ads.slice(0, 8).map(a => `<div><div class="af">${a.img ? `<img src="${a.img}">` : ""}<span class="ty ${a.tv ? "tv" : ""}">${a.tv ? "Série TV" : "Film"}</span><span class="y">${a.y || ""}</span></div><b>${esc(a.t)}</b><small>${a.tv ? (a.ep ? a.ep + " épisodes" : "Série TV") : "Film"}${a.ba ? " · " + IC.play + " bande-annonce" : ""}</small></div>`).join("")}</div></div>`;
  const univ = `<div class="sec uni"><span class="k">Univers</span><b>CROWS × WORST</b><span>CROWS, WORST, QP, Crows Gaiden… toute la saga dans l'ordre chronologique</span><a class="go">Voir l'univers ${IC.fl}</a></div>`;
  const simil = `<div class="sec"><h2 class="s">Si vous aimez CROWS</h2><div class="grid">${sim.map(x => carte(x)).join("")}</div></div>`;
  const heroBase = (o) => `<div class="hero">${actions(o.fno)}<div class="cv"><img src="${couv(fr.tomes[0].cover, 600)}"></div><div style="padding-right:150px">
      <h1>${esc(s.t)}</h1><div class="jp">${esc(s.jp)}</div><div class="aut">Auteur :<b>Hiroshi Takahashi</b></div>
      ${o.stats === "big" ? sbig : ""}
      <p class="r">${esc(s.resume)}</p>${pills}${o.stats === "4" ? `<div style="margin-top:18px;margin-right:-150px">${stats4}</div>` : ""}</div>
      ${o.fno === "bas" ? '<span class="fno" style="position:absolute;right:26px;bottom:24px">Fiche n°001</span>' : ""}</div>`;
  if (V === "f1") app.innerHTML = heroBase({ fno: "haut", stats: "4" }) + tabs(["Infos", "Extrait", "Adaptations<sup>" + ads.length + "</sup>", "News<sup>0</sup>"]) + infos + extrait() + tomes + adapt + univ + simil;
  if (V === "f2") app.innerHTML = heroBase({ fno: "bas", stats: "big" }) + tabs(["Infos", "Adaptations<sup>" + ads.length + "</sup>", "News<sup>0</sup>"]) + infos + extrait() + tomes + adapt + univ + simil;
  if (V === "f3") app.innerHTML = heroBase({ fno: "haut", stats: "big" }) + tabs(["Infos", "Extrait", "Tomes", "Adaptations<sup>" + ads.length + "</sup>", "News<sup>0</sup>"]) + infos + extrait("grand") + tomes + adapt + univ + simil;
  if (V === "f4") { app.innerHTML = heroBase({ fno: "haut", stats: "4" }) + tabs(["Infos", "Extrait", "Adaptations<sup>" + ads.length + "</sup>", "News<sup>0</sup>"]) + infos + extrait();
    document.body.insertAdjacentHTML("beforeend", `<div class="lb"><span class="x">×</span><span class="ar g">${IC.g}</span><img src="${pages[1]}"><span class="ar d">${IC.d}</span><span class="c">2 / 5</span><span class="cr">CROWS © Hiroshi Takahashi / Akita Shoten · Édition française Kana</span></div>`); }
}).catch(e => { document.getElementById("app").textContent = "Erreur : " + e.message; });
</script></body></html>
