<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Maquettes fiche v9 · FuryoGang</title>
<!-- Will, 25/11/2026 (3e tour) : fiche qui ne vieillit jamais (chiffres seulement pour une série terminée), infos en Inter bien lisible
     avec « : », pastille « Fiche n° », résumé plus grand (4-5 lignes), story remontée, en bas l'adresse de la fiche, 3 façons de séparer le résumé. -->
<style>
@font-face{font-family:"FGAntonio";src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:"FGInter";src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
html,body{margin:0;background:#2a2a2e;font-family:system-ui}
.w{display:inline-block;vertical-align:top;margin:20px}.w>b{display:block;font:800 22px system-ui;color:#fff;margin-bottom:10px}
.cadre{position:relative}
.f{width:1080px;height:1440px;position:relative;overflow:hidden;background:#F2EFE9;color:#0c0c0e;font-family:"FGInter";display:flex;flex-direction:column;--red:#BC002D;--mut:rgba(12,12,14,.56);--track:rgba(12,12,14,.08)}
.f *{box-sizing:border-box}
.f.story{height:1920px}
.f .top{flex:none;background:#0c0c0e;padding:34px 64px;display:flex;align-items:center}
.f.story .top{padding-top:150px}
.f .top img{width:250px;display:block}
.f .main{flex:1;min-height:0;display:flex;flex-direction:column;padding:54px 64px 56px}
.f.story .main{padding:60px 64px 300px}
.f .hero{display:flex;gap:46px;align-items:flex-start;flex:none}
.f .cv{flex:none;width:400px;height:560px;object-fit:cover;border:10px solid #fff;box-shadow:0 24px 60px rgba(0,0,0,.28);display:block;background:#ddd}
.f .info{flex:1;min-width:0}
.f .kick{display:inline-flex;align-items:center;height:56px;padding:0 22px 2px;border-radius:6px;background:var(--red);color:#fff;font:700 34px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.08em}
.f .t{margin:16px 0 0;padding-top:.14em;font:700 96px/1.02 "FGAntonio";text-transform:uppercase;white-space:nowrap;overflow:hidden}
.f .t.deux{white-space:normal;font-size:74px}
.f .jp{margin-top:8px;font:700 30px/1.4 "Noto Sans JP","FGInter",sans-serif;color:var(--mut)}
.f .rows{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.f .row{display:flex;gap:10px;align-items:baseline;font-size:30px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .row span{color:var(--mut);font-weight:600}
.f .row b{font-weight:700;white-space:normal}
.f .row.multi{white-space:normal;display:block}
.f .res{flex:none;margin-top:48px}
.f .res p{margin:0;font-size:39px;line-height:1.42;font-weight:500;color:#202024}
.f.story .res p{font-size:42px}
/* 3 façons de séparer le résumé */
.f .sep1 h3{margin:0 0 16px;display:flex;align-items:center;gap:20px;font:700 52px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.f .sep1 h3::after{content:"";flex:1;height:5px;background:var(--red)}
.f .sep2{border-top:5px solid #0c0c0e;padding-top:22px}
.f .sep2 h3{margin:0 0 14px;display:inline-flex;align-items:center;gap:16px;font:700 34px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.14em;color:#0c0c0e}
.f .sep2 h3 i{font:900 30px "Noto Sans JP",sans-serif;font-style:normal;color:var(--red);letter-spacing:.1em}
.f .sep3{border-left:10px solid var(--red);padding:6px 0 6px 30px}
.f .sep3 h3{margin:0 0 12px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.1em;color:var(--red)}
.f .chif{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.f .chif div{background:var(--track);border-radius:12px;padding:20px 22px 18px}
.f .chif span{display:block;font:700 24px/1 "FGInter";letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.f .chif b{display:block;margin-top:10px;font:700 62px/1 "FGAntonio";text-transform:uppercase}
.f .chif i{display:block;margin-top:8px;font:600 25px/1.2 "FGInter";font-style:normal;color:var(--mut)}
.f .lien{flex:none;margin-top:auto;padding-top:30px;text-align:center}
.f .lien small{display:block;font:600 28px "FGInter";color:var(--mut)}
.f .lien b{display:inline-block;margin-top:10px;font:700 46px/1 "FGAntonio";letter-spacing:.02em;color:#fff;background:#0c0c0e;padding:14px 26px 16px;border-radius:10px}
.f .lien b em{font-style:normal;color:#F2C14E}
/* Post : tout doit tenir dans 1440 (résumé 5 lignes au plus) */
.f.post .main{padding:46px 64px 36px}
.f.post .cv{width:380px;height:532px}
.f.post .res{margin-top:38px}
.f.post .res p{font-size:37px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.f.story .res p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.f.post .sep1 h3{font-size:46px;margin-bottom:12px}
.f.post .chif{margin-top:24px}.f.post .chif div{padding:14px 20px 14px}.f.post .chif b{font-size:52px}
.f.post .lien{padding-top:18px}.f.post .lien b{font-size:40px;padding:12px 22px 14px}
/* Interface Instagram */
.ig{position:absolute;inset:0;z-index:50;pointer-events:none}
.ig .bars{position:absolute;left:20px;right:20px;top:17px;display:flex;gap:6px}.ig .bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.9)}
.ig .av{position:absolute;left:35px;top:54px;width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font:900 22px sans-serif;color:#c41a2b}
.ig .nm{position:absolute;left:142px;top:72px;font:600 28px sans-serif;color:#fff}.ig .nm span{opacity:.75;margin-left:22px}
.ig .x{position:absolute;right:28px;top:58px;font:300 64px/1 sans-serif;color:#fff}
.ig .say{position:absolute;left:24px;right:150px;top:1828px;height:84px;border:2px solid rgba(12,12,14,.35);border-radius:42px;font:500 28px sans-serif;color:rgba(12,12,14,.55);display:flex;align-items:center;padding-left:34px}
.ig .hz{position:absolute;right:40px;top:1842px;font:400 48px sans-serif;color:rgba(12,12,14,.6)}

/* v4 : noms les uns sous les autres */
.f .row.pile{display:block;white-space:normal}
.f .row.pile span{display:block}
.f .row.pile b{display:block;line-height:1.3}
/* chiffres v4 : plus petits, avec drapeau, sans case Statut */
.f .chif2{flex:none;display:flex;gap:16px;margin-top:26px}
.f .chif2 div{flex:1;display:flex;align-items:center;gap:18px;background:var(--track);border-radius:12px;padding:14px 20px}
.f .chif2 .dr{flex:none;width:54px;height:36px;border-radius:5px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.f .chif2 .fr{background:linear-gradient(90deg,#1f4fd1 33.3%,#fff 33.3% 66.6%,#E1000F 66.6%)}.f .chif2 .ja{background:#fff radial-gradient(circle at 50% 50%,#BC002D 28%,#fff 29%)}
.f .chif2 b{display:block;font:700 46px/1 "FGAntonio";text-transform:uppercase}
.f .chif2 i{display:block;margin-top:5px;font:600 23px/1.2 "FGInter";font-style:normal;color:var(--mut)}
.f.story .chif2 b{font-size:52px}
/* résumé : 4 lignes en post, 5 en story */
.f.post .res p{-webkit-line-clamp:4}.f.story .res p{-webkit-line-clamp:5}
.f .res h3{margin:0}
/* R1 : titre + trait */
.f .r1 h3{margin:0 0 14px;display:flex;align-items:center;gap:20px;font:700 46px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.f .r1 h3::after{content:"";flex:1;height:5px;background:var(--red)}
/* R2 : bulle comme le site (pastille « Résumé » dans un panneau) */
.f .r2{background:#E4DED3;border-radius:22px;padding:22px 28px 26px}
.f .r2 h3{display:inline-block;margin:0 0 16px;background:#0c0c0e;color:#fff;font:700 32px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.08em;padding:12px 20px 13px;border-radius:12px}
/* R3 : onglet de dossier collé au cadre */
.f .r3 h3{display:inline-block;margin:0;background:#0c0c0e;color:#fff;font:700 30px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.1em;padding:14px 24px 12px;border-radius:12px 12px 0 0}
.f .r3 p{border:4px solid #0c0c0e;border-radius:0 14px 14px 14px;padding:20px 24px}
/* R4 : guillemet géant rouge */
.f .r4{position:relative;padding:18px 0 0 94px}
.f .r4 h3{position:absolute;left:0;top:-18px;font:700 170px/1 "FGAntonio";color:var(--red)}
.f .r4 h3 span{display:none}
/* R5 : bande noire pleine largeur */
.f .r5 h3{margin:0 -64px 18px;background:#0c0c0e;color:#fff;font:700 34px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.2em;padding:16px 64px 15px}
/* R6 : façon dossier numéroté */
.f .r6 h3{display:flex;align-items:baseline;gap:16px;margin:0 0 12px;padding-bottom:12px;border-bottom:2px solid rgba(12,12,14,.25);font:700 28px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.14em;color:var(--mut)}
.f .r6 h3 em{font-style:normal;color:var(--red);font-size:44px;letter-spacing:0}
/* R7 : kanji vertical à gauche */
.f .r7{display:flex;gap:26px;align-items:stretch}
.f .r7 h3{flex:none;writing-mode:vertical-rl;font:900 40px/1 "Noto Sans JP",sans-serif;color:#fff;background:var(--red);padding:18px 12px;border-radius:10px;letter-spacing:.2em;text-align:center}
/* R8 : carte blanche, liseré rouge en haut */
.f .r8{background:#fff;border-top:8px solid var(--red);border-radius:6px 6px 14px 14px;padding:18px 26px 22px;box-shadow:0 14px 34px rgba(0,0,0,.08)}
.f .r8 h3{margin:0 0 10px;font:700 30px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.12em;color:var(--red)}

/* v5 */
.f .row b.gen{white-space:nowrap}
.f .cv{box-shadow:none}
.f .row.g2{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;white-space:normal}
.f .row.g2 b{white-space:normal}
.f.story .main{padding-bottom:130px}
.f.post .main{padding-bottom:30px}
.f .lien{margin-top:auto}
.f .l5 b{display:inline-block;margin-top:8px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.04em;color:#0c0c0e;background:none;padding:0}.f .l5 b em{font-style:normal;color:#0c0c0e}.f .l5 b em u{text-decoration:none;color:var(--red)}
/* résumé : le titre à part, le panneau ne contient que le texte */
.f .ra,.f .rb,.f .re,.f .rf{position:relative;background:#E4DED3;border-radius:22px;padding:40px 28px 24px;margin-top:62px}
.f .ra h3,.f .rb h3,.f .re h3{position:absolute;left:26px;top:-26px;margin:0;font:700 32px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.08em;padding:12px 20px 13px;border-radius:12px}
.f .ra h3{background:#0c0c0e;color:#fff}.f .rb h3{background:var(--red);color:#fff}.f .re h3{background:#F2C14E;color:#0c0c0e}
.f .rc h3{margin:0 0 12px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.f .rc p{background:#E4DED3;border-radius:22px;padding:22px 28px}
.f .rd h3{display:inline-block;margin:0 0 16px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.08em;color:#0c0c0e;padding-bottom:8px;border-bottom:6px solid var(--red)}
.f .rf{padding-top:24px;margin-top:58px;border-top-left-radius:0}
.f .rf h3{position:absolute;left:0;top:-46px;margin:0;background:#E4DED3;color:var(--red);font:700 30px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.1em;padding:14px 22px 6px;border-radius:14px 14px 0 0}

/* v6 : décor du bas des stories, la couverture en noir et blanc derrière (entre les chiffres et l'adresse) */
.f.story .main{position:relative}
.f .hero,.f .res,.f .chif2,.f .lien{position:relative;z-index:2}
.f .deco{position:absolute;left:0;right:0;bottom:0;height:700px;overflow:hidden;z-index:1;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 38%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 38%,#000 82%,transparent 100%)}
.f .deco img{position:absolute;filter:grayscale(1) contrast(1.15)}
.f .d1 img{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.17}
.f .d2 .g{position:absolute;left:-200px;top:-120px;width:1500px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;transform:rotate(-8deg);opacity:.13}
.f .d2 .g img{position:static;width:100%;aspect-ratio:7/10;object-fit:cover}
.f .d3 img{left:-10%;top:-60%;width:120%;height:auto;opacity:.2}
.f .d3{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40%,#000 80%,transparent),linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent 0,#000 40%,#000 80%,transparent)}
.f .d4 img{width:560px;height:784px;object-fit:cover;opacity:.2;box-shadow:none;border:10px solid #fff}
.f .d4 img.a{right:-120px;top:60px;transform:rotate(9deg)}.f .d4 img.b{left:-160px;top:180px;transform:rotate(-10deg);opacity:.12}
.f .d5{background:rgba(188,0,45,.09)}.f .d5 img{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:.3;mix-blend-mode:multiply}
.f .d6 img{width:330px;height:462px;object-fit:cover;opacity:.16;border:8px solid #fff;top:150px}
.f .d6 img.a{left:110px;transform:rotate(-10deg)}.f .d6 img.b{left:375px;top:110px}.f .d6 img.c{left:640px;transform:rotate(10deg)}
/* v9 : bas de story noir comme les stories v2 (trait jaune, logo blanc), adresse de la fiche */
.f.story .main{padding-bottom:420px}
.f .basn{position:absolute;left:0;right:0;bottom:0;height:380px;background:#121212;border-top:8px solid #F2C14E;text-align:center;padding-top:56px;z-index:3}
.f .basn img{width:420px;display:block;margin:0 auto}
.f .basn small{display:block;margin-top:26px;font:600 26px "FGInter";color:rgba(255,255,255,.6)}
.f .basn b{display:block;margin-top:10px;font:700 44px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.06em;color:#fff}.f .basn b em{font-style:normal;color:#F2C14E}
/* v8 : story sans logo en haut (Instagram l'affiche déjà), bande noire fine, logo au-dessus de « La fiche complète » ; résumé 5 lignes */
.f.story .top{padding:0;height:150px}.f.story .top img{display:none}
.f.story .main{padding-top:48px}
.f.story .lien .logo{display:block;width:300px;margin:0 auto 26px}
/* v7 : la suite des noms repart tout à gauche ; story 7 lignes de résumé */
.f .row.g2{display:block;white-space:normal}.f .row.g2 span,.f .row.g2 b{display:inline}
.f.story .res p{-webkit-line-clamp:5}
/* liens du bas */
.f .l1 b em{color:#0c0c0e}.f .l3 b em{color:#0c0c0e}
.f .lien small{font:600 26px "FGInter";color:var(--mut)}
.f .l1 b{display:inline-block;margin-top:8px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.06em;color:#0c0c0e;border-bottom:4px solid var(--red);padding-bottom:6px;background:none}
.f .l2 b{display:inline-block;margin-top:8px;font:700 40px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.04em;color:#0c0c0e;background:none;padding:0}.f .l2 b em{color:var(--red);font-style:normal}
.f .l3 b{display:inline-block;margin-top:8px;font:700 38px/1 "FGInter";letter-spacing:-.01em;color:#0c0c0e;background:none;padding:0}.f .l3 b em{font-style:normal;background:#F2C14E;padding:2px 8px 4px;border-radius:4px}
.f .l4{display:flex;align-items:center;gap:22px;justify-content:center}.f .l4::before,.f .l4::after{content:"";flex:1;height:2px;background:rgba(12,12,14,.2)}
.f .l4 span{text-align:center}.f .l4 b{display:inline-block;margin-top:6px;font:700 38px/1 "FGAntonio";text-transform:uppercase;letter-spacing:.06em;color:#0c0c0e;background:none;padding:0}.f .l4 b em{font-style:normal;color:var(--red)}
</style>
</head>
<body>
<div id="out"></div>
<script>
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var couv = function (u) { return u ? "/api/couv?w=700&u=" + encodeURIComponent(u) : ""; };
var IG = '<div class="ig"><div class="bars"><i></i><i></i><i></i></div><div class="av">不良</div><div class="nm">furyogang<span>2 h</span></div><div class="x">×</div><div class="say">Envoyer un message…</div><div class="hz">♡</div></div>';
function auteurs(d) {
  var r = [], sc = d.scen || "", sup = (sc.match(/\(supervision\s*:\s*([^)]+)\)/i) || [])[1]; sc = sc.replace(/\s*\(supervision[^)]*\)/i, "").trim();
  var L = function (s) { return String(s).split(/\s*,\s*/).filter(Boolean); };
  if (sc && sc === d.dess) r.push(["Auteur", L(sc)]); else { if (sc) r.push(["Scénario", L(sc)]); if (sup) r.push(["Supervision", L(sup)]); if (d.dess) r.push(["Dessin", L(d.dess)]); }
  return r;
}
// Chiffres seulement pour une série terminée (première édition) ; drapeau dessiné ; l'année passe ici (plus dans Type).
function chiffres(d) {
  var c = [];
  if (/termin/i.test(d.stJP) && d.tomesJP) c.push(["ja", d.tomesJP + " tomes", "Terminé · " + d.y1 + "-" + d.y2]);
  if (/termin/i.test(d.stFR) && d.tomesFR) c.push(["fr", d.tomesFR + " tomes", "Terminé · " + d.pubFR]);
  return c.length ? '<div class="chif2">' + c.map(function (x) { return '<div><i class="dr ' + x[0] + '"></i><span><b>' + x[1] + "</b><i>" + esc(x[2]) + "</i></span></div>"; }).join("") + "</div>" : "";
}
var H = { a: "<h3>Résumé</h3>", b: "<h3>Résumé</h3>", c: "<h3>Résumé</h3>", d: "<h3>Résumé</h3>", e: "<h3>Résumé</h3>", f: "<h3>Résumé</h3>", 1: "<h3>Résumé</h3>", 2: "<h3>Résumé</h3>", 3: "<h3>Résumé</h3>", 4: "<h3>«<span>Résumé</span></h3>", 5: "<h3>Résumé</h3>", 6: "<h3><em>01</em>Résumé</h3>", 7: "<h3>あらすじ</h3>", 8: "<h3>Résumé</h3>" };
function deco(d, v) {
  if (!v) return ""; var u = couv(d.cover), im = function (c) { return '<img' + (c ? ' class="' + c + '"' : "") + ' src="' + u + '" alt="">'; };
  if (v === 2) { var g = ""; for (var i = 0; i < 24; i++) g += im(); return '<div class="deco d2"><div class="g">' + g + "</div></div>"; }
  if (v === 4) return '<div class="deco d4">' + im("b") + im("a") + "</div>";
  if (v === 6) return '<div class="deco d6">' + im("a") + im("c") + im("b") + "</div>";
  return '<div class="deco d' + v + '">' + im() + "</div>";
}
function card(d, fmt, r, l, v) {
  var fini = /termin/i.test(d.stJP);
  // Noms à côté du rôle ; s'ils ne tiennent pas, le suivant passe à la ligne (jamais coupé au milieu d'un nom), aligné sous le premier.
  var nom = function (n) { return esc(n).replace(/ /g, "&nbsp;"); };
  var rows = auteurs(d).map(function (a) { return '<div class="row g2"><span>' + a[0] + ' :</span> <b>' + a[1].map(nom).join(", ") + "</b></div>"; }).join("") +
    '<div class="row"><span>Genres :</span><b class="gen" data-g="' + esc(JSON.stringify(d.genres)) + '">' + esc(d.genres.slice(0, 3).join(", ")) + "</b></div>" +
    '<div class="row"><span>Type :</span><b>' + esc(d.type + (fini ? "" : " · depuis " + d.y1)) + "</b></div>" + (!fini && d.pubFR ? '<div class="row"><span>En France :</span><b>' + esc(d.pubFR) + "</b></div>" : "");
  return '<div class="f ' + fmt + '"><div class="top"><img src="/img/social/logo-blanc.png" alt=""></div><div class="main">' +
    '<div class="hero"><img class="cv" src="' + couv(d.cover) + '" alt=""><div class="info"><span class="kick">Fiche n°' + String(d.n).padStart(3, "0") + '</span><p class="t">' + esc(d.t) + "</p>" + (d.jp && d.jp.toLowerCase() !== d.t.toLowerCase() ? '<div class="jp">' + esc(d.jp) + "</div>" : "") +
