<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four You Gang</title>
<meta name="description" content="Four You Gang : l'actu des mangas furyō, yankee et urashakai.">
<meta name="theme-color" content="#0E0E0C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--ink:#0E0E0C;--ink-2:#161613;--line:#2E2D28;--paper:#F2EFE6;--paper-2:#B4B0A3;--red:#E5483A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--ink);color:var(--paper);font-family:"Noto Sans JP",system-ui,sans-serif;display:flex;align-items:center;padding:32px 16px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(48px,14vw,96px);line-height:.9}
p{margin:0;color:var(--paper-2);font-size:16px;line-height:1.6}
a.card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--ink-2);color:var(--paper);text-decoration:none}
a.card:hover{border-color:var(--red)}
a.card strong{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em}
a.card span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--paper-2)}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Furyō · Yankee · Urashakai</span>
  <h1>FOUR YOU GANG</h1>
  <p>Le site arrive bientôt. En attendant, le guide de lecture est en ligne.</p>
  <a class="card" href="/crows-x-worst/"><strong>CROWS × WORST</strong><span>CHRONOLOGIE →</span></a>
</main>
</body>
</html>
