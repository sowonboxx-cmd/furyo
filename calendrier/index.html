<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier · FuryoGang</title>
<meta name="description" content="Les prochaines sorties de mangas furyō, yakuza et crime, au Japon et en France.">
<meta name="theme-color" content="#232325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"></noscript>
<style>
/* Calendrier des sorties : même système que le fil (sombre, cartes noires, Antonio + Inter). */
:root{
  --ink:#232325; --ink-2:#000; --ink-3:#38383B;
  --paper:#F5F5F7; --paper-2:#CFCFD4; --paper-3:#98989D;
  --red:#E54839; --ok:#7BC67E; --amber:#F2B33D; --jp:#E5483A; --fr:#7FA7C9;
  --f-display:"Antonio","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 48px}
.top{display:flex;align-items:center;gap:12px}
.round{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;text-decoration:none;flex:none;color:var(--paper)}
@media (min-width:980px){.top{display:none}}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-decoration:none;text-transform:uppercase}
.brand span{color:var(--red)}
h1{margin:18px 0 2px;font-family:var(--f-display);font-weight:700;font-size:clamp(44px,12vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.sub{margin:0;color:var(--paper-2)}
.bar{display:flex;gap:8px;align-items:center;margin-top:8px;padding:8px 0;position:sticky;top:var(--sh-h,0px);z-index:5;background:var(--ink)}
.seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--ink-3);border-radius:14px}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;color:var(--paper-2);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink-2);color:var(--paper)}
.views{display:flex;gap:4px;padding:4px;background:var(--ink-3);border-radius:14px}
.views button{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--paper-2);display:grid;place-items:center;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink-2);color:var(--paper)}
.month{margin:26px 0 10px;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.month small{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--paper-3);letter-spacing:.04em;text-transform:none}
/* Liste */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 64px minmax(0,1fr);gap:12px;align-items:center;background:var(--ink-2);border-radius:16px;padding:10px 12px 10px 10px;text-decoration:none}
.day{text-align:center;line-height:1}
.day b{display:block;font-family:var(--f-display);font-weight:700;font-size:28px}
.day small{display:block;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-3)}
.thumb{width:64px;aspect-ratio:4/5;border-radius:8px;object-fit:cover;background:var(--ink-3);display:grid;place-items:center;overflow:hidden;color:var(--paper-3);font-size:11px;font-weight:700;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.05em}
.r-t{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.r-t em{font-style:normal;color:var(--paper-2)}
.r-jp{display:block;font-size:12.5px;color:var(--paper-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pill{height:22px;padding:0 8px;border-radius:6px;background:var(--ink-3);display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--paper-2)}
.pill.jp{color:var(--jp);background:color-mix(in srgb,var(--jp) 18%,var(--ink-3))}
.pill.fr{color:var(--fr);background:color-mix(in srgb,var(--fr) 18%,var(--ink-3))}
.pill.wait{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--ink-3))}
.pill.out{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--ink-3))}
/* Grille */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;min-width:0}
.cv{position:relative;width:100%;aspect-ratio:5/7;border-radius:10px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:14px;color:var(--paper-3);letter-spacing:.08em}
.cv .date{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.8);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.cv .wait{position:absolute;left:5px;bottom:5px;right:5px;text-align:center;background:rgba(0,0,0,.8);border-radius:6px;padding:3px 2px;font-size:9.5px;line-height:1.2;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)}
.c-t{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.c-t em{font-style:normal;color:var(--paper-2);white-space:nowrap}
@media (min-width:640px){.c-t{font-size:17px}.cv{border-radius:14px}}
.flag{width:22px;height:15px;border-radius:3px;flex:none;display:block;overflow:hidden}
.empty{color:var(--paper-3);text-align:center;padding:40px 0}

.now{list-style:none;display:flex;align-items:center;gap:10px;color:var(--red);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 2px}
.now::before,.now::after{content:"";flex:1;height:2px;background:var(--red);border-radius:2px;opacity:.7}
.grid .now{grid-column:1/-1}
.past{margin-top:40px;padding-top:18px;border-top:1px solid var(--ink-3)}
.past-h{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3)}
.past .month{margin-top:10px}
.foot{margin-top:28px;text-align:center;color:var(--paper-2);font-size:13px}
.foot a{color:var(--paper);font-weight:600;text-decoration:none}
/* Fenêtre d'une sortie : couverture en grand, infos, flèches pour passer d'une sortie à l'autre */
.lb{position:fixed;inset:0;z-index:60;background:rgba(35,35,37,.95);touch-action:none;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;transition:opacity .18s}
.lb.on{opacity:1}
.lb[hidden]{display:none!important}
.lb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:44px;height:44px;border:0;border-radius:22px;background:var(--ink-3);color:var(--paper);display:grid;place-items:center;cursor:pointer}
.lb-c{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--paper);letter-spacing:.04em}
@media (min-width:720px){.lb-c{font-size:30px}}

.lb-in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;min-height:0}
.lb-cv{height:min(52vh,560px);aspect-ratio:5/7;max-width:100%;border-radius:10px;overflow:hidden;background:var(--ink-2);display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.6);flex:none}
.lb-cv img{width:100%;height:100%;object-fit:cover;display:block}
.lb-cv .ph{writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:22px;color:var(--paper-3);letter-spacing:.08em}
.lb-t{margin:16px 0 0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;text-transform:uppercase;text-align:center}
.lb-t em{font-style:normal;color:var(--paper-2)}
.lb-jp{margin:5px 0 0;font-size:13px;color:var(--paper-2);text-align:center}
.lb-m{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;align-items:center}
.lb-d{margin:10px 0 0;font-size:14px;font-weight:600;text-align:center}
.lb-d::first-letter{text-transform:uppercase}
.lb-go{margin-top:16px;height:46px;padding:0 22px;border-radius:23px;background:#305887;color:#fff;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.lb-soon{margin:16px 0 0;font-size:13px;color:var(--paper-3)}
.lb-nav{display:flex;gap:10px;width:100%;max-width:420px;margin-top:14px}
.lb-nav button{flex:1;height:44px;border:0;border-radius:14px;background:var(--ink-2);color:var(--paper);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.lb-nav button:disabled{opacity:.3;cursor:default}
body.lb-open{overflow:hidden}
@media (max-height:640px){.lb-cv{height:42vh}.lb-t{font-size:20px}}
/* Tant que le calendrier n'est pas prêt : rien ne bouge à l'écran (pas de « Chargement… », pas de pied de page qui saute) */
#app{min-height:100vh}
body:not(.ready) #app,body:not(.ready) .foot{opacity:0}
body.ready #app{transition:opacity .15s}
/* Champs en 16 px minimum : sinon iPhone zoome quand on touche le champ */
input,select,textarea{font-size:16px!important}
</style>
</head>
<body>
<script src="/site/header.js?v=16"></script>
<div class="page">
  <div class="bar">
    <div class="seg" role="group" aria-label="Pays">
      <button data-pays="all" aria-pressed="true">Tout</button>
      <button data-pays="Japon" aria-pressed="false">Japon</button>
      <button data-pays="France" aria-pressed="false">France</button>
    </div>
    <div class="views" role="group" aria-label="Affichage">
      <button data-view="list" aria-pressed="true" aria-label="Vue liste"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      <button data-view="grid" aria-pressed="false" aria-label="Vue grille"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    </div>
  </div>
  <main id="app"></main>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Sortie">
  <span class="lb-c" id="lb-c"></span>
  <button class="lb-x" id="lb-x" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="lb-in" id="lb-in"></div>
  <div class="lb-nav"><button id="lb-p"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Précédente</button><button id="lb-n">Suivante<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
</div>
<script>
const tn = n => (Number.isInteger(n) && n >= 0 && n < 10) ? "0" + n : String(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = document.getElementById("app");
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const state = { pays: ({ japon: "Japon", france: "France" })[location.hash.slice(1)] || "all", view: store.get("cal-view") === "grid" ? "grid" : "list" };
let ITEMS = [];
const today = new Date().toISOString().slice(0, 10);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const d0 = s => new Date(s + "T12:00:00");
// Titre français dès qu'il existe (même pour une sortie japonaise), sinon le titre officiel ; CROWS, WORST… restent en capitales.
const title = it => (it.fr && !(it.series && it.series === it.series.toUpperCase() && /[A-Z]/.test(it.series) && it.series.toLowerCase() === it.fr.toLowerCase()) ? it.fr : (it.series || it.tome));
function img(it){
  // Couverture refusée (image provisoire « NOW PRINTING ») : on affiche le titre japonais à la place.
  const ph = `<span class="ph" lang="ja">${esc((it.jp || it.series || "").slice(0, 6))}</span>`;
  if (it.cover) return `<img src="/api/couv?u=${encodeURIComponent(it.cover)}&w=360" alt="" loading="lazy" decoding="async" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">`;
  if (it.visual) return `<img src="/api/visuel?s=${it.seriesId}&p=main" alt="" loading="lazy">`;
  return `<span class="ph" lang="ja">${esc((it.jp || it.series || "").slice(0, 6))}</span>`;
}
const FLAGS = {
  Japon: `<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="Japon"><rect width="22" height="15" fill="#F5F5F7"/><circle cx="11" cy="7.5" r="4.2" fill="#E5483A"/></svg>`,
  France: `<svg class="flag" viewBox="0 0 22 15" role="img" aria-label="France"><rect width="7.34" height="15" fill="#2F5DA8"/><rect x="7.33" width="7.34" height="15" fill="#F5F5F7"/><rect x="14.66" width="7.34" height="15" fill="#E5483A"/></svg>`
};
const flag = p => FLAGS[p] || "";
function dayBox(it){
  const d = d0(it.date);
  if (it.prec === "Mois") return `<span class="day"><b>—</b><small>${MCOURT[d.getMonth()]}</small></span>`;
  return `<span class="day"><b>${d.getDate()}</b><small>${JOURS[d.getDay()]}</small></span>`;
}
const MCOURT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dateTxt(it){ const d = d0(it.date); return it.prec === "Mois" ? `${MOIS[d.getMonth()]}` : `${d.getDate()} ${MCOURT[d.getMonth()]}`; }
const sref = it => "/series/" + String(it.fr || it.series || "").replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/æ/g, "ae").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function rowHTML(it){
  const past = it.date < today;
  const thumb = it.cover || it.visual ? `<span class="thumb">${img(it).replace("<img ", '<img style="width:100%;height:100%;object-fit:cover" ')}</span>` : `<span class="thumb" lang="ja">${esc((it.jp || "").slice(0, 5))}</span>`;
  return `<li${past ? ' class="was"' : ""} data-p="${esc(it.pays)}" data-d="${it.date}" data-k="${it._k}"><a class="row" href="${sref(it)}" data-i="0">${dayBox(it)}${thumb}<div><div class="r-t">${esc(title(it))}${it.n != null ? ` <em>T.${tn(it.n)}</em>` : ""}</div>${it.jp ? `<span class="r-jp" lang="ja">${esc(it.jp)}${it.vtitle ? " · " + esc(it.vtitle) : ""}</span>` : ""}
    <div class="r-meta">${flag(it.pays)}${it.pub ? `<span class="pill">${esc(it.pub)}</span>` : ""}${past ? `<span class="pill out">Sorti</span>` : ""}</div></div></a></li>`;
}
function cardHTML(it){
  const past = it.date < today;
  return `<li${past ? ' class="was"' : ""} data-p="${esc(it.pays)}" data-d="${it.date}" data-k="${it._k}"><a class="card" href="${sref(it)}" data-i="0"><div class="cv">${img(it)}<span class="date">${esc(dateTxt(it))}</span></div>
    <div class="c-t"><span class="ct-n" data-full="${esc(title(it))}">${esc(title(it))}</span>${it.n != null ? ` <em>T.${tn(it.n)}</em>` : ""}</div></a></li>`;
}
let SHOWN = [];
const NOW_DIV = () => { const d = new Date(); return `<li class="now" id="now"><span>Aujourd'hui · ${d.getDate()} ${MCOURT[d.getMonth()]}</span></li>`; };
function group(list, cls, desc){
  const by = {};
  list.forEach(it => { const d = d0(it.date); const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; (by[k] = by[k] || []).push(it); });
  const keys = Object.keys(by).sort(); if (desc) keys.reverse();
  return keys.map(k => {
    const [y, m] = k.split("-");
    const items = by[k];
    const one = it => state.view === "grid" ? cardHTML(it) : rowHTML(it);
    const inner = `<ul class="${state.view === "grid" ? "grid" : "list"}">${items.map(one).join("")}</ul>`;
    return `<section class="${cls || ""}"><h2 class="month">${MOIS[+m - 1]} ${y}<small></small></h2>${inner}</section>`;
  }).join("");
}
// La liste complète (tous pays) n'est construite qu'une fois par affichage (liste / grille) ;
// changer d'onglet Tout / Japon / France masque ou montre les sorties sans rien redessiner : plus de clignotement.
let ALL = [];
function render(){
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  ALL = ITEMS.slice().sort((a, b) => a.date.localeCompare(b.date)); ALL.forEach((it, i) => { it._k = i; });
  app.innerHTML = ALL.length ? group(ALL) + `<p class="empty" id="none" hidden></p>` : `<p class="empty">Aucune sortie pour l'instant.</p>`;
  applyPays();
}
function applyPays(){
  document.querySelectorAll("[data-pays]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pays === state.pays));
  const old = document.getElementById("now"); if (old) old.remove();
  SHOWN = []; let firstNext = null;
  app.querySelectorAll("li[data-p]").forEach(li => {
    const on = state.pays === "all" || li.dataset.p === state.pays;
    li.hidden = !on;
    if (on) { li.querySelector("a[data-i]").dataset.i = SHOWN.length; SHOWN.push(ALL[+li.dataset.k]); if (!firstNext && li.dataset.d >= today) firstNext = li; }
  });
  app.querySelectorAll("section").forEach(sec => {
    const n = sec.querySelectorAll("li[data-p]:not([hidden])").length;
    sec.hidden = !n; const sm = sec.querySelector(".month small"); if (sm) sm.textContent = `${n} sortie${n > 1 ? "s" : ""}`;
  });
  if (firstNext) firstNext.insertAdjacentHTML("beforebegin", NOW_DIV());
  const none = document.getElementById("none");
  if (none) { none.hidden = !!firstNext; none.textContent = !SHOWN.length ? `Aucune sortie pour l'instant${state.pays !== "all" ? " de ce côté" : ""}.` : `Aucune sortie annoncée pour l'instant${state.pays !== "all" ? " de ce côté" : ""}.`; }
  fitAll();
  goToday();
}
// Titre sur deux lignes au plus : s'il dépasse, on le coupe avec « … » pour que le tome reste toujours visible.
function fit(el){
  const n = el.querySelector(".ct-n"); if (!n) return;
  const full = n.dataset.full; n.textContent = full;
  const max = parseFloat(getComputedStyle(el).lineHeight) * 2 + 2;
  if (el.offsetHeight <= max) return;
  let lo = 0, hi = full.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; n.textContent = full.slice(0, mid).trimEnd() + "…"; if (el.offsetHeight <= max) lo = mid; else hi = mid - 1; }
  n.textContent = full.slice(0, lo).trimEnd() + "…";
}
function fitAll(){ document.querySelectorAll(".c-t").forEach(fit); }
let fitT; addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(fitAll, 120); });
if (document.fonts) document.fonts.ready.then(fitAll);
function goToday(){
  const now = document.getElementById("now"); if (!now) return;
  // On s'arrête sur le titre du mois en cours : mois, nombre de sorties et « Aujourd'hui » visibles d'un coup.
  const sec = now.closest("section"), mo = sec && sec.querySelector(".month");
  // Si beaucoup de sorties sont déjà passées ce mois-ci, « Aujourd'hui » passe avant le titre du mois.
  const el = mo && now.getBoundingClientRect().top - mo.getBoundingClientRect().top < innerHeight * 0.45 ? mo : now;
  const bar = document.querySelector(".bar");
  // Sous l'en-tête du site et la barre Tout / Japon / France (toutes deux collées en haut), avec un peu d'air.
  const sh = document.getElementById("sh");
  const y = el.getBoundingClientRect().top + scrollY - (sh ? sh.offsetHeight : 0) - (bar ? bar.offsetHeight : 0) - 16;
  scrollTo({ top: Math.max(0, y), behavior: "instant" });
}
document.addEventListener("click", e => {
  const p = e.target.closest("[data-pays]"); if (p) { state.pays = p.dataset.pays; history.replaceState(null, "", state.pays === "all" ? location.pathname : "#" + state.pays.toLowerCase()); applyPays(); return; }
  const v = e.target.closest("[data-view]"); if (v) { state.view = v.dataset.view; store.set("cal-view", state.view); render(); }
});
// Fenêtre d'une sortie : un clic sur un tome montre la couverture en grand ; flèches (ou glisser) pour la sortie d'avant / d'après.
const LB = document.getElementById("lb"); let LBI = -1;
const JOURS_L = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function dateLong(it){ const d = d0(it.date); return it.prec === "Mois" ? `${MOIS[d.getMonth()]} ${d.getFullYear()}` : `${JOURS_L[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; }
function lbShow(i){
  const it = SHOWN[i]; if (!it) return; LBI = i;
  const past = it.date < today;
  const cover = it.cover ? `<img src="/api/couv?u=${encodeURIComponent(it.cover)}&w=1000" alt="Couverture de ${esc(title(it))}${it.n != null ? " tome " + tn(it.n) : ""}">` : it.visual ? `<img src="/api/visuel?s=${it.seriesId}&p=main" alt="">` : `<span class="ph" lang="ja">${esc((it.jp || it.series || "").slice(0, 6))}</span>`;
  document.getElementById("lb-in").innerHTML = `<div class="lb-cv">${cover}</div>
    <h2 class="lb-t">${esc(title(it))}${it.n != null ? ` <em>T.${tn(it.n)}</em>` : ""}</h2>
    ${it.jp ? `<p class="lb-jp" lang="ja">${esc(it.jp)}${it.vtitle ? " · " + esc(it.vtitle) : ""}</p>` : ""}
    <div class="lb-m">${flag(it.pays)}${it.pub ? `<span class="pill">${esc(it.pub)}</span>` : ""}${past ? `<span class="pill out">Sorti</span>` : ""}</div>
    <p class="lb-d">${esc(dateLong(it))}</p>
    ${it.fiche === false ? `<p class="lb-soon">Fiche de la série bientôt en ligne</p>` : `<a class="lb-go" href="${sref(it)}">Accéder à la série</a>`}`;
  document.getElementById("lb-c").textContent = `${i + 1} / ${SHOWN.length}`;
  document.getElementById("lb-p").disabled = i <= 0;
  document.getElementById("lb-n").disabled = i >= SHOWN.length - 1;
  // Précharge les couvertures voisines pour que les flèches soient instantanées.
  [SHOWN[i - 1], SHOWN[i + 1]].forEach(x => { if (x && x.cover) new Image().src = "/api/couv?u=" + encodeURIComponent(x.cover) + "&w=1000"; });
}
function lbOpen(i){ lbShow(i); LB.hidden = false; document.body.classList.add("lb-open"); requestAnimationFrame(() => LB.classList.add("on")); }
function lbClose(){ LB.classList.remove("on"); document.body.classList.remove("lb-open"); setTimeout(() => { LB.hidden = true; }, 180); LBI = -1; }
const lbGo = d => { const j = LBI + d; if (j >= 0 && j < SHOWN.length) lbShow(j); };
app.addEventListener("click", e => {
  const a = e.target.closest("a[data-i]"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault(); lbOpen(+a.dataset.i);
});
document.getElementById("lb-x").onclick = lbClose;
document.getElementById("lb-p").onclick = () => lbGo(-1);
document.getElementById("lb-n").onclick = () => lbGo(1);
LB.addEventListener("click", e => { if (e.target === LB) lbClose(); });
addEventListener("keydown", e => { if (LBI < 0) return; if (e.key === "Escape") lbClose(); else if (e.key === "ArrowRight") lbGo(1); else if (e.key === "ArrowLeft") lbGo(-1); });
// Pas de zoom dans la fenêtre (double appui ou pincement par erreur sur iPhone).
["gesturestart", "gesturechange", "dblclick"].forEach(ev => LB.addEventListener(ev, e => e.preventDefault(), { passive: false }));
let lastTap = 0;
LB.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTap < 350 && !e.target.closest("a, button")) e.preventDefault(); lastTap = t; }, { passive: false });
LB.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let tx = null, ty = 0;
LB.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
LB.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbGo(dx < 0 ? 1 : -1); });
// Pas de flash à l'ouverture : on affiche tout de suite la dernière version gardée sur l'appareil (déjà calée sur aujourd'hui),
// puis on la remplace seulement si les données ont changé.
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
const KEEP = store.get("cal-data");
const ready = () => document.body.classList.add("ready");
// Lien direct vers une sortie (depuis la recherche) : /calendrier/#t-<id> ouvre sa fenêtre.
function openFromHash(){
  const m = location.hash.match(/^#t-([0-9a-f]{32})$/); if (!m || LBI >= 0) return;
  const i = SHOWN.findIndex(x => x.id === m[1]);
  if (i < 0 && state.pays !== "all") { state.pays = "all"; applyPays(); return openFromHash(); }
  if (i >= 0) lbOpen(i);
}
addEventListener("hashchange", openFromHash);
if (KEEP) { try { ITEMS = JSON.parse(KEEP).items || []; render(); ready(); openFromHash(); } catch (e) {} }
fetch("/api/calendrier").then(r => r.text()).then(t => {
  const j = JSON.parse(t); if (j.error) throw new Error(j.error);
  if (t !== KEEP) { store.set("cal-data", t); ITEMS = j.items || []; render(); }
  ready(); openFromHash();
}).catch(err => { if (!KEEP) app.innerHTML = `<p class="empty">Impossible de charger le calendrier pour le moment.</p>`; ready(); console.error(err); });
</script>
</body>
</html>
