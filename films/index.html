<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>À l'écran · FuryoGang</title>
<meta name="description" content="Films, dramas, OAV et anime tirés des mangas furyō, yakuza et crime : fiches, résumés, bandes-annonces officielles.">
<!-- Pas encore référencé : les fiches sont « À valider » (Will, 06/10/2026). Retirer cette ligne à la mise en avant dans le menu. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#232325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Films, dramas, OAV, anime : même système que les fiches séries (fond #232325, cadres noirs, Antonio + Inter).
   /films/ = la grille avec onglets par type (maquette 1, Will 06/10/2026) ; /films/<nom> = la fiche « classique » + « Toute la saga ». */
:root{
  --ink:#232325; --ink-2:#000; --ink-3:#38383B;
  --paper:#F5F5F7; --paper-2:#CFCFD4; --paper-3:#98989D;
  --red:#E54839; --blue:#4C9BFF; --amber:#F2B33D; --violet:#9A6DD7;
  --f-display:"Antonio","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
[hidden]{display:none!important}
.page{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 48px}
@media (min-width:980px){.page{max-width:1240px;padding-inline:20px;padding-top:28px}}
.empty{color:var(--paper-3);text-align:center;padding:40px 0}
.crumb{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:13px;color:var(--paper-3);white-space:nowrap;overflow:hidden}
.crumb a{color:var(--paper-2);text-decoration:none;font-weight:600}.crumb a:hover{color:var(--paper)}
.crumb span{overflow:hidden;text-overflow:ellipsis}
h1,h2{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}

/* ---------- Liste ---------- */
.lh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 18px}
.lh h1{font-size:clamp(38px,9vw,56px);line-height:1}
.lh p{margin:6px 0 0;color:var(--paper-3)}
.tabs{display:flex;gap:4px;background:#000;border-radius:16px;padding:5px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{flex:none;border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:600;color:var(--paper-3);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink-3);color:var(--paper)}
.tabs button:hover{color:var(--paper)}
.tabs i{font-style:normal;font-size:12px;color:var(--paper-3);margin-left:6px}
.sorts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.sorts button{height:34px;padding:0 13px;border:0;border-radius:9px;background:var(--ink-3);color:var(--paper-2);font-weight:600;font-size:14px;cursor:pointer}
.sorts button[aria-pressed=true]{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:26px 20px}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.pc{position:relative;display:block;text-decoration:none;min-width:0}
.pc .im{display:block;width:100%;aspect-ratio:600/850;border-radius:12px;overflow:hidden;background:#000}
.pc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.pc:hover img{transform:scale(1.03)}
.pc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;font:700 18px/1.05 var(--f-display);text-transform:uppercase}
.pc small{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--paper-3)}
.ty{flex:none;width:8px;height:8px;border-radius:2px;background:var(--red)}
.ty.Drama{background:var(--blue)}.ty.OAV{background:var(--violet)}.ty.Anime{background:var(--amber)}
.star{position:absolute;z-index:1;top:8px;left:8px;background:#000;color:#fff;font:700 10.5px/22px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:0 8px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.pc img{transition:none}}

/* ---------- Fiche ---------- */
.fc{position:relative;background:#000;border-radius:20px;padding:16px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:720px){.fc{grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto 1fr;row-gap:0;column-gap:32px;padding:28px;border-radius:24px}}
@media (min-width:980px){.fc{grid-template-columns:260px minmax(0,1fr);column-gap:36px;padding:32px}}
.poster{width:100%;aspect-ratio:600/850;border-radius:10px;overflow:hidden;background:#111}
@media (min-width:720px){.poster{border-radius:14px;grid-row:span 2}}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.fc h1{font-size:clamp(30px,8.4vw,64px);line-height:.98;overflow-wrap:anywhere}
.fc .jp{margin:5px 0 0;font:500 14px/1.3 "Noto Sans JP",var(--f-body);color:var(--paper-2)}
@media (min-width:720px){.fc .jp{font-size:17px}}
.meta{margin:14px 0 0;color:var(--paper-2);font-size:14px}
.meta b{color:var(--paper);font-weight:600}
.dot{color:var(--paper-3);margin:0 6px}
.res{margin:16px 0 0;font-size:15.5px;line-height:1.7;max-width:780px}
@media (min-width:720px){.res{font-size:16px;text-align:justify}}
@media (max-width:719px){.fc .wide{grid-column:1/-1}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:8px;background:var(--ink-3);color:var(--paper-2);font-weight:600;font-size:13.5px}
.tag.b{background:var(--blue);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:21px;background:var(--ink-3);color:var(--paper);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.btn:hover{background:#46464A}
.btn.b{background:var(--blue);color:#fff}.btn.b:hover{background:#3A8AF0}
.btn svg{width:15px;height:15px;flex:none}
.duo{display:grid;gap:16px;margin-top:16px}
@media (min-width:900px){.duo{grid-template-columns:minmax(0,1fr) 380px;gap:20px;margin-top:20px}.duo.solo{grid-template-columns:minmax(0,1fr)}.duo.solo .cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px}.duo.solo .cast li:nth-child(-n+3){border-top:0;padding-top:2px}}
.box{background:#000;border-radius:20px;padding:18px}
@media (min-width:720px){.box{border-radius:24px;padding:24px}}
.box h2{font-size:28px;line-height:1;margin-bottom:14px}
.cast{margin:0;padding:0;list-style:none}
.cast li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #1d1d20;font-weight:600}
.cast li:first-child{border-top:0;padding-top:2px}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:14px;overflow:hidden;background:#111;cursor:pointer}
.yt img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.85)}
.yt .pl{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:#305887;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45);transition:transform .15s}.yt:hover .pl{transform:scale(1.06)}
.yt .pl svg{width:28px;height:28px;margin-left:4px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-ask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;background:rgba(0,0,0,.82);text-align:center;font-size:14px;color:var(--paper-2);cursor:default}
.yt-ask>span{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.yt-n{margin:10px 0 0;font-size:13px;color:var(--paper-3)}
.yt-n a{color:var(--paper-2)}
.manga{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;align-items:center;margin-top:16px;padding:16px;border-radius:20px;background:#000;text-decoration:none}
@media (min-width:720px){.manga{grid-template-columns:90px minmax(0,1fr) auto;gap:22px;padding:18px 24px 18px 18px;margin-top:20px;border-radius:24px}}
.manga img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:8px;display:block;background:#111}
.manga small{display:block;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.manga b{display:block;font:700 30px/1 var(--f-display);text-transform:uppercase}
.manga .btn{grid-column:1/-1;justify-self:start}
.manga.nocv{grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.manga.nocv{grid-template-columns:minmax(0,1fr) auto;padding-left:24px}}
@media (min-width:720px){.manga .btn{grid-column:auto}}
.saga{margin-top:34px}
.saga .sh2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.saga h2{font-size:clamp(28px,6vw,36px);line-height:1}
.saga .sh2 span{color:var(--paper-3);font-size:14px}
.saga .grid .pc.on .im{outline:3px solid var(--blue);outline-offset:3px}
.pc{position:relative}.adm-pill{position:absolute;top:8px;left:8px;z-index:3;background:#6A4BC4;color:#fff;font:800 11px Inter,sans-serif;letter-spacing:.04em;padding:4px 8px;border-radius:6px}.tag.adm{background:#6A4BC4;color:#fff}
</style>
</head>
<body>
<script src="/site/header.js?v=32"></script>
<script src="/site/yt.js?v=3"></script>
<div class="page">
  <div id="app"><p class="empty">Chargement…</p></div>
</div>
<script>
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ARR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>';
const TYPES = [["Film", "Films"], ["Drama", "Dramas"], ["OAV", "OAV"], ["Anime", "Anime"]];
const app = document.getElementById("app");
const slug = decodeURIComponent(location.pathname.replace(/^\/films\/?/, "").replace(/\/$/, "")).toLowerCase();
let DATA = null, TYPE = "", TRI = "recent";

const titreS = s => s ? (s.t && s.t === s.t.toUpperCase() && /[A-Z]/.test(s.t) ? s.t : (s.fr || s.t)) : "";
const ytId = u => { const m = String(u || "").match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? m[1] : ""; };
const card = (f, on) => `<a class="pc${on ? " on" : ""}" href="/films/${esc(f.slug)}">${f.adm ? '<span class="adm-pill" title="Validé, visible seulement par les admins">Admins</span>' : ""}${f.must && !on ? '<span class="star">À voir</span>' : ""}<span class="im">${f.img ? `<img src="${esc(f.img)}" alt="Affiche de ${esc(f.t)}" loading="lazy">` : ""}</span><b>${esc(f.t)}</b><small><span class="ty ${esc(f.type)}"></span>${esc(f.type)}${f.y ? " · " + f.y : ""}${on ? " · tu es ici" : ""}</small></a>`;

// ---------- Liste : grille d'affiches, onglets par type, tris ----------
function liste() {
  document.title = "À l'écran · FuryoGang";
  const all = DATA.items, n = t => all.filter(f => f.type === t).length;
  let v = all.filter(f => !TYPE || f.type === TYPE);
  if (TRI === "must") v = v.filter(f => f.must);
  if (TRI === "manga") v = v.filter(f => f.manga);
  v = [...v].sort(TRI === "az" ? (a, b) => a.t.localeCompare(b.t, "fr") : (a, b) => (b.y || 0) - (a.y || 0) || a.t.localeCompare(b.t, "fr"));
  const tabs = [["", "Tout", all.length], ...TYPES.map(([k, l]) => [k, l, n(k)]).filter(x => x[2])];
  const tris = [["recent", "Plus récents"], ["must", "À voir absolument"], ["az", "A → Z"], ["manga", "D'après un manga"]];
  app.innerHTML = `<div class="lh"><div><h1>À l'écran</h1><p>Films, dramas, OAV et anime tirés des mangas furyō, yakuza et crime.</p></div>
    ${tabs.length > 2 ? `<div class="tabs" role="group" aria-label="Type">${tabs.map(([k, l, c]) => `<button type="button" data-type="${k}" aria-pressed="${TYPE === k}">${l}<i>${c}</i></button>`).join("")}</div>` : ""}</div>
    <div class="sorts" role="group" aria-label="Tri">${tris.map(([k, l]) => `<button type="button" data-tri="${k}" aria-pressed="${TRI === k}">${l}</button>`).join("")}</div>
    ${v.length ? `<div class="grid">${v.map(f => card(f)).join("")}</div>` : `<p class="empty">Rien pour l'instant dans cette catégorie.</p>`}`;
}

// ---------- Fiche : bloc principal, bande-annonce + distribution, manga d'origine, toute la saga ----------
function fiche(f) {
  const S = DATA.series || {};
  document.title = `${f.t}${f.y ? ` (${f.y})` : ""} · FuryoGang`;
  // Manga d'origine affiché : le premier dont la fiche est en ligne (sinon le premier lié) ; les autres sont cités à côté.
  const ser0 = f.series.map(id => S[id]).filter(Boolean), m = ser0.find(x => x.on) || ser0[0], ser = m ? [m, ...ser0.filter(x => x !== m)] : [];
  // La saga : tous les titres qui partagent au moins une série liée, dans l'ordre de sortie.
  const saga = f.series.length ? DATA.items.filter(x => x.series.some(i => f.series.includes(i))).sort((a, b) => (a.y || 0) - (b.y || 0) || a.t.localeCompare(b.t, "fr")) : [];
  const id = ytId(f.ba);
  const meta = [f.y ? `<b>${f.y}</b>` : "", f.d ? `${f.d} min` : "", f.real ? `Réalisé par <b>${esc(f.real)}</b>` : ""].filter(Boolean).join('<span class="dot">·</span>');
  const mLien = m && m.on ? `/series/${esc(m.slug)}` : "";
  app.innerHTML = `<nav class="crumb" aria-label="Fil d'Ariane"><a href="/films/">À l'écran</a>›<span aria-current="page">${esc(f.t)}</span></nav>
  <article class="fc">
    <div class="poster">${f.img ? `<img src="${esc(f.img)}" alt="Affiche de ${esc(f.t)}">` : ""}</div>
    <div>
      <h1>${esc(f.t)}</h1>${f.jp && f.jp !== f.t ? `<p class="jp" lang="ja">${esc(f.jp)}</p>` : ""}${f.fr && f.fr !== f.t ? `<p class="jp">En France : ${esc(f.fr)}</p>` : ""}
      ${meta ? `<p class="meta">${meta}</p>` : ""}
      ${f.cast.length ? `<p class="meta">Avec <b>${esc(f.cast.slice(0, 4).join(", "))}</b></p>` : ""}
    </div>
    <div class="wide">
      ${f.res ? `<p class="res">${esc(f.res)}</p>` : ""}
      <div class="tags">${f.adm ? '<span class="tag adm" title="Validé, visible seulement par les admins">Admins</span>' : ""}<span class="tag b">${esc(f.type)}</span>${f.must ? '<span class="tag">À voir absolument</span>' : ""}${f.manga ? '<span class="tag">D\'après un manga</span>' : ""}</div>
      <div class="acts">${id ? `<a class="btn b" href="#ba">${PLAY}Bande-annonce</a>` : ""}${mLien ? `<a class="btn" href="${mLien}">${f.manga ? "Le manga" : "Aussi en manga"} ${esc(titreS(m))}${ARR}</a>` : ""}</div>
    </div>
  </article>
  ${id || f.cast.length ? `<div class="duo${id && f.cast.length ? "" : " solo"}">
    ${id ? `<section class="box" id="ba"><h2>Bande-annonce</h2><div class="yt" role="button" tabindex="0" data-yt="${id}" aria-label="Lire la bande-annonce de ${esc(f.t)}">${FG_YT.img(id)}${FG_YT.play}</div><p class="yt-n">Bande-annonce officielle · <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Voir sur YouTube</a></p></section>` : ""}
    ${f.cast.length ? `<section class="box"><h2>Distribution</h2><ul class="cast">${f.cast.map(a => `<li>${esc(a)}</li>`).join("")}</ul>${f.real ? `<p class="yt-n">Réalisation : ${esc(f.real)}</p>` : ""}</section>` : ""}
  </div>` : ""}
  ${m ? `<${mLien ? `a href="${mLien}"` : "div"} class="manga${m.cover ? "" : " nocv"}">${m.cover ? `<img src="${esc(m.cover)}" alt="" loading="lazy">` : ""}<div><small>${f.manga ? "D'après le manga" : "Aussi en manga"}</small><b>${esc(titreS(m))}</b>${ser.length > 1 ? `<span class="yt-n" style="display:block;margin-top:4px">Avec ${esc(ser.slice(1).map(titreS).join(", "))}</span>` : ""}</div>${mLien ? `<span class="btn b">Voir la fiche du manga${ARR}</span>` : `<span class="yt-n">Fiche du manga bientôt en ligne</span>`}</${mLien ? "a" : "div"}>` : ""}
  ${saga.length > 1 ? `<section class="saga"><div class="sh2"><h2>Toute la saga</h2><span>Dans l'ordre de sortie</span></div><div class="grid">${saga.map(x => card(x, x.slug === f.slug)).join("")}</div></section>` : ""}`;
}

function render() {
  if (!slug) return liste();
  const f = DATA.items.find(x => x.slug === slug);
  if (!f) { app.innerHTML = `<p class="empty">Fiche introuvable. <a href="/films/">Voir tous les films</a></p>`; return; }
  fiche(f);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-type]"); if (t) { TYPE = t.dataset.type; liste(); return; }
  const s = e.target.closest("[data-tri]"); if (s) { TRI = s.dataset.tri; liste(); return; }
  // Bande-annonce : le lecteur YouTube ne se charge qu'avec l'accord pour ses cookies (voir site/header.js).
  const ok = e.target.closest("[data-ok]");
  if (ok) { window.FG_CONSENT && FG_CONSENT.accepter(); jouer(ok.closest(".yt")); return; }
  const y = e.target.closest(".yt[data-yt]");
  if (y && !e.target.closest(".yt-ask")) {
    if (window.FG_CONSENT && !FG_CONSENT.video()) {
      if (!y.querySelector(".yt-ask")) y.insertAdjacentHTML("beforeend", `<span class="yt-ask">Cette bande-annonce est hébergée par YouTube, qui dépose ses propres cookies.<span><button type="button" class="btn b" data-ok>Accepter et lire</button> <a class="btn" href="https://www.youtube.com/watch?v=${y.dataset.yt}" target="_blank" rel="noopener">Ouvrir sur YouTube${OUT}</a></span></span>`);
      return;
    }
    jouer(y);
  }
});
document.addEventListener("keydown", e => { const y = e.target.closest && e.target.closest(".yt[data-yt]"); if (y && (e.key === "Enter" || e.key === " ") && e.target === y) { e.preventDefault(); y.click(); } });
function jouer(y) {
  if (!y || !y.dataset.yt) return;
  y.innerHTML = `<iframe src="https://www.youtube.com/embed/${y.dataset.yt}?autoplay=1&playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Bande-annonce"></iframe>`;
  y.removeAttribute("data-yt");
}

fetch("/api/films").then(r => r.json()).then(j => {
  if (!j || !j.items) throw new Error(j && j.error || "vide");
  DATA = j; render();
}).catch(() => { app.innerHTML = `<p class="empty">Impossible de charger les films pour l'instant.</p>`; });
</script>
</body>
</html>
