<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lecture · FuryoGang</title>
<style>
/* Lecture traduite de Will (02/11/2026) : chapitres de manga traduits par Claude, page par page.
   Privé, admin seulement (functions/_middleware.js), jamais indexé. Données et planches : R2 « prive/lecture/ » via /api/admin/prive.
   « ＋ Carnet » ajoute au carnet /flashcard : le mot, ses kanji ou la phrase entière ; la phrase et la planche restent toujours jointes. */

:root{--bg:#1c1c1f;--card:#000;--card2:#2a2a2e;--line:#2f2f33;--txt:#f5f5f5;--mut:#a0a0a6;--red:#e0182f;--yel:#f5b82e;--blue:#2f7cf6;--green:#5cc98a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;line-height:1.5}
button,select{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.jp{font-family:"FGJP",sans-serif}
header{position:sticky;top:0;z-index:10;background:#18181b;border-bottom:1px solid var(--line)}
.hw{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:"FGAntonio";font-size:30px;font-weight:700;line-height:1}
.brand span{color:var(--red)}
.ttl{display:flex;flex-direction:column;line-height:1.2}
.ttl b{font-size:15px}.ttl small{color:var(--mut);font-size:12px}
.sp{flex:1}
select{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14px}
.tg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.tg button{padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;color:#bbb}
.tg button.on{background:#f5f5f5;color:#111}
.strip{max-width:1500px;margin:0 auto;padding:0 20px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.strip button{flex:none;min-width:38px;height:32px;border-radius:8px;background:var(--card2);font-size:13px;font-weight:600;color:#ccc}
.strip button.on{background:var(--red);color:#fff}
.strip button.has{box-shadow:inset 0 -3px 0 var(--yel)}
main{max-width:1500px;margin:0 auto;padding:20px 20px 110px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.pic{position:sticky;top:120px;background:#000;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pic img{width:100%;max-height:calc(100vh - 210px);object-fit:contain;border-radius:10px;background:#fff;cursor:zoom-in}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav button{background:var(--card2);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
.nav button:disabled{opacity:.35;cursor:default}
.nav .pn{font-family:"FGAntonio";font-size:30px}
.side{display:flex;flex-direction:column;gap:14px}
.resume{background:var(--card);border-radius:18px;padding:16px 20px;font-size:15px;color:#ddd}
.resume b{display:block;font-family:"FGAntonio";font-size:26px;font-weight:400;color:var(--txt);margin-bottom:4px}
.b{background:var(--card);border-radius:18px;padding:14px 18px;display:grid;grid-template-columns:110px 1fr;gap:4px 16px}
.b .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--yel);padding-top:3px}
.b .who.Narration{color:#9fb7ff}.b .who.SFX{color:#a0a0a6}.b .who.Décor,.b .who.Marge{color:#8fd1a8}
.b .fr{font-size:17px;font-weight:600}
.b .jpl{grid-column:2;font-family:"FGJP";font-size:18px;color:#f0f0f0}
.b .kn{grid-column:2;font-family:"FGJP";font-size:14px;color:var(--mut)}
.b .nt{grid-column:2;font-size:13px;color:var(--yel);margin-top:4px}
.b.sfx{padding:10px 18px}.b.sfx .fr{font-size:15px;font-weight:500;color:#ccc}
body.nojp .jpl,body.nokana .kn{display:none}
.lx{background:#120f05;border-radius:18px;padding:16px 18px}
.lx h3{font-family:"FGAntonio";font-size:26px;font-weight:400;margin-bottom:8px}
.lx h3 small{font-family:Inter;font-size:12px;color:var(--mut);margin-left:8px;letter-spacing:.02em}
.lxi{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid #2a2310}
.lxi:first-of-type{border-top:0}
.lxi input{width:20px;height:20px;accent-color:var(--yel);margin-top:4px}
.lxi .m{font-family:"FGJP";font-size:20px;font-weight:700}
.lxi .m small{font-size:13px;font-weight:400;color:var(--mut);margin-left:8px}
.lxi .s{grid-column:2;font-size:14px}
.lxi .w{grid-column:2;font-size:12px;color:var(--mut)}
.ty{display:inline-block;font-family:Inter;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--yel);color:#111;border-radius:5px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.add{grid-column:2;justify-self:start;margin-top:6px;font-size:12px;font-weight:700;color:#9fb7ff;background:#1b2234;border-radius:8px;padding:6px 10px}
.add.on{background:#9fb7ff;color:#111}
.lxi .add{grid-column:2}
.ask{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ask h3{font-family:"FGAntonio";font-size:26px;font-weight:400}
.ask h3 small{font-family:Inter;font-size:12px;color:var(--mut);margin-left:8px}
.ask textarea{background:var(--card2);border:0;border-radius:12px;padding:12px;color:var(--txt);font:inherit;font-size:15px;min-height:80px;resize:vertical}
.ask .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ask button{background:var(--blue);color:#fff;font-weight:700;border-radius:11px;padding:10px 16px;font-size:14px}
.ask .sent{font-size:13px;color:var(--green)}
.qs{display:flex;flex-direction:column;gap:6px}
.qs div{font-size:13px;color:#ccc;background:#141416;border-radius:10px;padding:8px 10px}
.sync{width:9px;height:9px;border-radius:50%;background:#666;display:inline-block;margin-right:6px}
.sync.ok{background:var(--green)}
.dock{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:flex;gap:8px;align-items:center;background:#000;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dock span{font-size:13px;color:#ccc}
.dock button{background:var(--yel);color:#111;font-weight:700;border-radius:11px;padding:9px 14px;font-size:14px}
.dock button.ok{background:var(--green)}
.empty{color:var(--mut);padding:30px;text-align:center;background:var(--card);border-radius:18px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:50;overflow:auto}
.lb.on{display:block}
.lb img{display:block;margin:0 auto;max-width:min(1100px,100%);cursor:zoom-out}
@media (max-width:900px){
 main{grid-template-columns:1fr;padding:12px}
 .pic{position:static}
 .pic img{max-height:none}
 .b{grid-template-columns:1fr}.b .jpl,.b .kn,.b .nt{grid-column:1}
 .brand{font-size:28px}
 .dock{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px 6px 6px 12px;border-radius:14px}.dock span{font-size:11px;flex:1}.dock button{padding:8px 10px;font-size:12px}
}

@font-face{font-family:"FGAntonio";src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:"FGJP";src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"FGInter";src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
body{font-family:"FGInter",system-ui,sans-serif}
.brand a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.lib{max-width:900px;margin:0 auto;padding:22px 18px 80px;display:flex;flex-direction:column;gap:14px}
.lib h1{font:700 40px/1.1 "FGAntonio";text-transform:uppercase;margin:0}
.lib .sub{color:var(--mut);font-size:14px;margin:0}
.serie{background:var(--card);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.serie h2{margin:0;font-size:20px}.serie .jp{color:var(--mut);font-size:14px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chaps a{background:var(--card2);border-radius:14px;padding:14px;text-decoration:none;color:var(--txt);display:flex;flex-direction:column;gap:2px}
.chaps a b{font:700 22px/1 "FGAntonio";text-transform:uppercase}.chaps a span{font-size:12px;color:var(--mut)}
.chaps a.fin{opacity:.6}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{background:var(--card2);border-radius:12px;padding:10px 14px;color:var(--txt);text-decoration:none;font-size:14px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sh{background:#141416;border-radius:22px 22px 0 0;width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.sh h3{margin:0;font:700 26px/1 "FGAntonio";text-transform:uppercase}
.sh .bub{background:#000;border-radius:14px;padding:12px 14px}
.sh .bub .j{font-family:"FGJP";font-size:20px}.sh .bub .r{font-family:"FGJP";font-size:13px;color:var(--mut)}.sh .bub .f{font-size:14px}
.sh .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--card2);border-radius:10px;padding:7px 11px;font-family:"FGJP";font-size:18px;font-weight:700}
.chips button.on{background:var(--red);color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts button{background:var(--card2);border-radius:14px;min-height:62px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opts button b{font-size:15px}.opts button span{font-size:11px;color:var(--mut)}
.opts button.on{background:#f5f5f5;color:#111}.opts button.on span{color:#444}
.opts button:disabled{opacity:.35}
.sh input{background:var(--card2);border:0;border-radius:12px;padding:12px;color:var(--txt);font-family:"FGJP";font-size:20px;width:100%;outline:none}
.prev{background:#000;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.prev .t{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--red)}
.prev .k{font-family:"FGJP";font-weight:900;font-size:30px;line-height:1.3}
.prev small{color:var(--mut);font-size:12px}
.sh .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
.sh .row2 button{height:52px;border-radius:14px;font-weight:700;font-size:15px;background:var(--card2)}
.sh .row2 button.go{background:#f5f5f5;color:#111}
</style>
</head>
<body>
<div id="libv" class="lib"><p class="sub">Chargement…</p></div>
<div id="readv" hidden>
<header>
 <div class="hw">
  <div class="brand"><a href="/lecture/">FURYO <span>GANG</span></a></div>
  <div class="ttl"><b class="jp" id="stitle"></b><small id="ssub"></small></div>
  <div class="sp"></div>
  <select id="ch" aria-label="Chapitre"></select>
  <div class="tg" aria-label="Affichage"><button id="tjp" class="on">日本語</button><button id="tkn" class="on">かな</button></div>
 </div>
 <div class="strip" id="strip"></div>
</header>
<main>
 <div class="pic">
  <img id="img" alt="Planche">
  <div class="nav"><button id="prev">← Précédente</button><span class="pn" id="pn"></span><button id="next">Suivante →</button></div>
 </div>
 <div class="side" id="side"></div>
</main>
<div class="dock" id="dock"><span id="dcount"></span><button id="copy">Copier mes choix</button></div>
</div>
<div class="lb" id="lb"><img id="lbi" alt=""></div>
<div class="sheet" id="sheet" hidden><div class="sh" id="sh" role="dialog" aria-label="Ajouter au carnet"></div></div>
<script src="/lecture/lecture.js?v=1"></script>
</body>
</html>
