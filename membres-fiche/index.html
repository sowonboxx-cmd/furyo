<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membre · Communauté FuryoGang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--blue:#4C9BFF;--gold:#F2B33D;--red:#E54839;--ok:#7BC67E}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 64px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--ink-2)}
.hero img,.hero .ph{width:76px;height:76px;border-radius:50%;flex:none;background:var(--ink-3)}
.hero h1{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:34px;line-height:1;margin:0 0 6px}
.role{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--ink-3);color:var(--paper-2)}
.role.admin{background:var(--blue);color:#fff}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:28px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--ink-2);border-radius:16px;padding:14px;text-align:center}
.stats b{display:block;font-family:Antonio,sans-serif;font-size:30px;line-height:1.1}
.stats span{font-size:12px;color:var(--paper-3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{background:var(--ink-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bd i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.bd b{font-size:14px}.bd small{color:var(--paper-3);font-size:12px}
.bd.off{opacity:.42}
.bd svg{width:22px;height:22px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.acts a,.acts button{height:46px;border-radius:23px;border:0;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.acts a{background:#305887;color:#fff}.acts button{background:var(--ink-3);color:var(--paper)}
.since{color:var(--paper-3);font-size:12.5px;margin-top:6px}
.soc{display:flex;flex-direction:column;gap:10px;background:var(--ink-2);border-radius:16px;padding:14px}
.soc label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--paper-3)}
.soc input:not([type=checkbox]){height:44px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);font:inherit;font-size:15px;padding:0 14px;outline:none}
.soc .sw{flex-direction:row;align-items:center;gap:10px;color:var(--paper-2);font-size:14px}
.soc .sw input{width:20px;height:20px;accent-color:var(--blue)}
.soc button{height:44px;border:0;border-radius:22px;background:#305887;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.soc .msg{margin:0;font-size:13px;color:var(--ok);min-height:18px}
.soc .msg.err{color:var(--red)}
.soc .hint{font-size:12px;color:var(--paper-3);font-weight:500}
.soc .hint b{color:var(--paper-2)}
.acts a.sec{background:var(--ink-3);color:var(--paper)}
.empty{color:var(--paper-3);text-align:center;margin-top:18vh}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links span{height:40px;padding:0 16px;border-radius:20px;background:var(--ink-2);color:var(--paper);text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.adm{background:var(--ink-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.adm p{margin:0;font-size:12.5px;color:var(--paper-3)}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg button{height:36px;padding:0 14px 0 10px;border-radius:18px;border:1.5px solid var(--ink-3);background:transparent;color:var(--paper-2);font:inherit;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tg button svg{width:17px;height:17px}
.tg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.tg button:disabled{cursor:default;opacity:.75}
.adm label{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--paper-2)}
.adm input{width:110px;height:40px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);font:inherit;padding:0 12px;outline:none}
.adm .save{height:44px;border:0;border-radius:22px;background:#305887;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.adm .msg{min-height:18px;font-size:13px;color:var(--ok)}.adm .msg.err{color:var(--red)}
.lock{max-width:420px;margin:10vh auto 0;text-align:center;background:var(--ink-2);border-radius:22px;padding:28px 22px}
.lock i{width:56px;height:56px;border-radius:16px;background:#4C9BFF26;color:#4C9BFF;display:inline-grid;place-items:center;margin-bottom:12px}
.lock i svg{width:26px;height:26px}
.lock h2{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:30px;margin:0 0 8px;letter-spacing:0;color:var(--paper)}
.lock p{margin:0 0 18px;color:var(--paper-2);font-size:14.5px;line-height:1.5}
.lock b.n{color:var(--paper);font:inherit;font-weight:700}
.lock button{width:100%;height:46px;border:0;border-radius:23px;background:#305887;color:#fff;font:inherit;font-weight:700;cursor:pointer}
/* Page d'un membre (Communauté, Will 07/10/2026) */
.pf{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.pf .avt{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--ink-3);display:grid;place-items:center;font:800 30px Inter,sans-serif;color:#111}
.pf h1{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:32px;line-height:1;margin:6px 0 0;display:flex;align-items:center;gap:8px}
.pf .crn{display:block;margin-bottom:0;position:relative;z-index:1}.pf .crn svg{width:44px;height:32px;color:var(--gold);display:block}
.pf .meta{color:var(--paper-3);font-size:13px}
.pf .fbtn{height:38px;padding:0 24px;border-radius:19px;border:0;background:var(--paper);color:#111;font:700 14px Inter,sans-serif;cursor:pointer;margin-top:6px}
.pf .fbtn[aria-pressed=true]{background:var(--ink-3);color:var(--paper-2)}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.st4 div{background:var(--ink-2);border-radius:16px;padding:12px 4px;text-align:center}
.st4 b{display:block;font-family:Antonio,sans-serif;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.st4 span{font-size:11.5px;color:var(--paper-3)}
.covs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.covs a{display:block;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--ink-3);max-width:100%}
.covs img{width:100%;height:100%;object-fit:cover;display:block}
.actl{background:var(--ink-2);border-radius:16px;padding:4px 14px}
.act{display:flex;gap:10px;align-items:flex-start;padding:11px 0;font-size:14px;line-height:1.4}
.act+.act{border-top:1px solid #1C1C1E}
.act i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;font-style:normal;font-weight:800;font-size:14px}
.act a{color:var(--paper);font-weight:700;text-decoration:none}
.act small{display:block;color:var(--paper-3);font-size:12px;margin-top:2px}
.vid{color:var(--paper-3);font-size:14px;background:var(--ink-2);border-radius:16px;padding:16px;text-align:center}
.h2r{display:flex;justify-content:space-between;align-items:baseline}.h2r a{font-size:12.5px;color:var(--paper-3);text-decoration:none;font-weight:600;text-transform:none;letter-spacing:0}
/* Mise en page D1 (Will, 07/10/2026) : carte de profil à gauche, collection / activité / badges à droite, tout encadré en noir */
main{max-width:1240px;padding-left:20px;padding-right:20px}
.d1{display:flex;flex-direction:column;gap:14px}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.duo2{display:flex;flex-direction:column;gap:14px}
.card,.pcard{background:var(--ink-2);border-radius:22px;padding:18px}
.pcard{padding:24px 18px}
.pbad{margin-top:18px;padding-top:16px;border-top:1px solid #1C1C1E}.pbad h2{margin:0 0 10px;font-size:12px;letter-spacing:.1em;color:var(--paper-3)}.pbad .links{justify-content:flex-start}.pbad .links a,.pbad .links span{background:#1C1C1E}
.card h2{margin:0 0 12px;font-family:Antonio,sans-serif;font-size:20px;letter-spacing:0;color:var(--paper)}
.card .h2r a{font-family:Inter,sans-serif}
.st4{grid-template-columns:1fr 1fr!important;margin-top:16px!important}
.st4 div{background:#1C1C1E!important;padding:14px 6px!important}
.st4 b{font-size:32px!important}
.st4 span{font-size:11px!important;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.covs{grid-template-columns:repeat(4,1fr)!important;gap:12px!important}
.covs a.cv{display:flex;flex-direction:column;gap:6px;min-width:0;color:var(--paper);text-decoration:none;aspect-ratio:auto;overflow:visible;background:none;border-radius:0}
.cv i{display:block;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--ink-3);position:relative;max-width:100%}
.cv i img{width:100%;height:100%;object-fit:cover;display:block}
.cv i em{position:absolute;right:6px;bottom:6px;font:700 11px Inter,sans-serif;font-style:normal;background:rgba(0,0,0,.78);color:#fff;padding:2px 7px;border-radius:8px}
.cv b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actl{background:transparent!important;padding:0!important}
.card .vid{background:#1C1C1E}
.card .badges{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.card .bd{background:#1C1C1E}
.card .links a,.card .links span{background:#1C1C1E}
.adm{padding:0!important}
/* Badges en petites pastilles, explication au survol (Will, 07/10/2026) */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 8px;border-radius:15px;background:color-mix(in srgb,var(--c) 18%,#000);color:var(--c);font:700 12.5px Inter,sans-serif;cursor:default;outline:none}
.pill svg{width:15px;height:15px}
.pill .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:220px;background:#F5F5F7;color:#111;font:600 12px/1.4 Inter,sans-serif;padding:7px 10px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;text-align:center}
.pill:hover .tip,.pill:focus .tip{opacity:1}
.acts{margin-top:0!important}
@media (min-width:980px){
  .d1{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
  .pcard{position:sticky;top:84px}
  .pcard .pills{justify-content:flex-start}
  .covs{grid-template-columns:repeat(6,1fr)!important}
  .duo2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
}
</style>
</head>
<body>
<script src="/site/header.js?v=36"></script>
<script src="/site/badges.js?v=1"></script>
<main id="app"><p class="empty">Chargement…</p></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dl = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
// Profil public : seulement les badges obtenus, et les réseaux si le membre les a rendus publics.
// Un admin voit en plus « Gérer les badges » : il coche / décoche les badges du membre et ajuste ses points.
// Il faut être membre pour voir les membres.
const LOCK_ICO = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V8a3 3 0 0 0-6 0z"/></svg>`;
const verrou = (total) => `<div class="lock"><i>${LOCK_ICO}</i><h2>Réservé aux membres</h2><p>Pour voir les membres, il faut être membre.${total ? ` Déjà <b class="n">${total}</b> inscrit${total > 1 ? "s" : ""} dans la famille FuryoGang.` : ""}<br>Connecte-toi en un clic avec Google, c'est gratuit.</p><button type="button" onclick="window.FG_LOGIN && FG_LOGIN()">Se connecter / s'inscrire</button></div>`;
const app = document.getElementById("app");
let M, CAT = [], ADMIN = false, PF = null, NEWS = {}, SER = {};
const CROWN = '<svg viewBox="0 0 24 18" fill="currentColor" aria-hidden="true"><path d="M2 5l5 4 5-7 5 7 5-4-2 11H4z"/></svg>';
const slugN = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const quand = d => { if (!d) return ""; const m = (Date.now() - new Date(d)) / 6e4; return m < 60 ? `il y a ${Math.max(1, Math.round(m))} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : m < 2880 ? "hier" : `il y a ${Math.round(m / 1440)} jours`; };
function activite(l) {
  if (!l || !l.length) return `<p class="vid">Pas encore d'activité.</p>`;
  return `<div class="actl">${l.slice(0, 6).map(a => {
    const n = NEWS[a.id], titreN = n ? esc(n.fr || n.titre) : "une news", lienN = n ? "/actus/" + slugN(n.fr || n.titre) + "-" + String(n.id).slice(-8) : "#";
    if (a.k === "c") return `<div class="act"><i style="background:#7FA7C926;color:#7FA7C9">“</i><div>A commenté <a href="${lienN}">${titreN}</a><small>« ${esc(a.t)} » · ${quand(a.d)}</small></div></div>`;
    if (a.k === "l") return `<div class="act"><i style="background:#E5483A26;color:#E5483A">♥</i><div>A aimé <a href="${lienN}">${titreN}</a><small>${quand(a.d)}</small></div></div>`;
    const s = SER[a.s];
    return `<div class="act"><i style="background:#7BC67E26;color:#7BC67E">+</i><div>A ajouté ${a.n} tome${a.n > 1 ? "s" : ""} de ${s ? `<a href="${s.fiche && s.slug ? "/series/" + esc(s.slug) : "#"}">${esc(s.fr || s.t)}</a>` : "une série"} à sa collection<small>${quand(a.d)}</small></div></div>`;
  }).join("")}</div>`;
}
function draw() {
  const m = M, r = m.reseaux || {}, estAdmin = m.badges.some(b => b.r === "admin");
  const liens = [r.instagram && `<a href="https://instagram.com/${esc(r.instagram)}" target="_blank" rel="noopener">Instagram · @${esc(r.instagram)}</a>`,
    r.x && `<a href="https://x.com/${esc(r.x)}" target="_blank" rel="noopener">X · @${esc(r.x)}</a>`,
    r.discord && `<span>Discord · ${esc(r.discord)}</span>`].filter(Boolean);
  const ont = new Set(m.badges.map(b => b.id)), fixes = new Set(m.badges.filter(b => b.fixe).map(b => b.id));
  const P = PF || {}, rang1 = P.rang === 1;
  const avt = m.photo ? `<img class="avt" src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="avt" style="background:#F2B33D">${esc((m.pseudo || "?")[0].toUpperCase())}</span>`;
  const covs = P.recents && P.recents.length ? `<div class="covs">${P.recents.map(t => `<a class="cv" href="${t.slug ? "/series/" + esc(t.slug) : "#"}" title="${esc((t.titre || "") + (t.seul ? " · tome " + t.n : " · " + t.nb + " tome" + (t.nb > 1 ? "s" : "")))}"><i>${t.cover ? `<img src="/api/couv?w=300&u=${encodeURIComponent(t.cover)}" alt="" loading="lazy">` : ""}<em>${t.seul ? "T." + t.n : t.nb}</em></i><b>${esc(t.titre || "")}</b></a>`).join("")}</div>` : `<p class="vid">Pas encore de tomes dans sa collection.</p>`;
  const stats = [[P.tot, "Tomes", "var(--paper)"], [P.fr, "FR", "#4C7BD9"], [P.jp, "JP", "var(--red)"], [P.abonnes, "Abonné" + (P.abonnes > 1 ? "s" : ""), "var(--gold)"]];
  app.innerHTML = `<div class="d1">
    <aside class="pcard"><section class="pf">${rang1 ? `<span class="crn">${CROWN}</span>` : ""}${avt}<h1>${esc(m.pseudo || "Membre")}</h1>
      <span class="meta">Membre n°${m.num || "?"}${P.rang ? ` · ${P.rang === 1 ? "1er" : P.rang + "e"} du classement` : ""}${estAdmin ? " · Administrateur" : ""}</span>
      ${PF && !P.moi ? `<button class="fbtn" id="suivre" aria-pressed="${!!P.on}">${P.on ? "Suivi" : "Suivre"}</button>` : ""}</section>
      ${PF ? `<div class="st4">${stats.map(([n, l, c]) => `<div><b style="color:${c}">${n}</b><span>${l}</span></div>`).join("")}</div>` : ""}
      <div class="pbad"><h2>Badges</h2>${m.badges.length ? `<div class="pills">${m.badges.map(b => `<span class="pill" tabindex="0" style="--c:${b.c}">${FG_BADGES.icone(b)}${esc(b.n)}${b.d ? `<span class="tip">${esc(b.d)}</span>` : ""}</span>`).join("")}</div>` : `<p class="vid">Pas encore de badge.</p>`}</div>
      ${liens.length ? `<div class="pbad"><h2>Réseaux</h2><div class="links">${liens.join("")}</div></div>` : ""}</aside>
    <div class="rcol">
      ${PF ? `<section class="card"><h2 class="h2r">Collection<a href="${P.moi ? "/ma-collection/" : "#"}">${P.series} série${P.series > 1 ? "s" : ""}${P.moi ? " · Ma collection →" : ""}</a></h2>${covs}</section>` : ""}
      ${PF ? `<section class="card"><h2>Activité</h2>${activite(P.activite)}</section>` : ""}
      ${ADMIN ? `<section class="card"><h2>Gérer les badges · admin</h2>
      <form class="adm" id="adm">
        <p>Touche un badge pour l'ajouter ou le retirer, puis enregistre. Les badges grisés sont automatiques. Donner « Administrateur » ouvre l'accès au back-office.</p>
        <div class="tg">${CAT.map(b => { const on = ont.has(b.id), auto = b.r === "cent" || fixes.has(b.id);
          return `<button type="button" data-b="${b.id}" aria-pressed="${on}" ${auto ? "disabled" : ""} style="${on ? `background:${b.c}` : ""}" title="${esc(b.d)}">${FG_BADGES.icone(b)}${esc(b.n)}${auto ? " · auto" : ""}</button>`; }).join("")}</div>
        <label>Points <input type="number" name="points" min="0" step="1" value="${m.points}"></label>
        <button class="save">Enregistrer</button><div class="msg" id="amsg"></div>
      </form></section>` : ""}
      <div class="acts"><a href="/communaute/" class="sec">Voir toute la communauté</a></div>
    </div></div>`;
  const sb = document.getElementById("suivre");
  if (sb) sb.onclick = async () => { sb.disabled = true; const r = await fetch("/api/communaute", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ suivre: M.id }) }).then(x => x.json()).catch(() => ({})); if (r.ok) { PF.on = r.on; PF.abonnes = r.abonnes; draw(); } else sb.disabled = false; };
  if (!ADMIN) return;
  const f = document.getElementById("adm");
  f.querySelectorAll("[data-b]").forEach(bt => bt.onclick = () => {
    const on = bt.getAttribute("aria-pressed") !== "true", b = CAT.find(x => x.id === bt.dataset.b);
    bt.setAttribute("aria-pressed", on); bt.style.background = on ? b.c : "";
  });
  f.onsubmit = async e => { e.preventDefault(); const msg = document.getElementById("amsg"); msg.className = "msg"; msg.textContent = "Enregistrement…";
    // On n'envoie que les badges attribués à la main (les automatiques restent).
    const badges = [...f.querySelectorAll("[data-b]:not(:disabled)")].filter(x => x.getAttribute("aria-pressed") === "true").map(x => x.dataset.b);
    const x = await fetch("/api/admin/membre", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: M.id, badges, points: f.points.value }) }).catch(() => null);
    const k = x ? await x.json().catch(() => ({})) : {};
    if (!x || !x.ok) { msg.className = "msg err"; msg.textContent = k.error || "Erreur, réessaie."; return; }
    if (k.membre) M = { ...k.membre, reseaux: M.reseaux };
    draw(); const m2 = document.getElementById("amsg"); if (m2) m2.textContent = "Enregistré ✓";
  };
}
(async () => {
  const slug = decodeURIComponent(location.pathname.replace(/^\/(membres|communaute)\//, "").replace(/\/$/, ""));
  const [x, me] = await Promise.all([fetch("/api/membres?u=" + encodeURIComponent(slug)).catch(() => null), fetch("/api/auth/me").then(r => r.json()).catch(() => ({}))]);
  if (x && x.status === 401) { const t = await fetch("/api/membres").then(r => r.json()).catch(() => ({})); app.innerHTML = verrou(t.total); return; }
  const j = x && x.ok ? await x.json() : null;
  if (!j || !j.membre) { document.title = "Membre introuvable · FuryoGang"; app.innerHTML = `<p class="empty">Ce membre n'existe pas (ou a changé de pseudo).<br><br><a href="/communaute/" style="color:var(--blue)">Voir la communauté</a></p>`; return; }
  M = j.membre; CAT = j.catalogue || []; ADMIN = !!me.admin;
  document.title = `${M.pseudo} · Communauté FuryoGang`;
  draw();
  // Chiffres, collection et activité (Communauté), puis titres des news et des séries citées.
  const pf = await fetch("/api/communaute?id=" + M.id + "&s=" + encodeURIComponent(M.slug || "")).then(r => r.ok ? r.json() : null).catch(() => null);
  if (pf && pf.ok) { PF = pf; draw();
    const [nw, bb] = await Promise.all([
      pf.activite.some(a => a.k !== "a") ? fetch("/api/news?v=8").then(r => r.json()).catch(() => ({})) : {},
      pf.activite.some(a => a.k === "a") ? fetch("/api/biblio").then(r => r.json()).catch(() => ({})) : {}]);
    (nw.items || []).forEach(n => NEWS[n.id] = n); (bb.items || []).forEach(x => SER[x.id] = x);
    draw(); }
})();
</script>
</body>
</html>
