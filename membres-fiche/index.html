<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Membre · FuryoGang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--blue:#4C9BFF;--gold:#F2B33D;--red:#E54839;--ok:#7BC67E}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:22px 16px 64px}
.hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;background:var(--ink-2)}
.hero img,.hero .ph{width:76px;height:76px;border-radius:50%;flex:none;background:var(--ink-3)}
.hero h1{font-family:Antonio,sans-serif;text-transform:uppercase;font-size:34px;line-height:1;margin:0 0 6px}
.role{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--ink-3);color:var(--paper-2)}
.role.admin{background:var(--blue);color:#fff}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:28px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:var(--ink-2);border-radius:16px;padding:14px;text-align:center}
.stats b{display:block;font-family:Antonio,sans-serif;font-size:30px;line-height:1.1}
.stats span{font-size:12px;color:var(--paper-3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{background:var(--ink-2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bd i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.bd b{font-size:14px}.bd small{color:var(--paper-3);font-size:12px}
.bd.off{opacity:.42}
.bd svg{width:22px;height:22px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.acts a,.acts button{height:46px;border-radius:23px;border:0;font:inherit;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.acts a{background:var(--blue);color:#fff}.acts button{background:var(--ink-3);color:var(--paper)}
.since{color:var(--paper-3);font-size:12.5px;margin-top:6px}
.soc{display:flex;flex-direction:column;gap:10px;background:var(--ink-2);border-radius:16px;padding:14px}
.soc label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--paper-3)}
.soc input:not([type=checkbox]){height:44px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);font:inherit;font-size:15px;padding:0 14px;outline:none}
.soc .sw{flex-direction:row;align-items:center;gap:10px;color:var(--paper-2);font-size:14px}
.soc .sw input{width:20px;height:20px;accent-color:var(--blue)}
.soc button{height:44px;border:0;border-radius:22px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.soc .msg{margin:0;font-size:13px;color:var(--ok);min-height:18px}
.soc .msg.err{color:var(--red)}
.soc .hint{font-size:12px;color:var(--paper-3);font-weight:500}
.soc .hint b{color:var(--paper-2)}
.acts a.sec{background:var(--ink-3);color:var(--paper)}
.empty{color:var(--paper-3);text-align:center;margin-top:18vh}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.links span{height:40px;padding:0 16px;border-radius:20px;background:var(--ink-2);color:var(--paper);text-decoration:none;font-weight:600;font-size:14px;display:inline-flex;align-items:center}
</style>
</head>
<body>
<script src="/site/header.js?v=7"></script>
<main id="app"><p class="empty">Chargement…</p></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = {
  admin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg>`,
  fond: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>`,
  don: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5S3 15 3 8.8C3 6 5.1 4 7.7 4c1.8 0 3.3 1 4.3 2.4C13 5 14.5 4 16.3 4 18.9 4 21 6 21 8.8 21 15 12 20.5 12 20.5z"/></svg>`,
  contrib: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>`,
  lecteur: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>`,
};
// Badges (voir badges.md). Administrateur et Fondateur (100 premiers) sont automatiques ; Will ajoute les autres dans Notion.
const BADGES = {
  "Administrateur": ["admin", "Gère FuryoGang", "#4C9BFF"],
  "Fondateur": ["fond", "Parmi les 100 premiers inscrits", "#F2B33D"],
  "Ancien": ["fond", "Là depuis le début", "#E0955F"],
  "Ami": ["don", "Ami de la maison", "#F08AC0"],
  "Donateur": ["don", "Soutient le site", "#E54839"],
  "Contributeur": ["contrib", "Aide à enrichir les fiches", "#7BC67E"],
  "Modérateur": ["admin", "Veille sur la communauté", "#B38CFF"],
};
const badge = (n, on = true) => { const [ic, d, c] = BADGES[n] || ["fond", "", "#98989D"]; return `<div class="bd ${on ? "" : "off"}"><i style="background:${c}22;color:${c}">${I[ic]}</i><b>${esc(n)}</b><small>${d}${on ? "" : " · pas encore"}</small></div>`; };
const dl = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
// Profil public : seulement les badges obtenus, et les réseaux si le membre les a rendus publics.
(async () => {
  const app = document.getElementById("app");
  const slug = decodeURIComponent(location.pathname.replace(/^\/membres\//, "").replace(/\/$/, ""));
  const x = await fetch("/api/membres?u=" + encodeURIComponent(slug)).catch(() => null);
  const j = x && x.ok ? await x.json() : null, m = j && j.membre;
  if (!m) { document.title = "Membre introuvable · FuryoGang"; app.innerHTML = `<p class="empty">Ce membre n'existe pas (ou a changé de pseudo).<br><br><a href="/membres/" style="color:var(--blue)">Voir tous les membres</a></p>`; return; }
  document.title = `${m.pseudo} · Membres FuryoGang`;
  const r = m.reseaux || {}, admin = m.badges.includes("Administrateur");
  const liens = [r.instagram && `<a href="https://instagram.com/${esc(r.instagram)}" target="_blank" rel="noopener">Instagram · @${esc(r.instagram)}</a>`,
    r.x && `<a href="https://x.com/${esc(r.x)}" target="_blank" rel="noopener">X · @${esc(r.x)}</a>`,
    r.discord && `<span>Discord · ${esc(r.discord)}</span>`].filter(Boolean);
  app.innerHTML = `
    <section class="hero">${m.photo ? `<img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer">` : `<span class="ph"></span>`}
      <div><h1>${esc(m.pseudo || "Membre")}</h1><span class="role ${admin ? "admin" : ""}">${admin ? "Administrateur" : "Membre"} · n°${m.num || "?"}</span><div class="since">Inscrit le ${dl(m.inscrit)}</div></div></section>
    <h2>Classement</h2>
    <div class="stats"><div><b>${m.num || "—"}</b><span>N° de membre</span></div><div><b>${m.points}</b><span>Points</span></div><div><b>${m.badges.length}</b><span>Badges</span></div></div>
    ${m.badges.length ? `<h2>Badges</h2><div class="badges">${m.badges.map(n => badge(n)).join("")}</div>` : ""}
    ${liens.length ? `<h2>Réseaux</h2><div class="links">${liens.join("")}</div>` : ""}
    <div class="acts"><a href="/membres/" class="sec">Voir tous les membres</a></div>`;
})();
</script>
</body>
</html>
