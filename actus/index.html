.na-ht{bottom:4px;gap:9px}
.na-jp{font:500 13.5px "Noto Sans JP",sans-serif;color:#D8D8DC;margin-top:-3px}
.na-ht .na-meta{font:500 13.5px Inter,sans-serif;color:#8E8E93}
.na-body{gap:18px;padding:14px 18px 0}
.na-text{font-size:17px;line-height:1.55;font-weight:500;letter-spacing:-.005em;color:#F5F5F7}
.na-seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:#1C1C1E;border-radius:14px;overflow:hidden}
.na-seg>*{height:64px;border:0;background:none;color:#F5F5F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12.5px Inter,sans-serif;text-decoration:none;cursor:pointer;padding:0 4px}
.na-seg>*+*{border-left:1px solid #2C2C2E}.na-seg svg{width:19px;height:19px}.na-seg .p{color:#4C9BFF}.na-seg .on{color:#AEAEB2}
.na-srcs{background:#1C1C1E;border-radius:14px;overflow:hidden}
.na-srcs .h{padding:12px 14px 4px;font:600 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8E8E93}
.na-srcw{display:flex;flex-direction:column;gap:8px}.na-srch{padding:0 4px;font:600 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8E8E93}
.na-srcs img{width:22px;height:22px;border-radius:5px;flex:none;background:#2C2C2E}
.na-srcs a{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;color:#F5F5F7;text-decoration:none;font:600 14.5px/1.25 Inter,sans-serif}
.na-srcs a+a{border-top:1px solid #2C2C2E}
.na-srcs a span{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}.na-srcs small{font:500 13px Inter,sans-serif;color:#8E8E93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.na-srcs i{flex:none;width:30px;height:30px;border-radius:8px;background:#2C2C2E;display:grid;place-items:center;font:700 12.5px Inter,sans-serif;font-style:normal}.na-srcs i svg{width:14px;height:14px}
.na-srcs .arr{width:14px;height:14px;color:#8E8E93;flex:none}
.na-stc{background:#1C1C1E;border-radius:18px;padding:4px 16px}
.na-acts{color:#D8D8DC;font-size:15px}
.na-com{border-top:0;padding-top:4px}.na-com h2{font-size:24px}
.na-com p{font-size:15px;color:#D8D8DC}
.na-add{background:#1C1C1E;border:0;height:50px}
.na-ao .nd-box{background:#1C1C1E;border-radius:22px;padding:18px}
.na-ao .nd-bh h2{font-size:24px}
.na-ao .nd-o{border-top:1px solid #2C2C2E}.na-ao .nd-bh+.nd-o{border-top:0}
.na-ao .nd-o p{display:block;-webkit-line-clamp:unset;color:#D8D8DC}.na-ao .nd-o>span{max-height:none}
.na-ao .nd-more{background:#2C2C2E}
}
</style>

<body>
<script src="/site/header.js?v=42"></script>
<script src="/site/fit2.js?v=4"></script>
<main class="na" id="na"><p class="na-empty">Chargement…</p></main>
<script>if (window.FG_SK) document.getElementById("na").innerHTML = FG_SK.article();</script>
<script>
(function () {

  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var slug = function (t) { return String(t || "").replace(/œ/g, "oe").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60); };
  var couv = function (u, w) { return u ? (/^https?:/.test(u) ? "/api/couv?u=" + encodeURIComponent(u) + "&w=" + w : u) : ""; };
  var nf = function (n) { return n >= 1000 ? (n / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " k" : String(n || 0); };
  var I = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 9l5-5 5 5M5 20h14"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3 15 3 8.8C3 6 5.1 4 7.7 4c1.8 0 3.3 1 4.3 2.4C13 5 14.5 4 16.3 4 18.9 4 21 6 21 8.8 21 15 12 20.5 12 20.5z"/></svg>',
    com: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4A8 8 0 1 1 20 12z"/></svg>',
    stat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>',
    fiche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>'
  };
  var FOLLOW = false;
  var root = document.getElementById("na"), N = null, ME = null, ST = {}, CM = [], STORED = true, ALL = [], CTX = null;
  var DESK = matchMedia("(min-width:980px)");
  var key = (location.pathname.replace(/^\/actus\/?/, "").replace(/\/$/, "").split("-").pop() || new URLSearchParams(location.search).get("id") || "").toLowerCase();
  var get = function (u) { return fetch(u, { credentials: "same-origin" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
  var dLong = function (d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : ""; };
  var ago = function (d) { var m = Math.round((Date.now() - new Date(d)) / 6e4); return m < 60 ? Math.max(1, m) + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " j"; };
  var member = function () { return ME && ME.user; };

  function acts() {
    // Vues, likes et signet à gauche ; commentaires tout à droite (Will, 05/10/2026).
    return '<div class="na-acts" id="na-acts"><span aria-label="Vues">' + I.stat + "<b>" + nf(ST.v) + "</b></span>" +
      '<button type="button" class="a-like' + (ST.ml ? " on" : "") + '" data-act="like" aria-label="J\'aime">' + I.heart + "<b>" + nf(ST.l) + "</b></button>" +
      '<button type="button" class="a-book' + (ST.mb ? " on" : "") + '" data-act="bookmark" aria-label="Signet">' + I.book + "</button>" +
      '<button type="button" class="a-com" data-open aria-label="Commentaires">' + I.com + "<b>" + CM.length + "</b>" + (DESK.matches ? '<span class="lbl">' + (CM.length > 1 ? "commentaires" : "commentaire") + "</span>" : "") + "</button></div>";
  }
  // Avatar rond du membre (photo Google), ou son initiale si pas de photo.
  function av(c, cls) { return c.p ? '<img class="' + cls + '" src="' + esc(c.p) + '" alt="" referrerpolicy="no-referrer" loading="lazy">' : '<span class="' + cls + '">' + esc((c.n || "?").charAt(0).toUpperCase()) + "</span>"; }
  // Zone commentaires qui donne envie d'écrire : titre, derniers commentaires, puis un faux champ « Ajouter un commentaire… » (Will, 05/10/2026).
  function addBox() {
    var u = member() ? ME.user : null;
    return '<button type="button" class="na-add" data-open>' + (u ? av({ p: u.picture, n: u.name }, "na-av") : '<span class="na-av">' + I.com + "</span>") +
      "<span>" + (CM.length ? "Ajouter un commentaire…" : "Sois le premier à commenter…") + "</span><b>Publier</b></button>";
  }
  function preview() {
    if (!STORED) return '<section class="na-com"><h2>Commentaires</h2><p>Commentaires bientôt disponibles.</p></section>';
    return '<section class="na-com" aria-label="Commentaires"><h2>Commentaires' + (CM.length ? " · " + CM.length : "") + "</h2>" +
      CM.slice(-2).map(function (c) { return '<p class="na-cl">' + av(c, "na-av") + "<span><b>" + esc(c.n) + "</b> " + esc(c.t) + "</span></p>"; }).join("") +
      (CM.length > 2 ? '<button type="button" class="open" data-open>Afficher les ' + CM.length + " commentaires</button>" : "") + addBox() + "</section>";
  }
  // Vidéo YouTube jouée dans la page (trailer, PV d'anime…).
  function vid(u) {
    var m = String(u || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    return m ? '<div class="na-vid"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '" title="Vidéo de la news" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>' : "";
  }
  // Bloc « Sources » : une ligne par source, favicon + nom du site (x.com, youtube.com…) ; la vidéo de la news n'y est pas répétée (Will, 05/10/2026).
  function srcsM() {
    var L = (N.srcs && N.srcs.length ? N.srcs : (N.src ? [{ u: N.src }] : [])).map(function (x) {
      var host = ""; try { host = new URL(x.u).hostname.replace(/^www\./, "").replace(/^twitter\.com$/, "x.com"); } catch (e) {}
      return { u: x.u, h: host };
    }).filter(function (x) { return x.h; });
    if (!L.length) return "";
    // Test (Will, 06/10/2026) : le titre « Source » sort du bloc, posé sur le fond noir ; seules les sources sont dans le bloc gris.
    return '<div class="na-srcw"><div class="na-srch">' + (L.length > 1 ? "Sources · " + L.length : "Source") + '</div><div class="na-srcs">' + L.map(function (x) {
      return '<a href="' + esc(x.u) + '" target="_blank" rel="noopener"><img src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(x.h) + '&amp;sz=64" alt="" loading="lazy"><span>' + esc(x.h) + "</span>" + ARR + "</a>"; }).join("") + "</div></div>";
  }
  function render() {
    if (!N) return;
    if (DESK.matches) return renderD();
    root.classList.remove("nd");
    var cs = N.cats && N.cats.length ? N.cats : [{ nom: N.catNom || "News", c: N.catC || "#D4D4D8" }], titre = N.fr || N.titre;
    document.title = titre + " : " + (N.texte || "").slice(0, 60) + " | FuryoGang";
    root.innerHTML = '<div class="na-hero">' + (N.cover ? '<img src="' + esc(couv(N.cover, 1000)) + '" alt="Image de la news : ' + esc(titre) + '"' + (N.pos == null ? "" : ' style="object-position:center ' + N.pos + '%"') + '>' : "") +
      (N.cover && N.credit ? '<span class="cr" lang="' + (/^©[^ ]/.test(N.credit) ? "ja" : "fr") + '">' + esc(N.credit) + "</span>" : "") +
      '<div class="na-ht"><span class="na-pills">' + cs.map(function (c) { return '<span class="na-pill" style="background:' + c.c + '">' + esc(c.nom) + "</span>"; }).join("") + "</span><h1>" + esc(titre) + "</h1>" +
        (N.jp ? '<span class="na-jp" lang="ja">' + esc(N.jp) + "</span>" : "") + '<span class="na-meta">' + esc(dLong(N.date) || "") + "</span></div></div>" +
      // Page news mobile, maquette A validée par Will (05/10/2026) : fond noir, barre d'actions plate, bloc Sources, stats et autres actualités en blocs.
      '<div class="na-body"><p class="na-text">' + esc(N.texte) + "</p>" + vid(N.video) +
      '<div class="na-seg"><button type="button" class="' + (FOLLOW ? "on" : "") + '" data-soon="suivre">' + (FOLLOW ? HEART_ON + "Suivie" : I.heart + "Suivre") + "</button>" +
        '<a class="p" href="/series/' + esc(CTX && CTX.serie && CTX.serie.slug || slug(N.titre)) + '">' + I.fiche + "Voir la fiche</a>" +
        '<button type="button" data-soon="liste">' + I.book + "Ma liste</button></div>" +
      srcsM() + '<div class="na-stc">' + acts() + "</div>" + preview() + '<div class="na-ao">' + autres() + "</div></div>";
    if (window.FG_FIT2) FG_FIT2(root);
  }

  // ---------- Ordinateur ----------
  // Série suivie : discret, coche verte dans un rond (Will, 05/10/2026).
  // Série suivie : le même cœur, rempli en rouge (Will, 05/10/2026).
  var HEART_ON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="#FF4D67" stroke="#FF4D67" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5S3 15 3 8.8C3 6 5.1 4 7.7 4c1.8 0 3.3 1 4.3 2.4C13 5 14.5 4 16.3 4 18.9 4 21 6 21 8.8 21 15 12 20.5 12 20.5z"/></svg>';
  var ARR = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16 16 8M9.5 8H16v6.5"/></svg>';
  var X_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8zm-1.1 16.2h1.7L7.4 4.7H5.6z"/></svg>';
  var MC = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  var dShort = function (d) { if (!d) return ""; var x = new Date(d + "T12:00:00"); return x.getDate() + " " + MC[x.getMonth()]; };
  var dDay = function (d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long" }) : ""; };
  // « 2026年No.45 » → « n°45 », « 2026年 10/16号 » → « 10/16 », sinon tel quel.
  // Dates naturelles : aujourd'hui, hier, avant-hier, puis la date (Will, 05/10/2026).
  var rel = function (d) { if (!d) return ""; var t = new Date(new Date().toLocaleDateString("sv") + "T12:00:00"), x = new Date(d + "T12:00:00"), k = Math.round((t - x) / 864e5); return k === 0 ? "Aujourd'hui" : k === 1 ? "Hier" : k === 2 ? "Avant-hier" : dLong(d); };
  var issue = function (v) { v = String(v || ""); var m = v.match(/No\.?\s*(\d+)/i) || v.match(/第?(\d+)号/); if (m) return "n°" + m[1]; m = v.match(/(\d+\/\d+)号/); return m ? m[1] : v; };
  var handle = function (u) { var m = String(u || "").match(/(?:x|twitter)\.com\/(?:#!\/)?@?([A-Za-z0-9_]{1,15})/); return m ? "@" + m[1] : ""; };
  function fiche() {
    var s = CTX && CTX.serie, d = CTX && CTX.dernier; if (!s) return "";
    var titre = s.fr || s.t, auteurs = [];
    [s.scen, s.dess].join(", ").replace(/\s*\([^)]*\)/g, "").split(/\s*,\s*/).forEach(function (a) { if (a && auteurs.indexOf(a) < 0) auteurs.push(a); });
    var suite = d && d.entry && d.entry.toLowerCase() !== String(s.t).toLowerCase() ? d.entry.replace(new RegExp("^" + String(s.t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*[-:–]\\s*", "i"), "") : "";
    var partie1 = /principale/i.test(s.relation || "") && (suite || (s.enCours && s.enCours.length));
    var rows = [["Mangaka", auteurs.join(", ")], ["Éditeur JP", [s.pubJP, s.mag].filter(Boolean).join(" · ")],
      ["Au Japon", suite ? "Suite en cours · " + suite : [s.stJP, s.volJP ? s.volJP + " tomes" : ""].filter(Boolean).join(" · ")],
      ["En France", s.pubFR ? s.pubFR + (s.volFR ? " · " + s.volFR + " tomes" : "") + (partie1 ? " (partie 1)" : "") : (s.stFR || "Inédit")],
      ["Anime", String(s.anime || "").replace(/\s*;\s*/g, " · ")]].filter(function (r) { return r[1]; });
    var img = s.cover || N.cover;
    return '<section class="nd-box"><div class="nd-bh"><h2>' + esc(titre) + "</h2></div>" +
      '<div class="nd-fc">' + (img ? '<img src="' + esc(couv(img, 300)) + '" alt="">' : '<span class="ph"></span>') + "<div>" +
      (s.genres && s.genres.length ? '<div class="nd-tags">' + s.genres.slice(0, 3).map(function (g) { return "<span>" + esc(g) + "</span>"; }).join("") + "</div>" : "") +
      (s.resume ? "<p>" + esc(s.resume) + "</p>" : "") + "</div></div>" +
      '<dl class="nd-dl">' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>" +
      (s.visible ? '<a class="nd-btn blue" href="/series/' + esc(s.slug) + '">Voir la fiche</a>' : '<span class="nd-btn blue off">Fiche bientôt en ligne</span>') +
      '<div class="nd-two"><button type="button" class="nd-btn' + (FOLLOW ? " on" : "") + '" data-soon="suivre">' + (FOLLOW ? HEART_ON + " Série suivie" : I.heart + " Suivre la série") + '</button><button type="button" class="nd-btn" data-soon="liste">' + I.book + " Ma liste</button></div></section>";
  }
  function dernier() {
    var d = CTX && CTX.dernier; if (!d) return "";
    var t = new Date().toLocaleDateString("sv"), lire = d.read || d.page;
    return '<section class="nd-box nd-live"><div class="nd-bh"><h2>Dernier chapitre</h2></div>' +
      '<div class="nd-lv">' + (d.cover ? '<img src="' + esc(couv(d.cover, 200)) + '" alt="Couverture ' + esc(d.mag) + '">' : '<span class="ph">WEB</span>') + '<div class="nd-lt">' +
      '<span class="nd-l1">' + (!d.date || d.date <= t ? "Sorti le " : "Sort le ") + esc(dDay(d.date)) + "</span>" +
      '<span class="nd-l2">' + esc(d.mag.replace(/\s*\(en ligne\)/i, "")) + (d.issue && !/\(en ligne\)/i.test(d.mag) ? " " + esc(issue(d.issue)) : "") + "</span>" +
      '<span class="nd-l3">' + esc(d.entry) + "</span>" +
      '<span class="nd-l4">' + (d.status === "Pause" ? "En pause dans ce numéro" : d.ch != null ? "Chapitre <b>" + esc(d.ch) + "</b>" : "") + (d.fin ? "<i>Fin</i>" : "") + "</span></div></div>" +
      (lire || d.link ? '<div class="nd-two">' + (lire ? '<a class="nd-btn blue" href="' + esc(lire) + '" target="_blank" rel="noopener">Lecture en ligne' + ARR + '</a>' : "") + (d.link ? '<a class="nd-btn" href="' + esc(d.link) + '" target="_blank" rel="noopener">Le magazine' + ARR + '</a>' : "") + "</div>" : "") + "</section>";
  }
  function mangakas() {
    var s = CTX && CTX.serie; if (!CTX) return "";
    var list = CTX.auteurs || [];
    return list.map(function (a, i) {
      var x = a.x || (i === 0 && s ? s.x : ""), xLabel = a.x ? "Compte officiel du mangaka" : "Compte officiel de la série";
      return '<section class="nd-box">' +
        '<a class="nd-mkh" href="/auteurs/' + esc(a.slug) + '">' + (a.photo ? '<img src="' + esc(a.photo) + '" alt="">' : '<i lang="ja">' + esc((a.jp || a.name).charAt(0)) + "</i>") + "<div><b>" + esc(a.name) + "</b>" + (a.jp ? '<small lang="ja">' + esc(a.jp) + "</small>" : "") + "</div></a>" +
        (x && handle(x) ? '<a class="nd-x" href="' + esc(x) + '" target="_blank" rel="noopener">' + X_ICON + "<span>" + esc(handle(x)) + "<small>" + xLabel + "</small></span></a>" : "") +
        (a.series && a.series.length ? '<div class="nd-mks">' + a.series.map(function (z) { var t = z.fr || z.t; return z.visible ? '<a href="/series/' + esc(z.slug) + '">' + esc(t) + "</a>" : "<span>" + esc(t) + "</span>"; }).join("") + "</div>" : "") +
        '<a class="nd-btn" href="/auteurs/' + esc(a.slug) + '">Voir la fiche mangaka</a></section>';
    }).join("");
  }
  function autres() {
    var o = ALL.filter(function (it) { return it.id !== N.id; }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); }).slice(0, 4);
    if (!o.length) return "";
    return '<section class="nd-box"><div class="nd-bh"><h2>Autres actualités</h2></div>' + o.map(function (it) {
      var c = (it.cats && it.cats[0]) || { nom: it.catNom || "News", c: it.catC || "#D4D4D8" };
      return '<a class="nd-o" href="/actus/' + esc(slug(it.fr || it.titre)) + "-" + esc(String(it.id).slice(-8)) + '">' + (it.cover ? '<img src="' + esc(couv(it.cover, 160)) + '" alt="" loading="lazy">' : '<span class="ph"></span>') +
        '<span><i class="om"><em style="font-style:normal;color:' + esc(c.c) + '">' + esc(c.nom) + "</em> · " + esc(dShort(it.date)) + "</i><b>" + esc(it.fr || it.titre) + '</b><p data-full="' + esc(it.accroche || it.texte || "") + '">' + esc(it.texte || "") + "</p></span></a>";
    }).join("") + '<a class="nd-btn nd-more" href="/?vue=actus">Toutes les actualités</a></section>';
  }
  var ADMC = false;
  function outils(c) {
    var h = (c.e ? "<span>Modifié</span>" : "") + (c.moi ? '<button type="button" data-cedit="' + esc(c.d) + '">Modifier</button>' : "") +
      (ADMC && c.h ? '<button type="button" data-chist="' + esc(c.d) + '">Versions précédentes</button>' : "") +
      (ADMC ? '<button type="button" class="del" data-cdel="' + esc(c.d) + '">Supprimer</button>' : "");
    return h ? '<div class="cmt">' + h + "</div>" : "";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cedit],[data-cdel],[data-chist],[data-csave],[data-ccancel]"); if (!b || !N) return;
    var it = b.closest("[data-cd]"), d = it && it.getAttribute("data-cd"), c = CM.find(function (x) { return x.d === d; }); if (!c) return;
    if (b.hasAttribute("data-chist")) { var hx = it.querySelector(".cmh"); if (hx) { hx.remove(); return; }
      it.querySelector(".cmt").insertAdjacentHTML("afterend", '<div class="cmh">' + c.h.slice().reverse().map(function (v) { return "<p>« " + esc(v.t) + " » · " + ago(v.d) + "</p>"; }).join("") + "</div>"); return; }
    if (b.hasAttribute("data-cedit")) { var p = it.querySelector("p"); p.hidden = true; it.querySelector(".cmt").hidden = true;
      p.insertAdjacentHTML("afterend", '<div class="cme"><textarea maxlength="600" aria-label="Modifier ton commentaire">' + esc(c.t) + '</textarea><div><button type="button" class="ok" data-csave>Enregistrer</button><button type="button" data-ccancel>Annuler</button></div></div>');
      it.querySelector("textarea").focus(); return; }
    if (b.hasAttribute("data-ccancel")) { refaire(); return; }
    if (b.hasAttribute("data-csave")) { var t = it.querySelector("textarea").value.trim(); if (!t) return; b.disabled = true;
      fetch("/api/comments", { method: "PATCH", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: N.id, d: d, text: t }) })
        .then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { var i = CM.indexOf(c); CM[i] = Object.assign({}, c, j.item, ADMC ? { h: (c.h || []).concat(c.t !== t ? [{ t: c.t, d: c.e || c.d }] : []) } : {}); refaire(); } else { alert(j.error || "Impossible d'enregistrer."); b.disabled = false; } }); return; }
    if (b.hasAttribute("data-cdel")) { if (!confirm("Supprimer ce commentaire de " + c.n + " ?")) return;
      fetch("/api/comments", { method: "DELETE", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: N.id, d: d }) })
        .then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { CM = CM.filter(function (x) { return x.d !== d; }); refaire(); } else alert(j.error || "Impossible de supprimer."); }); }
  });
  function refaire() { render(); var o = document.getElementById("cm"); if (o && !o.hidden) sheet(); }
  function comD() {
    if (!STORED) return '<section class="nd-box nd-com"><div class="nd-bh"><h2>Commentaires</h2></div><p class="nd-none">Commentaires bientôt disponibles.</p></section>';
    var last = CM.slice(-3).reverse();
    return '<section class="nd-box nd-com" id="commentaires" aria-label="Commentaires"><div class="nd-bh row"><h2>Commentaires' + (CM.length ? " · " + CM.length : "") + "</h2></div>" + addBox() +
      last.map(function (c) { return '<div class="nd-cm" data-cd="' + esc(c.d) + '">' + av(c, "cm-av") + "<div><b>" + esc(c.n) + "</b><small>il y a " + ago(c.d) + "</small><p>" + esc(c.t) + "</p>" + outils(c) + "</div></div>"; }).join("") +
      (CM.length > 3 ? '<button type="button" class="nd-btn nd-more" data-open>Voir les ' + CM.length + " commentaires</button>" : "") + "</section>";
  }
  function renderD() {
    root.classList.add("nd");
    var cs = N.cats && N.cats.length ? N.cats : [{ nom: N.catNom || "News", c: N.catC || "#D4D4D8" }], titre = N.fr || N.titre;
    document.title = titre + " : " + (N.texte || "").slice(0, 60) + " | FuryoGang";
    var pos = N.pos == null ? 0 : N.pos;
    root.innerHTML = '<div class="nd-hero' + (N.cover ? "" : " noimg") + '">' + (N.cover ? '<img src="' + esc(couv(N.cover, 1600)) + '" alt="Image de la news : ' + esc(titre) + '" style="object-position:center ' + pos + '%">' + (N.credit ? '<span class="cr">' + esc(N.credit) + "</span>" : "") : "") +
      '<a class="nd-crumb" href="/?vue=actus">← Toutes les actualités</a>' +
      '<div class="nd-tx"><span class="nd-date">' + esc(rel(N.date)) + '</span><span class="na-pills">' + cs.map(function (c) { return '<span class="na-pill" style="background:' + c.c + '">' + esc(c.nom) + "</span>"; }).join("") + "</span><h1>" + esc(titre) + "</h1>" +
      (N.jp ? '<span class="nd-jp" lang="ja">' + esc(N.jp) + "</span>" : "") + "</div></div>" +
      '<div class="nd-grid"><div class="nd-col"><main class="nd-box nd-main"><p class="na-text">' + esc(N.texte) + "</p>" + vid(N.video) +
      (N.src ? '<div class="nd-src"><span>Source</span><a href="' + esc(N.src) + '" target="_blank" rel="noopener">' + esc((N.srcName || "Officielle") + (handle(N.src) ? " · " + handle(N.src) : "")) + ARR + "</a></div>" : "") + acts() + "</main>" + comD() + "</div>" +
      '<aside class="nd-col">' + fiche() + dernier() + autres() + mangakas() + "</aside></div>";
  }
  DESK.addEventListener("change", function () { render(); });
  // Fenêtre des commentaires
  function sheet() {
    var box = document.getElementById("cm");
    if (!box) { box = document.createElement("div"); box.className = "cm"; box.id = "cm"; document.body.appendChild(box); box.addEventListener("click", function (e) { if (e.target === box) close(); }); }
    var list = CM.length ? CM.map(function (c) {
      return '<div class="cm-it" data-cd="' + esc(c.d) + '">' + av(c, "cm-av") +
        "<div><small><b>" + esc(c.n) + "</b> · " + ago(c.d) + "</small><p>" + esc(c.t) + "</p>" + outils(c) + "</div></div>";
    }).join("") : '<p class="cm-none">' + (STORED ? "Aucun commentaire pour l'instant." : "Les commentaires arrivent bientôt.") + "</p>";
    var form = !STORED ? "" : member() ? '<form class="cm-form" id="cm-form"><label class="sr" for="cm-in">Ton commentaire</label><input id="cm-in" maxlength="600" placeholder="Ajouter un commentaire…" autocomplete="off"><button type="submit" id="cm-go" disabled>Publier</button></form>'
      : '<button type="button" class="cm-login" id="cm-login">Devenir membre pour commenter</button>';
    box.innerHTML = '<div class="cm-box" role="dialog" aria-label="Commentaires"><div class="cm-grip"><span></span></div><h2>Commentaires</h2><div class="cm-list" id="cm-list">' + list + "</div>" + form + "</div>";
    box.hidden = false; document.body.style.overflow = "hidden";
    var l = document.getElementById("cm-list"); l.scrollTop = l.scrollHeight;
    var f = document.getElementById("cm-form");
    if (f) {
      var inp = document.getElementById("cm-in"), go = document.getElementById("cm-go");
      inp.addEventListener("input", function () { go.disabled = !inp.value.trim(); });
      f.addEventListener("submit", function (e) {
        e.preventDefault(); var t = inp.value.trim(); if (!t) return; go.disabled = true;
        fetch("/api/comments", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: N.id, text: t }) })
          .then(function (r) { return r.json(); }).then(function (j) { if (j.ok) { CM.push(j.item); render(); sheet(); } else { alert(j.error || "Impossible de publier."); go.disabled = false; } });
      });
    }
    var lg = document.getElementById("cm-login"); if (lg) lg.onclick = function () { close(); if (window.FG_LOGIN) FG_LOGIN(); };
  }
  function close() { var b = document.getElementById("cm"); if (b) b.hidden = true; document.body.style.overflow = ""; }
  addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });

  root.addEventListener("click", function (e) {
    if (e.target.closest("[data-open]")) { sheet(); return; }
    var so = e.target.closest("[data-soon]");
    if (so) { if (!member()) { if (window.FG_LOGIN) FG_LOGIN(); return; }
      if (so.dataset.soon === "suivre" && !(CTX && CTX.serie)) return;
      if (so.dataset.soon === "suivre" && CTX && CTX.serie) { fetch("/api/follow", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ s: CTX.serie.slug }) }).then(function (r) { return r.json(); }).then(function (j) { if (j.ok && j.stored) { FOLLOW = j.on; render(); } }); return; }
      so.textContent = "Bientôt disponible"; return; }
    if (e.target.closest("#na-share")) { var u = location.href; if (navigator.share) navigator.share({ title: document.title, url: u }).catch(function () {}); else if (navigator.clipboard) navigator.clipboard.writeText(u); return; }
    var a = e.target.closest("[data-act]"); if (!a) return;
    if (!member()) { if (window.FG_LOGIN) FG_LOGIN(); return; }
    fetch("/api/stats", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: N.id, act: a.dataset.act }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (!j.ok) return;
        if (!j.stored) { alert("Les likes et signets seront actifs dès que le stockage du site sera branché."); return; }
        if (a.dataset.act === "like") { ST.l = j.n; ST.ml = j.on; } else { ST.b = j.n; ST.mb = j.on; }
        document.getElementById("na-acts").outerHTML = acts();
      });
  });

  // Affichage immédiat avec les news déjà chargées par l'accueil (gardées dans le téléphone), puis mise à jour par le réseau.
  var trouve = function (items) { return items.filter(function (it) { return key.length >= 6 && it.id.slice(-key.length) === key; })[0] || items.filter(function (it) { return it.id.indexOf(key) === 0; })[0]; };
  try { ALL = JSON.parse(localStorage.getItem("fg-news") || "[]"); var vite = trouve(ALL); if (vite) { N = vite; render(); } } catch (e) {}
  get("/api/news").then(function (j) {
    var items = (j && j.items) || []; ALL = items;
    try { if (items.length) localStorage.setItem("fg-news", JSON.stringify(items)); } catch (e) {}
    var avant = N;
    N = items.filter(function (it) { return key.length >= 6 && it.id.slice(-key.length) === key; })[0] || items.filter(function (it) { return it.id.indexOf(key) === 0; })[0]; // fin de l'id (unique) ; le début pour les anciens liens
    if (!N && avant && !items.length) N = avant; // réseau coupé : on garde la version déjà affichée
    if (!N) { root.innerHTML = '<p class="na-empty">Cette actualité n\'existe plus. <a href="/">Retour aux actualités</a></p>'; return; }
    if (!avant || JSON.stringify(avant) !== JSON.stringify(N)) render();
    if (location.hash === "#commentaires") { if (DESK.matches) { var cbox = document.getElementById("commentaires"); if (cbox) cbox.scrollIntoView(); } else sheet(); }
    get("/api/actu?id=" + N.id).then(function (c) { if (c && !c.error) { CTX = c; render();
      if (c.serie) get("/api/follow?s=" + encodeURIComponent(c.serie.slug)).then(function (f) { if (f && f.ok) { FOLLOW = !!f.on; render(); } }); } });
    // Une vue par news et par session
    try { if (!sessionStorage.getItem("v-" + N.id)) { sessionStorage.setItem("v-" + N.id, "1"); fetch("/api/stats", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: N.id, act: "view" }) }); } } catch (e) {}
    get("/api/stats?ids=" + N.id).then(function (s) { if (s && s.stats) { ST = s.stats[N.id] || {}; STORED = s.stored !== false; render(); } });
    get("/api/comments?id=" + N.id).then(function (c) { if (c) { CM = c.items || []; ADMC = !!c.admin; STORED = c.stored !== false; render(); var o = document.getElementById("cm"); if (o && !o.hidden) sheet(); } });
  });
  get("/api/auth/me").then(function (j) { ME = j; if (N && member()) render(); });
})();
</script>
</body>
</html>
