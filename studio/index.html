<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Studio réseaux · FuryoGang</title>
<style>
/* Studio : génère les visuels réseaux sociaux (4:5, 1080×1350) d'un tome, à partir des données du calendrier. */
@font-face{font-family:"Antonio";src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:"Inter";src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"Noto Sans JP";src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900}
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--red:#BC002D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:"Inter",system-ui,sans-serif;font-weight:500}
.page{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Antonio",sans-serif;font-weight:700;font-size:44px;text-transform:uppercase;margin:0 0 4px}
.sub{margin:0 0 16px;color:var(--paper-2)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
select,button{font:inherit;height:42px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);padding:0 14px}
button{font-weight:700;cursor:pointer}
button.main{background:var(--red)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.slot h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.frame{width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;border-radius:10px}
.frame>.card{position:absolute;left:0;top:0;transform-origin:0 0}
.caption{margin-top:24px}
.caption textarea{width:100%;min-height:190px;border:0;border-radius:14px;background:var(--ink-2);color:var(--paper);font:inherit;font-size:14px;line-height:1.5;padding:14px}

/* ---------- La carte 1080×1350 ---------- */
.card{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:"Inter",sans-serif;--fg:#fff;--bg:#0c0c0e;--muted:rgba(255,255,255,.62);background:var(--bg);color:var(--fg)}
.card.light{--fg:#0c0c0e;--bg:#F2EFE9;--muted:rgba(12,12,14,.6)}
/* Design « Soleil » : fond flouté tiré de la couverture, cercle rouge, couverture encadrée. */
.card.a{--cy:566px;--r:400px;--cream:#F2EFE9;--frame:#000}
.card.a.light{--frame:#fff}
/* Couverture très sombre sur fond sombre : cadre blanc pour qu'on voie ses bords */
.card.a.dark.dkcov{--frame:#fff}
.card.a .blur{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.5}
.card.a.light .blur{opacity:.28}
.card.a .shade{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 35%,transparent) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 48%,var(--bg) 76%)}
.card.a .sun{position:absolute;width:calc(var(--r) * 2);height:calc(var(--r) * 2);border-radius:50%;background:var(--red);left:50%;top:calc(var(--cy) - var(--r));transform:translateX(-50%)}
.card.a .logo{position:absolute;left:50%;top:46px;transform:translateX(-50%);width:290px}
.card.a .cover{position:absolute;left:50%;top:calc(var(--cy) - 380px);width:543px;height:760px;transform:translateX(-50%);object-fit:cover;box-sizing:border-box;border:12px solid var(--frame);box-shadow:0 40px 90px rgba(0,0,0,.55)}
/* Numéro du tome : deux calques identiques. Hors du cercle il prend la couleur du texte, dans le cercle celle du fond. */
.card.a .numw{position:absolute;inset:0;pointer-events:none}
.card.a .numw.in{clip-path:circle(var(--r) at 50% var(--cy))}
.card.a .num{position:absolute;left:30px;top:var(--cy);transform:translateY(-50%);font-family:"Antonio",sans-serif;font-weight:700;font-size:230px;line-height:.8;letter-spacing:-.02em;color:var(--fg)}
.card.a .numw.in .num{color:var(--bg)}
.card.a.light .numw.in .num{color:var(--cream)}
/* Titre japonais : dans la bande à droite du cercle, jamais dessus, centré sur le cercle */
.card.a .jpw{position:absolute;left:calc(50% + var(--r));right:0;top:var(--cy);transform:translateY(-50%);display:flex;justify-content:center}
.card.a .jp{writing-mode:vertical-rl;font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:var(--js,56px);line-height:1;letter-spacing:.06em;color:var(--fg);max-height:720px;overflow:hidden;white-space:nowrap}
/* Infos sous le cercle, avec de l'air au-dessus et en dessous */
.card.a .info{position:absolute;left:64px;right:64px;top:calc(var(--cy) + var(--r) + 34px);display:flex;flex-direction:column;align-items:center;text-align:center}
.card.a .title{font-family:"Antonio",sans-serif;font-weight:700;font-size:108px;line-height:.92;text-transform:uppercase;letter-spacing:.005em;margin:0}
.card.a .title.s{font-size:88px}.card.a .title.xs{font-size:68px}
.card.a .date{margin-top:18px;align-self:center;font-family:"Antonio",sans-serif;font-weight:700;font-size:40px;letter-spacing:.06em;text-transform:uppercase;background:var(--red);color:#fff;padding:6px 22px;border-radius:6px}
.card.a .who{margin-top:16px}

/* ---------- Commun ---------- */
.card .who{margin-top:14px;font-family:"Antonio",sans-serif;font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .who b{color:var(--fg);font-weight:700}
.card .who i{font-style:normal;margin:0 14px;opacity:.5}

</style>
</head>
<body>
<div class="page">
  <h1>Studio réseaux</h1>
  <p class="sub">Visuel 4:5 (1080 × 1350) prêt pour Instagram et X, en version sombre et claire.</p>
  <div class="pick"><select id="sel" aria-label="Tome"></select><button class="main" id="dlAll">Télécharger tous les PNG</button></div>
  <div class="pair" id="pair"></div>
  <div class="caption"><h2 style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:0 0 8px">Texte du post</h2><textarea id="cap"></textarea></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const tn = n => (Number.isInteger(n) && n < 10) ? "0" + n : String(n);
const FLAG = {
  Japon: '<svg viewBox="0 0 22 15"><rect width="22" height="15" fill="#fff"/><circle cx="11" cy="7.5" r="4.4" fill="#BC002D"/></svg>',
  France: '<svg viewBox="0 0 22 15"><rect width="7.34" height="15" fill="#2F5DA8"/><rect x="7.33" width="7.34" height="15" fill="#fff"/><rect x="14.66" width="7.34" height="15" fill="#E5483A"/></svg>'
};
let ITEMS = [], cur = null;
const cov = it => it.cover ? "/api/couv?u=" + encodeURIComponent(it.cover) : "";
const titleOf = it => it.pays === "France" && it.fr ? it.fr : (it.series || it.tome);
function dateLong(it){ const d = new Date(it.date + "T12:00:00"); return it.prec === "Mois" ? `${MOIS[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; }
// Titre japonais vertical : si le titre original est en lettres latines, on prend la lecture entre parenthèses (ex. JUMBO MAX（ジャンボマックス）).
const CJK = /[\u3040-\u30ff\u3400-\u9fff]/;
function jpOf(it){ const j = it.jp || ""; const out = j.replace(/[（(].*?[)）]/g, "").trim(); if (CJK.test(out)) return out; const m = j.match(/[（(](.*?)[)）]/); return m && CJK.test(m[1]) ? m[1] : ""; }
const isNext = it => it.date >= new Date().toISOString().slice(0, 10);
const MCOURT = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function who(it){
  const s = it.scen, d = it.dess;
  if (s && d && s !== d) return `Histoire <b>${esc(s)}</b><i>·</i>Dessin <b>${esc(d)}</b>`;
  const one = s || d || it.auteurs; return one ? `<b>${esc(one)}</b>` : "";
}
const jsz = (txt, max, room) => Math.min(max, Math.floor(room / (Math.max(1, [...txt].length) * 1.12))) + "px";
const gsz = t => Math.min(260, Math.floor(1850 / Math.max(1, t.length))) + "px";
const size = (t, a, b) => t.length > b ? "xs" : t.length > a ? "s" : "";
const LOGO = theme => `/img/social/logo-${theme === "light" ? "noir" : "blanc"}.png`;
const LAYOUTS = {
  a: { nom: "Soleil", html(it, theme){
    const t = titleOf(it), j = jpOf(it), n = it.n != null ? tn(it.n) : "";
    return `<div class="card a ${theme}">
      ${it.cover ? `<div class="blur" style="background-image:url('${cov(it)}')"></div>` : ""}<div class="shade"></div><div class="sun"></div>
      <img class="logo" src="${LOGO(theme)}" alt="FuryoGang">
      ${it.cover ? `<img class="cover" src="${cov(it)}" alt="">` : ""}
      ${n ? `<div class="numw"><div class="num">${n}</div></div><div class="numw in"><div class="num">${n}</div></div>` : ""}
      ${j ? `<div class="jpw"><div class="jp" lang="ja" style="--js:${jsz(j, 56, 640)}">${esc(j)}</div></div>` : ""}
      <div class="info"><div class="title ${size(t, 16, 26)}">${esc(t)}</div>
        <span class="date">${esc(dateLong(it))}</span>
        ${who(it) ? `<div class="who">${who(it)}</div>` : ""}</div>
    </div>`; } },
};
function fit(){ document.querySelectorAll(".frame").forEach(f => { const c = f.querySelector(".card"); if (c) c.style.transform = `scale(${f.clientWidth / 1080})`; }); }
function caption(it){
  const t = titleOf(it), when = dateLong(it);
  const tags = ["#manga", "#FuryoGang", "#" + t.replace(/[^A-Za-z0-9À-ÿ]/g, ""), it.pub ? "#" + it.pub.replace(/[^A-Za-z0-9À-ÿ]/g, "") : ""].filter(Boolean).join(" ");
  return `${t} tome ${it.n ?? ""} ${it.date >= new Date().toISOString().slice(0,10) ? "sort le" : "est sorti le"} ${when} chez ${it.pub || "?"}${it.pays === "Japon" ? " au Japon" : ""} 🔥\n\n${it.resume || ""}\n\n${tags}`;
}
// Bords de la couverture presque noirs ? (moyenne de luminosité sur une bande de 6 % autour de l'image)
function darkEdges(img){
  try {
    const W = 60, H = 84, c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, W, H);
    const d = x.getImageData(0, 0, W, H).data; let sum = 0, n = 0;
    for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
      if (i > 3 && i < W - 4 && y > 4 && y < H - 5) continue;
      const k = (y * W + i) * 4; sum += .2126 * d[k] + .7152 * d[k + 1] + .0722 * d[k + 2]; n++;
    }
    return sum / n < 45;
  } catch (e) { return false; }
}
function show(id){
  cur = ITEMS.find(x => x.id === id) || ITEMS[0]; if (!cur) return;
  document.getElementById("pair").innerHTML = Object.entries(LAYOUTS).flatMap(([k, L]) => ["dark", "light"].map(th =>
    `<div class="slot"><h2>${L.nom} · ${th === "light" ? "clair" : "sombre"} <button data-dl="${k}-${th}">PNG</button></h2><div class="frame" id="f-${k}-${th}">${L.html(cur, th)}</div></div>`)).join("");
  document.getElementById("cap").value = caption(cur);
  history.replaceState(null, "", "?id=" + cur.id); fit();
  document.querySelectorAll(".card.a.dark img.cover").forEach(img => { const go = () => { if (darkEdges(img)) img.closest(".card").classList.add("dkcov"); }; img.complete ? go() : img.addEventListener("load", go, { once: true }); });
}
async function dl(key){
  const node = document.querySelector(`#f-${key} .card`);
  const keep = node.style.transform; node.style.transform = "none";
  try {
    const url = await htmlToImage.toPng(node, { width: 1080, height: 1350, pixelRatio: 1 });
    const a = document.createElement("a"); a.href = url; a.download = `${titleOf(cur).replace(/\W+/g, "-")}-T${tn(cur.n)}-${key}.png`; a.click();
  } finally { node.style.transform = keep; fit(); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-dl]"); if (b) dl(b.dataset.dl); });
document.getElementById("dlAll").onclick = async () => { for (const b of document.querySelectorAll("[data-dl]")) await dl(b.dataset.dl); };
document.getElementById("sel").onchange = e => show(e.target.value);
addEventListener("resize", fit);
fetch("/api/calendrier").then(r => r.json()).then(j => {
  ITEMS = (j.items || []).filter(it => it.cover);
  const sel = document.getElementById("sel");
  sel.innerHTML = ITEMS.map(it => `<option value="${it.id}">${esc(it.date)} · ${esc(titleOf(it))} T.${tn(it.n)} (${esc(it.pays)})</option>`).join("");
  const want = new URLSearchParams(location.search).get("id");
  const today = new Date().toISOString().slice(0, 10);
  const def = (ITEMS.find(x => x.id === want) || ITEMS.find(x => x.date >= today) || ITEMS[0]);
  if (def) { sel.value = def.id; show(def.id); }
});
</script>
</body>
</html>
