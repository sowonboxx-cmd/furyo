<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Studio · Nouvelle fiche · FuryoGang</title>
<style>
/* Studio « Nouvelle fiche » : design « Dossier » choisi par Will, en crème et en sombre,
   au format post (3:4, 1080×1440) et story (9:16, 1080×1920, avec marges pour l'encoche et les boutons d'Instagram). */
@font-face{font-family:"Antonio";src:url(/fonts/Antonio.ttf) format("truetype");font-weight:100 700}
@font-face{font-family:"Inter";src:url(/fonts/Inter.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"Noto Sans JP";src:url(/fonts/NotoSansJP.ttf) format("truetype");font-weight:100 900}
:root{--ink:#232325;--ink-2:#000;--ink-3:#38383B;--paper:#F5F5F7;--paper-2:#CFCFD4;--paper-3:#98989D;--red:#BC002D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--paper);font-family:"Inter",system-ui,sans-serif;font-weight:500}
.page{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:"Antonio",sans-serif;font-weight:700;font-size:44px;text-transform:uppercase;margin:0 0 4px}
.sub{margin:0 0 16px;color:var(--paper-2)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
select,button,input{font:inherit;height:42px;border:0;border-radius:12px;background:var(--ink-3);color:var(--paper);padding:0 14px}
input{width:110px}
label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--paper-2)}
button{font-weight:700;cursor:pointer}
button.main{background:var(--red)}
.pair{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;align-items:start}
.slot h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.slot h2 button{height:32px;font-size:12px}
.frame{width:100%;position:relative;overflow:hidden;border-radius:10px}
.frame.post{aspect-ratio:3/4}.frame.story{aspect-ratio:9/16}
.frame>.card{position:absolute;left:0;top:0;transform-origin:0 0}
.frame .safe{position:absolute;left:0;right:0;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,80,80,.18) 0 6px,transparent 6px 12px);display:none}
.show-safe .frame .safe{display:block}

/* Légendes réseaux */
.caps{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cap-b h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-3);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cap-b h2 span{font-weight:600;letter-spacing:0;text-transform:none}
.cap-b h2 span.over{color:#F08A7E}
.cap-b textarea{width:100%;min-height:300px;border:0;border-radius:14px;background:var(--ink-2);color:var(--paper);font:inherit;font-size:14px;line-height:1.5;padding:14px;resize:vertical}
.cap-b button{height:34px;font-size:12px}
.cap-act{display:flex;gap:8px;align-items:center;margin-top:14px}
.cap-act small{color:var(--paper-3)}
/* ---------- Carte « Dossier » ---------- */
.card{width:1080px;height:1440px;position:relative;overflow:hidden;font-family:"Inter",sans-serif;display:flex;flex-direction:column;
  --bg:#F2EFE9;--fg:#0c0c0e;--muted:rgba(12,12,14,.58);--track:rgba(12,12,14,.12);--on:#0c0c0e;--res:#26262a;--bar:#0c0c0e;
  --safe-top:0px;--safe-bot:0px;background:var(--bg);color:var(--fg)}
.card.dark{--bg:#121214;--fg:#F5F5F7;--muted:rgba(245,245,247,.58);--track:rgba(245,245,247,.13);--on:#F5F5F7;--res:#D9D9DE;--bar:#000}
.card.story{height:1920px;--safe-top:200px;--safe-bot:250px}
.card .A{font-family:"Antonio",sans-serif;font-weight:700;text-transform:uppercase}
.card .top{flex:none;background:var(--bar);padding:calc(var(--safe-top) + 36px) 64px 36px;display:flex;align-items:center;justify-content:space-between}
.card.dark .top{border-bottom:1px solid rgba(255,255,255,.08)}
.card .top img{width:250px;display:block}
.card .top .A{color:#fff;font-size:52px;letter-spacing:.06em;line-height:1}
.card .top .A span{color:#E0123F}
.card .main{flex:1;min-height:0;display:flex;flex-direction:column;padding:56px 64px calc(var(--safe-bot) + 60px)}
.card .hero{display:flex;gap:46px;align-items:flex-start;flex:none}
.card .cover{flex:none;width:400px;height:560px;object-fit:cover;border:10px solid #fff;box-shadow:0 24px 60px rgba(0,0,0,.28);background:#222}
.card.story .cover{width:410px;height:574px}
/* Post 3:4 : la hauteur en plus sert à grossir la couverture et les textes */
.card.post .cover{width:420px;height:588px}
.card.post dt,.card.post dd{font-size:31px}
.card.post dl{gap:14px 20px}
.card.post .res{margin-top:56px}
.card.post .res p{font-size:38px}
/* Story : plus de hauteur, donc tout un peu plus grand */
.card.story .main{padding-top:64px}
.card.story .t{font-size:108px}
.card.story .jp{font-size:32px}
.card.story dt,.card.story dd{font-size:32px}
.card.story dl{gap:16px 20px;margin-top:30px}
.card.story .res{margin-top:56px}
.card.story .res p{font-size:39px}
.card.story .row .A{font-size:50px}
.card.story .seg i{height:40px}
.card.story .cap{font-size:32px}
.card .info{flex:1;min-width:0;position:relative}
.card .kick{display:inline-flex;align-items:center;height:56px;padding:0 22px;border-radius:6px;background:var(--red);color:#fff;font-family:"Antonio",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:34px;line-height:1}
.card .kick span{display:block;transform:translateY(-1px)}
.card .t{margin:20px 0 0;font-size:96px;line-height:.92;overflow-wrap:anywhere}
.card .jp{margin-top:12px;font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:30px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card dl{margin:26px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 20px;align-items:baseline}
.card dt{font-family:"Antonio",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:30px;line-height:1.15;white-space:nowrap}
.card dd{margin:0;font-weight:700;font-size:30px;line-height:1.15;white-space:nowrap;overflow:hidden}
.card .cv{position:relative;flex:none}
.card .res{flex:1;min-height:0;margin:52px 0 0;overflow:hidden}
.card .res p{margin:0;font-size:36px;line-height:1.42;color:var(--res);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,5);overflow:hidden}
.card .res b{font-family:"Antonio",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red);margin-right:12px}
.card .prog{flex:none;margin-top:24px}
.card .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.card .row .A{font-size:46px;letter-spacing:.03em;line-height:1}
.card .row .A span{color:var(--muted)}
.card .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:6px}
.card .seg i{height:36px;border-radius:4px;background:var(--track)}
.card .seg i.on{background:var(--on)}
.card .seg i.part{background:linear-gradient(90deg,var(--red) var(--p),var(--track) var(--p))}
.card .cap{margin-top:16px;font-size:30px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div class="page">
  <h1>Nouvelle fiche</h1>
  <p class="sub">Design « Dossier », en crème et en sombre, pour le post Instagram (3:4) et la story (9:16).</p>
  <div class="pick">
    <select id="sel" aria-label="Série"></select>
    <label>N° <input id="n" type="number" min="1"></label>
    <label>sur <input id="tot" type="number" min="1"></label>
    <label><input id="safe" type="checkbox" style="width:auto;height:auto"> Montrer les zones cachées (story)</label>
    <button class="main" id="dlAll">Télécharger les 4 PNG</button>
  </div>
  <div class="pair" id="pair"></div>
  <div class="cap-act"><button class="main" id="saveCaps">Enregistrer les légendes dans Notion</button><small id="capMsg">Modifie les textes si besoin avant d'enregistrer (il faut être connecté au back-office).</small></div>
  <div class="caps" id="caps"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOGO_B = "/img/social/logo-blanc.png";
const VARIANTS = [["creme", "post", "Crème · post 3:4"], ["dark", "post", "Sombre · post 3:4"], ["creme", "story", "Crème · story 9:16"], ["dark", "story", "Sombre · story 9:16"]];
const SIZE = { post: [1080, 1440], story: [1080, 1920] };
let LIST = [], AV = null, cur = null;
const couv = u => u ? "/api/couv?u=" + encodeURIComponent(u) : "";
const shown = s => (s.t && s.fr && s.t === s.t.toUpperCase() && /[A-Z]/.test(s.t) && s.t.toLowerCase() === s.fr.toLowerCase()) ? s.t : (s.fr || s.t);
const pad = d => String(d.n).padStart(Math.max(3, String(d.tot).length), "0");
const pctTxt = d => (Math.round(d.n / d.tot * 1000) / 10).toLocaleString("fr-FR") + " %";
const parts = s => String(s || "").split(/\s*[,&/]\s*|\s+et\s+/).map(x => x.trim()).filter(Boolean);

function card(d, theme, fmt){
  const p = d.n / d.tot * 20;
  const rows = [
    ["Histoire", d.scen ? parts(d.scen) : []],
    ["Dessin", d.dess && d.dess !== d.scen ? parts(d.dess) : []],
    ["Type", d.type ? [d.type] : []],
    ["Genres", d.genres || []],
    ["Début", d.y1 ? [String(d.y1)] : []],
    ["En France", d.pubs || []],
  ].filter(r => r[1].length);
  return `<div class="card ${theme} ${fmt}">
    <div class="top"><img src="${LOGO_B}" alt=""><span class="A">Fiche <span>n°${pad(d)}</span></span></div>
    <div class="main">
      <div class="hero">
        <div class="cv">${d.cover ? `<img class="cover" src="${couv(d.cover)}" alt="">` : `<div class="cover"></div>`}</div>
        <div class="info"><span class="kick"><span>Nouvelle fiche</span></span>
          <p class="t A">${esc(d.t)}</p>${d.jp ? `<div class="jp" lang="ja">${esc(d.jp)}</div>` : ""}
          <dl>${rows.map(r => `<dt>${r[0]}</dt><dd data-items="${esc(JSON.stringify(r[1]))}">${esc(r[1].join(", "))}</dd>`).join("")}</dl>
        </div>
      </div>
      <div class="res">${d.resume ? `<p><b>Résumé</b>${esc(d.resume)}</p>` : ""}</div>
      <div class="prog"><div class="row"><span class="A">La base FuryoGang · ${d.n} <span>/ ${d.tot}</span></span><span class="A">${pctTxt(d)}</span></div>
        <div class="seg">${Array.from({ length: 20 }, (_, i) => i + 1 <= Math.floor(p) ? '<i class="on"></i>' : i < p ? `<i class="part" style="--p:${Math.round((p - i) * 100)}%"></i>` : "<i></i>").join("")}</div>
        <div class="cap">De nouvelles fiches chaque semaine</div></div>
    </div></div>`;
}
// Mise en page fine, une fois les polices chargées : titre sur 2 lignes maximum, chaque info sur une seule ligne
// (on garde autant de noms ou de genres que la place permet), résumé coupé à la dernière ligne entière.
function polish(c){
  const t = c.querySelector(".t");
  const big = c.classList.contains("story") ? 108 : 96;
  for (let s = big; s >= 52; s -= 4) { t.style.fontSize = s + "px"; if (t.offsetHeight <= s * 0.92 * 2 + 4) break; }
  c.querySelectorAll("dd[data-items]").forEach(dd => {
    const items = JSON.parse(dd.dataset.items);
    for (let k = items.length; k >= 1; k--) {
      dd.textContent = items.slice(0, k).join(", ");
      if (dd.scrollWidth <= dd.clientWidth + 1) break;
      if (k === 1) dd.style.textOverflow = "ellipsis";
    }
  });
  const res = c.querySelector(".res"), p = res.querySelector("p");
  if (p) { const lh = parseFloat(getComputedStyle(p).lineHeight); p.style.setProperty("--lines", Math.max(2, Math.floor(res.clientHeight / lh))); }
}
function fit(){ document.querySelectorAll(".frame").forEach(f => { const c = f.querySelector(".card"); if (c) c.style.transform = `scale(${f.clientWidth / 1080})`; }); }
function draw(){
  if (!cur) return;
  document.getElementById("pair").innerHTML = VARIANTS.map(([th, fm, nom]) => `<div class="slot"><h2>${nom} <button data-dl="${th}-${fm}">PNG</button></h2>
    <div class="frame ${fm}" id="f-${th}-${fm}">${card(cur, th, fm)}${fm === "story" ? `<div class="safe" style="top:0;height:${200 / 19.2}%"></div><div class="safe" style="bottom:0;height:${250 / 19.2}%"></div>` : ""}</div></div>`).join("");
  fit();
  const go = () => document.querySelectorAll(".frame .card").forEach(polish);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(go);
}
// ---------- Légendes « Nouvelle fiche » ----------
// Tant que les comptes membres ne sont pas ouverts, on n'invite pas encore à s'inscrire.
const MEMBRES_OUVERTS = false;
const SITE = "furyo.pages.dev";
const TAGS = { "Furyō": ["furyo", "yankee"], "Furyō Old School": ["furyo"], "Yakuza": ["yakuza"], "Bōsōzoku": ["bosozoku"], "Crime": ["crime"], "Underground": ["underground"], "Gang": ["gang"], "Arts Martiaux": ["artsmartiaux"], "Combat de rue": ["streetfight"], "Thriller": ["thriller"], "Policier": ["polar"], "Drogue": ["drogue"], "Prison": ["prison"], "Lycée": ["lycee"], "Moto": ["moto"] };
const tagOf = t => "#" + String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]/g, "");
const phrases = (txt, n) => (String(txt || "").match(/[^.!?…]+[.!?…]+(\s|$)/g) || [txt || ""]).slice(0, n).join("").trim();
// @mentions des comptes officiels (auteurs d'abord, puis éditeurs, magazine, plateforme), réseau par réseau.
function mentions(d, net){
  const h = d.handles; if (!h) return "";
  return [...new Set([...(h.auteurs || []), ...(h.editeurs || [])].map(x => x[net]).filter(Boolean))].map(x => "@" + x).join(" ");
}
function caps(d){
  const url = `${SITE}/series/${d.slug}`;
  const auteurs = d.scen && d.dess && d.scen !== d.dess ? `Histoire ${d.scen} · Dessin ${d.dess}` : (d.scen || d.dess || "");
  const infos = [d.type, (d.genres || []).slice(0, 3).join(", "), d.y1 ? "depuis " + d.y1 : ""].filter(Boolean).join(" · ");
  const pays = [d.pubJP ? `🇯🇵 ${d.pubJP}${d.tomesJP ? ` (${d.tomesJP} tomes)` : ""}` : "", (d.pubs || []).length ? `🇫🇷 ${d.pubs.join(", ")}` : "🇫🇷 Pas encore en France"].filter(Boolean).join("\n");
  const tags = [...new Set([tagOf(d.t), "#manga", ...(d.genres || []).flatMap(g => (TAGS[g] || []).map(x => "#" + x)), d.type ? tagOf(d.type).toLowerCase() : "", "#FuryoGang"].filter(Boolean))];
  const membre = MEMBRES_OUVERTS ? "\n👉 Crée ton compte gratuit sur le site pour suivre tes séries." : "";
  const ig = `🆕 NOUVELLE FICHE · ${d.t.toUpperCase()}${d.jp ? ` (${d.jp})` : ""}

${phrases(d.resume, 2)}

✍️ ${auteurs}
📚 ${infos}
${pays}

📖 La fiche complète (tous les tomes, extraits, adaptations) est sur le site : lien en bio.${membre}
${mentions(d, "ig") ? "\n📣 " + mentions(d, "ig") + "\n" : ""}
Fiche n°${d.n} sur ${d.tot} · de nouvelles fiches chaque semaine.

${tags.concat(["#mangafr"]).slice(0, 12).join(" ")}`;
  const tt = `🆕 Nouvelle fiche : ${d.t}${d.jp ? ` (${d.jp})` : ""}

${phrases(d.resume, 1)}

${auteurs}
Tout sur la série : lien en bio 📖${membre}
${mentions(d, "tt") ? "\n📣 " + mentions(d, "tt") + "\n" : ""}
${tags.concat(["#mangatok", "#mangafr", "#manga"]).filter((v, i, a) => a.indexOf(v) === i).slice(0, 8).join(" ")}`;
  // X : 280 caractères, un lien compte pour 23. On raccourcit le résumé jamais le reste.
  const xBase = r => `🆕 Nouvelle fiche : ${d.t}${infos ? ` (${[d.type, d.y1].filter(Boolean).join(", ")})` : ""}\n\n${r}${r ? "\n\n" : ""}Tout sur la série 👉 ${url}\n${mentions(d, "x") ? mentions(d, "x") + "\n" : ""}${tags.slice(0, 3).join(" ")}`;
  const xLen = t => t.replace(url, "x".repeat(23)).length;
  let r = phrases(d.resume, 1), x = xBase(r);
  while (xLen(x) > 280 && r) { r = r.split(" ").slice(0, -1).join(" "); x = xBase(r ? r.replace(/[,;:]?$/, "…") : ""); }
  return { ig, tt, x, xLen };
}
function drawCaps(){
  if (!cur) return;
  const c = caps(cur);
  const box = (k, nom, txt, count) => `<div class="cap-b"><h2>${nom} <span id="n-${k}"></span><button data-copy="${k}">Copier</button></h2><textarea id="c-${k}" data-k="${k}">${esc(txt)}</textarea></div>`;
  document.getElementById("caps").innerHTML = box("ig", "Instagram", c.ig) + box("tt", "TikTok", c.tt) + box("x", "X (280 max)", c.x);
  const count = () => {
    const t = document.getElementById("c-x").value, n = c.xLen(t);
    const el = document.getElementById("n-x"); el.textContent = n + " / 280"; el.className = n > 280 ? "over" : "";
    ["ig", "tt"].forEach(k => { document.getElementById("n-" + k).textContent = document.getElementById("c-" + k).value.length + " car."; });
  };
  document.getElementById("caps").oninput = count; count();
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(document.getElementById("c-" + b.dataset.copy).value); b.textContent = "Copié ✓"; setTimeout(() => { b.textContent = "Copier"; }, 1500); } catch (err) {}
});
document.getElementById("saveCaps").onclick = async () => {
  const msg = document.getElementById("capMsg"); if (!cur || !cur.id) { msg.textContent = "Série inconnue."; return; }
  msg.textContent = "Enregistrement…";
  try {
    const r = await fetch("/api/admin/update", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: cur.id, slug: cur.slug, legIG: document.getElementById("c-ig").value, legTT: document.getElementById("c-tt").value, legX: document.getElementById("c-x").value }) });
    const j = await r.json().catch(() => ({}));
    msg.textContent = r.status === 401 ? "Connecte-toi d'abord au back-office (/admin/), puis réessaie." : r.ok ? "Légendes enregistrées dans Notion ✓" : (j.error || "Erreur");
  } catch (err) { msg.textContent = "Erreur réseau."; }
};
async function pick(slug){
  const s = LIST.find(x => x.slug === slug) || LIST[0]; if (!s) return;
  const rang = AV && (AV.series || []).find(x => x.slug === s.slug);
  cur = { id: s.id, slug: s.slug, t: shown(s), jp: s.jp, cover: s.cover, type: s.type, genres: s.genres || [], y1: s.y1,
    pubs: parts((s.pubFR || "").replace(/\s*\([^)]*\)/g, "")),
    n: rang ? rang.rang : (AV ? AV.enLigne : 1), tot: AV ? AV.total : 600, scen: "", dess: "", resume: "" };
  document.getElementById("n").value = cur.n; document.getElementById("tot").value = cur.tot;
  history.replaceState(null, "", "?s=" + s.slug); draw(); drawCaps();
  try { const j = await (await fetch("/api/serie?s=" + s.slug)).json(); if (j.serie && cur.slug === s.slug) { cur.scen = j.serie.scen; cur.dess = j.serie.dess; cur.resume = j.serie.resume || ""; cur.pubJP = j.serie.pubJP || ""; cur.tomesJP = j.serie.tomesJP; draw(); drawCaps(); }
    // Comptes officiels pour les @mentions (seulement si connecté au back-office).
    if (cur.id) { const r = await fetch("/api/admin/handles?id=" + cur.id); const m = document.getElementById("capMsg");
      if (r.ok) { const h = await r.json(); if (cur.slug === s.slug) { cur.handles = h; drawCaps(); } }
      else if (r.status === 401 && m) m.textContent = "Connecte-toi au back-office (/admin/) pour ajouter automatiquement les @ des auteurs et éditeurs."; } } catch (e) {}
}
async function dl(key){
  const [th, fm] = key.split("-"), [w, h] = SIZE[fm];
  const node = document.querySelector(`#f-${key} .card`), keep = node.style.transform; node.style.transform = "none";
  try { const url = await htmlToImage.toPng(node, { width: w, height: h, pixelRatio: 1 }); const a = document.createElement("a"); a.href = url; a.download = `nouvelle-fiche-${cur.slug}-${th}-${fm}.png`; a.click(); }
  finally { node.style.transform = keep; fit(); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-dl]"); if (b) dl(b.dataset.dl); });
document.getElementById("dlAll").onclick = async () => { for (const [th, fm] of VARIANTS) await dl(th + "-" + fm); };
document.getElementById("sel").onchange = e => pick(e.target.value);
document.getElementById("n").oninput = e => { cur.n = Math.max(1, +e.target.value || 1); draw(); drawCaps(); };
document.getElementById("tot").oninput = e => { cur.tot = Math.max(cur.n, +e.target.value || cur.n); draw(); drawCaps(); };
document.getElementById("safe").onchange = e => document.body.classList.toggle("show-safe", e.target.checked);
